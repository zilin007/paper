<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360">
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="36" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#111827">ICL 推理与打分流程</text>

  <rect x="40" y="90" width="180" height="180" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="68" y="126" font-family="sans-serif" font-size="18" font-weight="700" fill="#0c4a6e">1. 构造上下文</text>
  <text x="68" y="160" font-family="sans-serif" font-size="14" fill="#0f172a">指令</text>
  <text x="68" y="185" font-family="sans-serif" font-size="14" fill="#0f172a">示范 1</text>
  <text x="68" y="210" font-family="sans-serif" font-size="14" fill="#0f172a">示范 2</text>
  <text x="68" y="235" font-family="sans-serif" font-size="14" fill="#0f172a">query</text>

  <rect x="280" y="90" width="180" height="180" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="307" y="126" font-family="sans-serif" font-size="18" font-weight="700" fill="#4c1d95">2. 输入 LLM</text>
  <text x="307" y="160" font-family="sans-serif" font-size="14" fill="#111827">参数保持不变</text>
  <text x="307" y="185" font-family="sans-serif" font-size="14" fill="#111827">通过注意力读取</text>
  <text x="307" y="210" font-family="sans-serif" font-size="14" fill="#111827">前面示范中的规律</text>

  <rect x="520" y="90" width="180" height="180" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="549" y="126" font-family="sans-serif" font-size="18" font-weight="700" fill="#92400e">3. 候选打分</text>
  <text x="549" y="160" font-family="sans-serif" font-size="14" fill="#111827">Direct</text>
  <text x="549" y="185" font-family="sans-serif" font-size="14" fill="#111827">PPL</text>
  <text x="549" y="210" font-family="sans-serif" font-size="14" fill="#111827">Channel</text>

  <rect x="760" y="90" width="160" height="180" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="789" y="126" font-family="sans-serif" font-size="18" font-weight="700" fill="#166534">4. 输出答案</text>
  <text x="789" y="160" font-family="sans-serif" font-size="14" fill="#111827">选择分数最高</text>
  <text x="789" y="185" font-family="sans-serif" font-size="14" fill="#111827">或最稳定的答案</text>

  <path d="M220 180 L280 180" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M460 180 L520 180" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M700 180 L760 180" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
