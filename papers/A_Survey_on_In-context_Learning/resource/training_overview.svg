  <text x="718" y="164" font-family="sans-serif" font-size="14" fill="#111827">Direct / PPL</text>
  <text x="718" y="188" font-family="sans-serif" font-size="14" fill="#111827">Channel</text>

  <rect x="880" y="95" width="120" height="130" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="906" y="132" font-family="sans-serif" font-size="18" font-weight="700" fill="#166534">应用</text>
