  <text x="902" y="188" font-family="sans-serif" font-size="14" fill="#111827">多模态</text>

  <path d="M220 160 L250 160" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M430 160 L460 160" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M640 160 L670 160" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M850 160 L880 160" stroke="#6b7280" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
