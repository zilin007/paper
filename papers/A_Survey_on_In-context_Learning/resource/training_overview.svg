<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300">
  <rect width="1040" height="300" fill="#ffffff"/>
  <text x="36" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#111827">从训练增强到推理落地的 ICL 全景</text>

  <rect x="40" y="95" width="180" height="130" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="84" y="132" font-family="sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">Pretraining</text>
  <text x="68" y="164" font-family="sans-serif" font-size="14" fill="#111827">让模型更熟悉</text>
  <text x="68" y="188" font-family="sans-serif" font-size="14" fill="#111827">示范 + 查询格式</text>

  <rect x="250" y="95" width="180" height="130" rx="18" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="308" y="132" font-family="sans-serif" font-size="18" font-weight="700" fill="#3730a3">Warmup</text>
  <text x="282" y="164" font-family="sans-serif" font-size="14" fill="#111827">instruction tuning</text>
  <text x="282" y="188" font-family="sans-serif" font-size="14" fill="#111827">symbol tuning 等</text>

  <rect x="460" y="95" width="180" height="130" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="495" y="132" font-family="sans-serif" font-size="18" font-weight="700" fill="#92400e">Prompt Design</text>
  <text x="486" y="164" font-family="sans-serif" font-size="14" fill="#111827">选例子 / 改格式</text>
  <text x="486" y="188" font-family="sans-serif" font-size="14" fill="#111827">调顺序 / 写指令</text>

  <rect x="670" y="95" width="180" height="130" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
