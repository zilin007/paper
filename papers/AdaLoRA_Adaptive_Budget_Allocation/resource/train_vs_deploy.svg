<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="sans-serif">
  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">训练时 vs 推理时：AdaLoRA 结构变化</text>

  <!-- Training Side -->
  <rect x="20" y="55" width="310" height="220" rx="8" fill="#eaf2f8" stroke="#3498db" stroke-width="1.5"/>
  <text x="175" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">训练阶段</text>

  <!-- Input -->
  <rect x="40" y="100" width="80" height="35" rx="6" fill="#3498db"/>
  <text x="80" y="122" text-anchor="middle" font-size="11" fill="white">输入 x</text>

  <!-- W0 frozen -->
  <rect x="150" y="95" width="80" height="45" rx="6" fill="#95a5a6"/>
  <text x="190" y="115" text-anchor="middle" font-size="11" fill="white" font-weight="bold">W⁽⁰⁾</text>
  <text x="190" y="130" text-anchor="middle" font-size="9" fill="#d5d8dc">冻结</text>

  <!-- PΛQ -->
  <rect x="150" y="160" width="80" height="45" rx="6" fill="#27ae60"/>
  <text x="190" y="180" text-anchor="middle" font-size="11" fill="white" font-weight="bold">PΛQ</text>
  <text x="190" y="195" text-anchor="middle" font-size="9" fill="#d5f5e3">可训练</text>

  <!-- Sum -->
  <circle cx="270" cy="140" r="20" fill="#f39c12"/>
  <text x="270" y="145" text-anchor="middle" font-size="16" fill="white" font-weight="bold">+</text>

  <!-- Arrows -->
  <line x1="120" y1="117" x2="145" y2="117" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="120" y1="117" x2="145" y2="182" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="117" x2="250" y2="130" stroke="#95a5a6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="182" x2="250" y2="150" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="300" y="122" width="80" height="35" rx="6" fill="#8e44ad"/>
  <text x="340" y="144" text-anchor="middle" font-size="11" fill="white">输出 h</text>

  <line x1="290" y1="140" x2="295" y2="140" stroke="#f39c12" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Budget allocation note -->
  <rect x="40" y="195" width="270" height="60" rx="6" fill="#fef9e7" stroke="#f39c12"/>
  <text x="175" y="215" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">预算调度器运行中</text>
  <text x="175" y="232" text-anchor="middle" font-size="9" fill="#666">• 计算三元组重要性 S = Ī × Ū</text>
  <text x="175" y="247" text-anchor="middle" font-size="9" fill="#666">• 裁剪低重要性奇异值</text>

  <!-- Arrow between phases -->
  <line x1="350" y1="165" x2="370" y2="165" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="360" y="155" text-anchor="middle" font-size="10" fill="#333">合并</text>

  <!-- Inference Side -->
  <rect x="380" y="55" width="300" height="220" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="530" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e8449">推理阶段</text>

  <!-- Input -->
  <rect x="410" y="110" width="80" height="35" rx="6" fill="#3498db"/>
  <text x="450" y="132" text-anchor="middle" font-size="11" fill="white">输入 x</text>

  <!-- W = W0 + PΛQ merged -->
  <rect x="520" y="95" width="120" height="65" rx="6" fill="#27ae60"/>
  <text x="580" y="120" text-anchor="middle" font-size="12" fill="white" font-weight="bold">W = W⁽⁰⁾ + PΛQ</text>
  <text x="580" y="140" text-anchor="middle" font-size="10" fill="#d5f5e3">合并后的权重</text>

  <!-- Output -->
  <rect x="660" y="110" width="80" height="35" rx="6" fill="#8e44ad"/>
  <text x="700" y="132" text-anchor="middle" font-size="11" fill="white">输出 h</text>

  <!-- Arrows -->
  <line x1="490" y1="127" x2="515" y2="127" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="127" x2="655" y2="127" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Note -->
  <rect x="410" y="185" width="250" height="70" rx="6" fill="#e8f8f5" stroke="#1abc9c"/>
  <text x="535" y="205" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">推理时零额外开销</text>
  <text x="535" y="222" text-anchor="middle" font-size="9" fill="#666">• PΛQ 已合并到 W⁽⁰⁾ 中</text>
  <text x="535" y="237" text-anchor="middle" font-size="9" fill="#666">• 无需额外计算，无延迟</text>
  <text x="535" y="252" text-anchor="middle" font-size="9" fill="#666">• 仅存储增量 Δ = PΛQ</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>
