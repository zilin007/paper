<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400" font-family="sans-serif">
  <!-- Title -->
  <text x="375" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">AdaLoRA 训练迭代全景：预算逐步收敛</text>

  <!-- Phase labels -->
  <rect x="20" y="50" width="200" height="30" rx="4" fill="#3498db"/>
  <text x="120" y="70" text-anchor="middle" font-size="12" fill="white" font-weight="bold">阶段1: 暖身 (t &lt; tᵢ)</text>

  <rect x="230" y="50" width="300" height="30" rx="4" fill="#f39c12"/>
  <text x="380" y="70" text-anchor="middle" font-size="12" fill="white" font-weight="bold">阶段2: 预算衰减 (tᵢ ≤ t &lt; T-t_f)</text>

  <rect x="540" y="50" width="190" height="30" rx="4" fill="#27ae60"/>
  <text x="635" y="70" text-anchor="middle" font-size="12" fill="white" font-weight="bold">阶段3: 固定微调</text>

  <!-- Budget curve -->
  <text x="30" y="115" font-size="11" fill="#666">总预算 b⁽ᵗ⁾</text>

  <!-- Axes -->
  <line x1="80" y1="120" x2="700" y2="120" stroke="#ccc" stroke-width="1"/>
  <line x1="80" y1="120" x2="80" y2="280" stroke="#ccc" stroke-width="1"/>

  <!-- Budget curve path -->
  <path d="M 80 140 L 200 140 Q 350 140, 450 200 Q 550 260, 600 260 L 700 260" fill="none" stroke="#e74c3c" stroke-width="3"/>

  <!-- Phase boundaries -->
  <line x1="200" y1="120" x2="200" y2="280" stroke="#3498db" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="600" y1="120" x2="600" y2="280" stroke="#27ae60" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Labels on curve -->
  <text x="140" y="135" text-anchor="middle" font-size="10" fill="#3498db">b⁽⁰⁾ (初始)</text>
  <text x="650" y="255" text-anchor="middle" font-size="10" fill="#27ae60">b⁽ᵀ⁾ (目标)</text>

  <!-- Iteration detail boxes -->
  <!-- Warm-up -->
  <rect x="100" y="155" width="80" height="80" rx="6" fill="#eaf2f8" stroke="#3498db"/>
  <text x="140" y="175" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">每步操作</text>
  <text x="140" y="192" text-anchor="middle" font-size="8" fill="#666">1. 前向传播</text>
  <text x="140" y="206" text-anchor="middle" font-size="8" fill="#666">2. 计算损失</text>
  <text x="140" y="220" text-anchor="middle" font-size="8" fill="#666">3. 更新P,Λ,Q</text>
  <text x="140" y="234" text-anchor="middle" font-size="8" fill="#666">4. 预算不变</text>

  <!-- Budget decay -->
  <rect x="350" y="170" width="100" height="90" rx="6" fill="#fef9e7" stroke="#f39c12"/>
  <text x="400" y="190" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">每步操作</text>
  <text x="400" y="207" text-anchor="middle" font-size="8" fill="#666">1. 前向传播</text>
  <text x="400" y="221" text-anchor="middle" font-size="8" fill="#666">2. 计算损失</text>
  <text x="400" y="235" text-anchor="middle" font-size="8" fill="#666">3. 更新P,Λ,Q</text>
  <text x="400" y="249" text-anchor="middle" font-size="8" fill="#666">4. 评分+裁剪λ</text>
  <text x="400" y="263" text-anchor="middle" font-size="8" fill="#666">5. 预算↓(三次方)</text>

  <!-- Fixed fine-tuning -->
  <rect x="620" y="170" width="80" height="80" rx="6" fill="#eafaf1" stroke="#27ae60"/>
  <text x="660" y="190" text-anchor="middle" font-size="9" fill="#333" font-weight="bold">每步操作</text>
  <text x="660" y="207" text-anchor="middle" font-size="8" fill="#666">1. 前向传播</text>
  <text x="660" y="221" text-anchor="middle" font-size="8" fill="#666">2. 计算损失</text>
  <text x="660" y="235" text-anchor="middle" font-size="8" fill="#666">3. 更新P,Λ,Q</text>
  <text x="660" y="249" text-anchor="middle" font-size="8" fill="#666">4. 预算固定</text>

  <!-- Rank distribution evolution -->
  <text x="375" y="310" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">各矩阵秩的分布演变</text>

  <!-- t=0 -->
  <rect x="50" y="325" width="180" height="55" rx="4" fill="#eaf2f8" stroke="#3498db"/>
  <text x="140" y="345" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">t = 0 (初始)</text>
  <text x="140" y="363" text-anchor="middle" font-size="9" fill="#666">所有矩阵: r = b⁽⁰⁾/n (均匀)</text>

  <!-- Arrow -->
  <line x1="230" y1="352" x2="270" y2="352" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- t=mid -->
  <rect x="280" y="325" width="180" height="55" rx="4" fill="#fef9e7" stroke="#f39c12"/>
  <text x="370" y="345" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">t = mid (衰减中)</text>
  <text x="370" y="363" text-anchor="middle" font-size="9" fill="#666">FFN↑ Attention↓ 顶层↑ 底层↓</text>

  <!-- Arrow -->
  <line x1="460" y1="352" x2="500" y2="352" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- t=T -->
  <rect x="510" y="325" width="180" height="55" rx="4" fill="#eafaf1" stroke="#27ae60"/>
  <text x="600" y="345" text-anchor="middle" font-size="10" fill="#333" font-weight="bold">t = T (收敛)</text>
  <text x="600" y="363" text-anchor="middle" font-size="9" fill="#666">重要性排序稳定</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>
