<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 600" width="700" height="600" font-family="sans-serif">
  <defs>
    <marker id="arrGray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#888"/>
    </marker>
    <marker id="arrPurple" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#9370db"/>
    </marker>
    <marker id="arrBlue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#4a7fbf"/>
    </marker>
    <marker id="arrOrange" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#c47a2a"/>
    </marker>
  </defs>

  <rect width="700" height="600" fill="#fafafa" rx="8"/>
  <text x="350" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Transformer 完整数据流 (Encoder-Decoder)</text>

  <!-- ===== 编码器路径 (左侧) ===== -->
  <g transform="translate(60, 40)">
    <text x="110" y="16" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c5f8a">编码器路径</text>

    <!-- 输入序列 -->
    <rect x="30" y="26" width="160" height="30" rx="5" fill="#dceaf7" stroke="#7aabdb"/>
    <text x="110" y="46" text-anchor="middle" font-size="12" fill="#2c5f8a">输入序列</text>
    <line x1="110" y1="56" x2="110" y2="70" stroke="#888" stroke-width="1.5" marker-end="url(#arrGray)"/>

    <!-- 词嵌入 -->
    <rect x="30" y="72" width="160" height="30" rx="5" fill="#c3d9f0" stroke="#7aabdb"/>
    <text x="110" y="92" text-anchor="middle" font-size="12" fill="#2c5f8a">词嵌入 (Embedding)</text>
    <line x1="110" y1="102" x2="110" y2="116" stroke="#888" stroke-width="1.5" marker-end="url(#arrGray)"/>

    <!-- + 位置编码 -->
    <rect x="30" y="118" width="160" height="30" rx="5" fill="#b0cde8" stroke="#7aabdb"/>
    <text x="110" y="138" text-anchor="middle" font-size="12" fill="#2c5f8a">+ 位置编码 (PE)</text>
    <line x1="110" y1="148" x2="110" y2="166" stroke="#888" stroke-width="1.5" marker-end="url(#arrGray)"/>

    <!-- 编码器块 ×N -->
    <rect x="5" y="168" width="210" height="150" rx="8" fill="none" stroke="#4a7fbf" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="195" y="184" text-anchor="end" font-size="11" fill="#4a7fbf" font-weight="bold">× N</text>

    <!-- 自注意力 -->
    <rect x="20" y="190" width="180" height="28" rx="5" fill="#4a7fbf" stroke="#35608f"/>
    <text x="110" y="209" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">多头自注意力</text>

    <!-- 残差 & LN -->
    <rect x="20" y="224" width="180" height="22" rx="4" fill="#e8eff7" stroke="#7aabdb"/>
    <text x="110" y="240" text-anchor="middle" font-size="10" fill="#2c5f8a">残差连接 &amp; 层归一化</text>

    <!-- FFN -->
    <rect x="20" y="252" width="180" height="28" rx="5" fill="#6a9fd4" stroke="#35608f"/>
    <text x="110" y="271" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">前馈网络 (FFN)</text>

    <!-- 残差 & LN -->
    <rect x="20" y="286" width="180" height="22" rx="4" fill="#e8eff7" stroke="#7aabdb"/>
    <text x="110" y="302" text-anchor="middle" font-size="10" fill="#2c5f8a">残差连接 &amp; 层归一化</text>

    <!-- 箭头链接 -->
    <line x1="110" y1="218" x2="110" y2="224" stroke="#888" stroke-width="1"/>
    <line x1="110" y1="246" x2="110" y2="252" stroke="#888" stroke-width="1"/>
    <line x1="110" y1="280" x2="110" y2="286" stroke="#888" stroke-width="1"/>

    <!-- 输出 K, V -->
    <line x1="110" y1="318" x2="110" y2="340" stroke="#888" stroke-width="1.5" marker-end="url(#arrGray)"/>
    <rect x="30" y="342" width="160" height="30" rx="5" fill="#d5c8ed" stroke="#9370db" stroke-width="1.5"/>
    <text x="110" y="362" text-anchor="middle" font-size="12" fill="#5b3d8f" font-weight="bold">输出 K, V</text>
  </g>

  <!-- K,V 连接线 (紫色) -->
  <line x1="250" y1="402" x2="460" y2="358" stroke="#9370db" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrPurple)"/>
  <text x="350" y="372" text-anchor="middle" font-size="10" fill="#7b52ab" font-weight="bold">K, V</text>

  <!-- ===== 解码器路径 (右侧) ===== -->
  <g transform="translate(410, 40)">
    <text x="120" y="16" text-anchor="middle" font-size="14" font-weight="bold" fill="#b86e1a">解码器路径</text>

    <!-- 输出序列(右移) -->
    <rect x="20" y="26" width="200" height="30" rx="5" fill="#fde8cc" stroke="#e0a850"/>
    <text x="120" y="46" text-anchor="middle" font-size="12" fill="#8a5a10">输出序列 (右移一位)</text>
    <line x1="120" y1="56" x2="120" y2="70" stroke="#888" stroke-width="1.5" marker-end="url(#arrGray)"/>

    <!-- 词嵌入 -->
    <rect x="20" y="72" width="200" height="30" rx="5" fill="#f5d9a8" stroke="#e0a850"/>
    <text x="120" y="92" text-anchor="middle" font-size="12" fill="#8a5a10">词嵌入 (Embedding)</text>
    <line x1="120" y1="102" x2="120" y2="116" stroke="#888" stroke-width="1.5" marker-end="url(#arrGray)"/>

    <!-- + 位置编码 -->
    <rect x="20" y="118" width="200" height="30" rx="5" fill="#f0cc8a" stroke="#e0a850"/>
    <text x="120" y="138" text-anchor="middle" font-size="12" fill="#8a5a10">+ 位置编码 (PE)</text>
    <line x1="120" y1="148" x2="120" y2="166" stroke="#888" stroke-width="1.5" marker-end="url(#arrGray)"/>

    <!-- 解码器块 ×N -->
    <rect x="0" y="168" width="240" height="230" rx="8" fill="none" stroke="#c47a2a" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="220" y="184" text-anchor="end" font-size="11" fill="#c47a2a" font-weight="bold">× N</text>

    <!-- 掩码自注意力 -->
    <rect x="15" y="190" width="210" height="28" rx="5" fill="#e08830" stroke="#a06020"/>
    <text x="120" y="209" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">掩码多头自注意力</text>

    <!-- 残差 & LN -->
    <rect x="15" y="224" width="210" height="22" rx="4" fill="#fdf0dd" stroke="#e0a850"/>
    <text x="120" y="240" text-anchor="middle" font-size="10" fill="#8a5a10">残差连接 &amp; 层归一化</text>

    <!-- 编-解注意力 -->
    <rect x="15" y="252" width="210" height="28" rx="5" fill="#d47828" stroke="#a06020"/>
    <text x="120" y="271" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">编-解交叉注意力</text>
    <!-- K,V 箭头到达点 -->
    <circle cx="15" cy="266" r="4" fill="#9370db"/>

    <!-- 残差 & LN -->
    <rect x="15" y="286" width="210" height="22" rx="4" fill="#fdf0dd" stroke="#e0a850"/>
    <text x="120" y="302" text-anchor="middle" font-size="10" fill="#8a5a10">残差连接 &amp; 层归一化</text>

    <!-- FFN -->
    <rect x="15" y="314" width="210" height="28" rx="5" fill="#c06a20" stroke="#a06020"/>
    <text x="120" y="333" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">前馈网络 (FFN)</text>

    <!-- 残差 & LN -->
    <rect x="15" y="348" width="210" height="22" rx="4" fill="#fdf0dd" stroke="#e0a850"/>
    <text x="120" y="364" text-anchor="middle" font-size="10" fill="#8a5a10">残差连接 &amp; 层归一化</text>

    <!-- 箭头链接 -->
    <line x1="120" y1="218" x2="120" y2="224" stroke="#888" stroke-width="1"/>
    <line x1="120" y1="246" x2="120" y2="252" stroke="#888" stroke-width="1"/>
    <line x1="120" y1="280" x2="120" y2="286" stroke="#888" stroke-width="1"/>
    <line x1="120" y1="308" x2="120" y2="314" stroke="#888" stroke-width="1"/>
    <line x1="120" y1="342" x2="120" y2="348" stroke="#888" stroke-width="1"/>
  </g>

  <!-- 解码器后续：线性层 + Softmax -->
  <g transform="translate(410, 40)">
    <line x1="120" y1="398" x2="120" y2="420" stroke="#888" stroke-width="1.5" marker-end="url(#arrGray)"/>
    <rect x="20" y="422" width="200" height="30" rx="5" fill="#f7e6cc" stroke="#c47a2a" stroke-width="1.5"/>
    <text x="120" y="442" text-anchor="middle" font-size="12" fill="#8a5a10" font-weight="bold">线性层 + Softmax</text>
    <line x1="120" y1="452" x2="120" y2="474" stroke="#888" stroke-width="1.5" marker-end="url(#arrGray)"/>
    <rect x="35" y="476" width="170" height="30" rx="5" fill="#d5edcc" stroke="#6aaa50" stroke-width="1.5"/>
    <text x="120" y="496" text-anchor="middle" font-size="12" fill="#3a6a20" font-weight="bold">输出概率分布</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(20, 560)">
    <rect x="0" y="0" width="14" height="14" rx="2" fill="#4a7fbf"/>
    <text x="20" y="12" font-size="10" fill="#555">编码器模块</text>
    <rect x="110" y="0" width="14" height="14" rx="2" fill="#e08830"/>
    <text x="130" y="12" font-size="10" fill="#555">解码器模块</text>
    <line x1="230" y1="7" x2="260" y2="7" stroke="#9370db" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="266" y="12" font-size="10" fill="#555">K,V 传递</text>
    <line x1="350" y1="7" x2="380" y2="7" stroke="#888" stroke-width="1.5" marker-end="url(#arrGray)"/>
    <text x="386" y="12" font-size="10" fill="#555">数据流向</text>
  </g>
</svg>