<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="500" height="550" font-family="sans-serif">
  <defs>
    <marker id="arrGreen" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#3aaa3a"/>
    </marker>
    <marker id="arrGreenDown" markerWidth="7" markerHeight="7" refX="3.5" refY="6" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#3aaa3a"/>
    </marker>
  </defs>

  <rect width="500" height="550" fill="#fafafa" rx="8"/>
  <text x="250" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Transformer 梯度流向 (反向传播)</text>

  <!-- 主梯度流路径 (从上到下为正向，梯度从上向下回传) -->
  <!-- 这里按正向从下到上排列，梯度从顶部 Loss 向下回传 -->

  <!-- Loss -->
  <rect x="160" y="42" width="180" height="32" rx="6" fill="#f5d0d0" stroke="#cc5555" stroke-width="1.5"/>
  <text x="250" y="63" text-anchor="middle" font-size="13" font-weight="bold" fill="#aa2222">损失 L (Loss)</text>

  <!-- 梯度箭头 -->
  <line x1="250" y1="74" x2="250" y2="90" stroke="#3aaa3a" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- Softmax + Linear -->
  <rect x="145" y="94" width="210" height="30" rx="5" fill="#e8e8e8" stroke="#999"/>
  <text x="233" y="114" text-anchor="middle" font-size="12" fill="#444">Softmax + Linear</text>
  <text x="370" y="114" font-size="13" fill="#3aaa3a" font-weight="bold">&#x2713;</text>
  <line x1="250" y1="124" x2="250" y2="140" stroke="#3aaa3a" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- ===== 解码器层 N ===== -->
  <rect x="50" y="144" width="400" height="162" rx="8" fill="none" stroke="#c47a2a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="70" y="161" font-size="11" fill="#c47a2a" font-weight="bold">解码器层 ×N</text>

  <!-- FFN -->
  <rect x="120" y="168" width="200" height="26" rx="5" fill="#fde8cc" stroke="#e0a850"/>
  <text x="204" y="186" text-anchor="middle" font-size="11" fill="#8a5a10">FFN + 残差 &amp; LN</text>
  <text x="336" y="186" font-size="13" fill="#3aaa3a" font-weight="bold">&#x2713;</text>
  <!-- 残差标注 -->
  <line x1="340" y1="181" x2="370" y2="181" stroke="#3aaa3a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="374" y="185" font-size="9" fill="#3a8a3a">梯度直通</text>

  <line x1="220" y1="194" x2="220" y2="206" stroke="#3aaa3a" stroke-width="2" marker-end="url(#arrGreen)"/>

  <!-- 编-解注意力 -->
  <rect x="120" y="210" width="200" height="26" rx="5" fill="#fde8cc" stroke="#e0a850"/>
  <text x="204" y="228" text-anchor="middle" font-size="11" fill="#8a5a10">编-解注意力 + 残差</text>
  <text x="336" y="228" font-size="13" fill="#3aaa3a" font-weight="bold">&#x2713;</text>
  <line x1="340" y1="223" x2="370" y2="223" stroke="#3aaa3a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="374" y="227" font-size="9" fill="#3a8a3a">梯度直通</text>

  <line x1="220" y1="236" x2="220" y2="248" stroke="#3aaa3a" stroke-width="2" marker-end="url(#arrGreen)"/>

  <!-- 梯度分支到编码器 -->
  <line x1="120" y1="223" x2="70" y2="223" stroke="#3aaa3a" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="70" y1="223" x2="70" y2="322" stroke="#3aaa3a" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrGreen)"/>
  <text x="40" y="276" font-size="9" fill="#3a8a3a" transform="rotate(-90, 40, 276)">梯度分流</text>

  <!-- 掩码自注意力 -->
  <rect x="120" y="252" width="200" height="26" rx="5" fill="#fde8cc" stroke="#e0a850"/>
  <text x="204" y="270" text-anchor="middle" font-size="11" fill="#8a5a10">掩码自注意力 + 残差</text>
  <text x="336" y="270" font-size="13" fill="#3aaa3a" font-weight="bold">&#x2713;</text>
  <line x1="340" y1="265" x2="370" y2="265" stroke="#3aaa3a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="374" y="269" font-size="9" fill="#3a8a3a">梯度直通</text>

  <line x1="220" y1="306" x2="220" y2="322" stroke="#3aaa3a" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- ===== 编码器层 N ===== -->
  <rect x="50" y="326" width="400" height="106" rx="8" fill="none" stroke="#4a7fbf" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="70" y="343" font-size="11" fill="#4a7fbf" font-weight="bold">编码器层 ×N</text>

  <!-- FFN -->
  <rect x="120" y="350" width="200" height="26" rx="5" fill="#d0e4f7" stroke="#7aabdb"/>
  <text x="204" y="368" text-anchor="middle" font-size="11" fill="#2c5f8a">FFN + 残差 &amp; LN</text>
  <text x="336" y="368" font-size="13" fill="#3aaa3a" font-weight="bold">&#x2713;</text>

  <line x1="220" y1="376" x2="220" y2="388" stroke="#3aaa3a" stroke-width="2" marker-end="url(#arrGreen)"/>

  <!-- 自注意力 -->
  <rect x="120" y="392" width="200" height="26" rx="5" fill="#d0e4f7" stroke="#7aabdb"/>
  <text x="204" y="410" text-anchor="middle" font-size="11" fill="#2c5f8a">自注意力 + 残差 &amp; LN</text>
  <text x="336" y="410" font-size="13" fill="#3aaa3a" font-weight="bold">&#x2713;</text>

  <!-- 向下到嵌入层 -->
  <line x1="220" y1="432" x2="220" y2="452" stroke="#3aaa3a" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- 底部：词嵌入 & 位置编码 -->
  <rect x="100" y="456" width="140" height="30" rx="5" fill="#d5edcc" stroke="#6aaa50"/>
  <text x="170" y="476" text-anchor="middle" font-size="12" fill="#3a6a20">词嵌入</text>
  <text x="252" y="476" font-size="13" fill="#3aaa3a" font-weight="bold">&#x2713; 更新</text>

  <rect x="290" y="456" width="140" height="30" rx="5" fill="#f5d5d5" stroke="#cc7777"/>
  <text x="360" y="476" text-anchor="middle" font-size="12" fill="#aa3333">位置编码</text>
  <text x="438" y="476" font-size="13" fill="#cc3333" font-weight="bold">&#x2717; 固定</text>

  <!-- 底部注释 -->
  <rect x="50" y="502" width="400" height="36" rx="6" fill="#f0f7e8" stroke="#8cc88c"/>
  <text x="250" y="520" text-anchor="middle" font-size="11" fill="#3a6a20">残差连接让梯度可以跳过子层直达底部，缓解梯度消失</text>
  <text x="250" y="533" text-anchor="middle" font-size="10" fill="#6a9a4a">绿色 &#x2713; = 梯度流经并更新参数 | 红色 &#x2717; = 不更新（固定值）</text>
</svg>