<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 450" font-family="sans-serif">
  <rect width="650" height="450" fill="#fafafa"/>
  <text x="325" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">梯度流向图：触发词更新</text>

  <!-- 词嵌入矩阵 -->
  <rect x="30" y="60" width="180" height="200" rx="8" fill="#eaf2f8" stroke="#3498db" stroke-width="2"/>
  <text x="120" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">词嵌入矩阵 W_emb</text>

  <rect x="50" y="100" width="140" height="30" rx="4" fill="#2ecc71"/>
  <text x="120" y="120" text-anchor="middle" font-size="12" fill="white">好: [1.0, 0.5] ★ 最优</text>

  <rect x="50" y="140" width="140" height="30" rx="4" fill="#e74c3c"/>
  <text x="120" y="160" text-anchor="middle" font-size="12" fill="white">差: [-0.8, 0.3]</text>

  <rect x="50" y="180" width="140" height="30" rx="4" fill="#f39c12"/>
  <text x="120" y="200" text-anchor="middle" font-size="12" fill="white">电影: [0.2, -0.6]</text>

  <rect x="50" y="220" width="140" height="30" rx="4" fill="#95a5a6"/>
  <text x="120" y="240" text-anchor="middle" font-size="12" fill="white">是: [0.0, 1.0]</text>

  <!-- 梯度向量 -->
  <rect x="280" y="60" width="160" height="100" rx="8" fill="#fadbd8" stroke="#e74c3c" stroke-width="2"/>
  <text x="360" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">负梯度方向</text>
  <text x="360" y="110" text-anchor="middle" font-size="14" fill="#c0392b">[0.6, -0.3]</text>
  <text x="360" y="135" text-anchor="middle" font-size="11" fill="#e74c3c">损失减小的方向</text>

  <!-- 点积计算 -->
  <rect x="280" y="190" width="160" height="160" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="360" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#d68910">点积得分 w_in · (-∇L)</text>

  <text x="360" y="245" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">好: 1.0×0.6 + 0.5×(-0.3) = 0.45</text>
  <text x="360" y="270" text-anchor="middle" font-size="12" fill="#e74c3c">差: (-0.8)×0.6 + 0.3×(-0.3) = -0.57</text>
  <text x="360" y="295" text-anchor="middle" font-size="12" fill="#f39c12">电影: 0.2×0.6 + (-0.6)×(-0.3) = 0.30</text>
  <text x="360" y="320" text-anchor="middle" font-size="12" fill="#95a5a6">是: 0.0×0.6 + 1.0×(-0.3) = -0.30</text>

  <!-- 结果 -->
  <rect x="480" y="130" width="140" height="100" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="3"/>
  <text x="550" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e8449">选中: "好"</text>
  <text x="550" y="185" text-anchor="middle" font-size="12" fill="#27ae60">得分最高: 0.45</text>
  <text x="550" y="210" text-anchor="middle" font-size="11" fill="#1e8449">替换触发词 T₁←好</text>

  <!-- 箭头 -->
  <line x1="210" y1="115" x2="280" y2="115" stroke="#3498db" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="115" x2="480" y2="155" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="245" x2="480" y2="195" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 说明 -->
  <rect x="30" y="300" width="590" height="130" rx="8" fill="#f8f9f9" stroke="#bdc3c7" stroke-width="1"/>
  <text x="325" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">关键理解</text>
  <text x="50" y="355" font-size="12" fill="#34495e">• 梯度 ∂L/∂x_trig 指向损失增大的方向，我们需要负梯度 -∂L/∂x_trig</text>
  <text x="50" y="380" font-size="12" fill="#34495e">• 点积 w_in · (-∇L) 衡量词嵌入与负梯度方向的"对齐程度"</text>
  <text x="50" y="405" font-size="12" fill="#34495e">• 对齐度越高 → 替换后损失下降越多 → 越应该选这个词</text>
  <text x="50" y="430" font-size="12" fill="#34495e">• 可训练参数: 触发词嵌入 (1个, d=2维) | 冻结参数: MLM全部权重 (百万级)</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
