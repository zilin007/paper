<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="sans-serif">
  <rect width="700" height="420" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">探测预训练模型知识的三种方案对比</text>

  <!-- 方案1: 探针分类器 -->
  <rect x="20" y="50" width="200" height="340" rx="8" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <text x="120" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">探针分类器</text>

  <rect x="40" y="90" width="160" height="40" rx="6" fill="#3498db"/>
  <text x="120" y="115" text-anchor="middle" font-size="12" fill="white">预训练语言模型</text>

  <rect x="40" y="150" width="160" height="40" rx="6" fill="#e74c3c"/>
  <text x="120" y="175" text-anchor="middle" font-size="12" fill="white">探针分类器 (可训练)</text>

  <text x="120" y="220" text-anchor="middle" font-size="11" fill="#666">输出 → 分类结果</text>

  <rect x="40" y="240" width="160" height="130" rx="6" fill="#fee"/>
  <text x="120" y="265" text-anchor="middle" font-size="11" fill="#c0392b">✗ 需要额外参数</text>
  <text x="120" y="285" text-anchor="middle" font-size="11" fill="#c0392b">✗ 可能假阳性</text>
  <text x="120" y="305" text-anchor="middle" font-size="11" fill="#c0392b">✗ 探针学到 ≠ 模型知道</text>
  <text x="120" y="330" text-anchor="middle" font-size="11" fill="#666">需要训练探针权重</text>
  <text x="120" y="350" text-anchor="middle" font-size="11" fill="#666">参数量: 几千~几万</text>

  <!-- 方案2: 注意力可视化 -->
  <rect x="250" y="50" width="200" height="340" rx="8" fill="#fff" stroke="#f39c12" stroke-width="2"/>
  <text x="350" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#f39c12">注意力可视化</text>

  <rect x="270" y="90" width="160" height="40" rx="6" fill="#3498db"/>
  <text x="350" y="115" text-anchor="middle" font-size="12" fill="white">预训练语言模型</text>

  <rect x="270" y="150" width="160" height="40" rx="6" fill="#f39c12"/>
  <text x="350" y="175" text-anchor="middle" font-size="12" fill="white">注意力权重矩阵</text>

  <text x="350" y="220" text-anchor="middle" font-size="11" fill="#666">热力图 → 关注区域</text>

  <rect x="270" y="240" width="160" height="130" rx="6" fill="#fef9e7"/>
  <text x="350" y="265" text-anchor="middle" font-size="11" fill="#d68910">✗ 相关性 ≠ 因果性</text>
  <text x="350" y="285" text-anchor="middle" font-size="11" fill="#d68910">✗ 注意力≠解释</text>
  <text x="350" y="305" text-anchor="middle" font-size="11" fill="#d68910">✗ 难以处理复杂任务</text>
  <text x="350" y="330" text-anchor="middle" font-size="11" fill="#666">无需额外训练</text>
  <text x="350" y="350" text-anchor="middle" font-size="11" fill="#666">但解释力存疑</text>

  <!-- 方案3: AutoPrompt -->
  <rect x="480" y="50" width="200" height="340" rx="8" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <text x="580" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">AutoPrompt (本文)</text>

  <rect x="500" y="90" width="160" height="40" rx="6" fill="#3498db"/>
  <text x="580" y="115" text-anchor="middle" font-size="12" fill="white">预训练语言模型</text>

  <rect x="500" y="150" width="160" height="40" rx="6" fill="#27ae60"/>
  <text x="580" y="175" text-anchor="middle" font-size="12" fill="white">自动优化的触发词</text>

  <text x="580" y="220" text-anchor="middle" font-size="11" fill="#666">[MASK] → 分类结果</text>

  <rect x="500" y="240" width="160" height="130" rx="6" fill="#eafaf1"/>
  <text x="580" y="265" text-anchor="middle" font-size="11" fill="#1e8449">✓ 无需额外参数</text>
  <text x="580" y="285" text-anchor="middle" font-size="11" fill="#1e8449">✓ 直接探测模型知识</text>
  <text x="580" y="305" text-anchor="middle" font-size="11" fill="#1e8449">✓ 自动搜索最优提示</text>
  <text x="580" y="330" text-anchor="middle" font-size="11" fill="#666">只需存几个触发词</text>
  <text x="580" y="350" text-anchor="middle" font-size="11" fill="#666">参数量: 几十字节</text>

  <!-- 箭头连接 -->
  <line x1="220" y1="110" x2="250" y2="110" stroke="#999" stroke-width="1" stroke-dasharray="4"/>
  <line x1="450" y1="110" x2="480" y2="110" stroke="#999" stroke-width="1" stroke-dasharray="4"/>
</svg>
