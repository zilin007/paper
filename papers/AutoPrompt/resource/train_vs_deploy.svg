<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="sans-serif">
  <rect width="700" height="350" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">AutoPrompt: 训练时 vs 部署时</text>

  <!-- 训练时 -->
  <rect x="20" y="55" width="310" height="270" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <text x="175" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#e74c3c">训练时（搜索触发词）</text>

  <!-- 训练流程 -->
  <rect x="40" y="100" width="120" height="40" rx="6" fill="#3498db"/>
  <text x="100" y="125" text-anchor="middle" font-size="12" fill="white">预训练 MLM</text>

  <rect x="190" y="100" width="120" height="40" rx="6" fill="#f39c12"/>
  <text x="250" y="125" text-anchor="middle" font-size="12" fill="white">训练数据 (标注)</text>

  <rect x="40" y="160" width="270" height="40" rx="6" fill="#e74c3c"/>
  <text x="175" y="185" text-anchor="middle" font-size="12" fill="white">梯度搜索: 迭代优化触发词 T₁...Tₘ</text>

  <rect x="40" y="220" width="270" height="40" rx="6" fill="#9b59b6"/>
  <text x="175" y="245" text-anchor="middle" font-size="12" fill="white">输出: 最优触发词 (如 "好", "棒", "精彩")</text>

  <!-- 箭头 -->
  <line x1="160" y1="140" x2="175" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="140" x2="235" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="175" y1="200" x2="175" y2="220" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 部署时 -->
  <rect x="370" y="55" width="310" height="270" rx="10" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <text x="525" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#27ae60">部署时（推理）</text>

  <rect x="390" y="100" width="120" height="40" rx="6" fill="#3498db"/>
  <text x="450" y="125" text-anchor="middle" font-size="12" fill="white">预训练 MLM</text>
  <text x="450" y="142" text-anchor="middle" font-size="10" fill="#d4e6f1">(权重冻结，不修改)</text>

  <rect x="540" y="100" width="120" height="40" rx="6" fill="#27ae60"/>
  <text x="600" y="125" text-anchor="middle" font-size="12" fill="white">找到的触发词</text>
  <text x="600" y="142" text-anchor="middle" font-size="10" fill="#d5f5e3">(几十字节)</text>

  <rect x="390" y="160" width="270" height="40" rx="6" fill="#1abc9c"/>
  <text x="525" y="185" text-anchor="middle" font-size="12" fill="white">新输入 + 触发词 → 模板 → [MASK] 预测</text>

  <rect x="390" y="220" width="270" height="40" rx="6" fill="#2ecc71"/>
  <text x="525" y="245" text-anchor="middle" font-size="12" fill="white">输出: 分类结果 (读 [MASK] 概率)</text>

  <line x1="450" y1="140" x2="525" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="140" x2="565" y2="160" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="525" y1="200" x2="525" y2="220" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 中间箭头 -->
  <line x1="330" y1="190" x2="370" y2="190" stroke="#27ae60" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="350" y="180" text-anchor="middle" font-size="11" fill="#27ae60">触发词</text>

  <!-- 关键优势 -->
  <rect x="390" y="275" width="270" height="40" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1"/>
  <text x="525" y="300" text-anchor="middle" font-size="11" fill="#1e8449">✓ 无需微调 ✓ 一个模型服务多任务 ✓ 存储极小</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#666"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#27ae60"/>
    </marker>
  </defs>
</svg>
