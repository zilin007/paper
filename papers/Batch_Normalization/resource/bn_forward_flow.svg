<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" font-family="sans-serif">
  <style>
    .title { font-size: 16px; font-weight: bold; fill: #333; }
    .label { font-size: 13px; fill: #333; }
    .label-small { font-size: 11px; fill: #555; }
    .formula { font-size: 14px; fill: #1565c0; font-family: "Cambria Math", serif; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .arrow-green { stroke: #4caf50; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-green); }
    .arrow-blue { stroke: #2196f3; stroke-width: 2; fill: none; marker-end: url(#arrowhead-blue); }
    .box { rx: 6; ry: 6; }
    .box-blue { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; }
    .box-green { fill: #e8f5e9; stroke: #4caf50; stroke-width: 2; }
    .box-orange { fill: #fff3e0; stroke: #ff9800; stroke-width: 2; }
    .box-purple { fill: #f3e5f5; stroke: #9c27b0; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4caf50"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2196f3"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" class="title">Batch Normalization 前向计算流程</text>

  <!-- Input -->
  <rect x="250" y="55" width="200" height="45" class="box box-blue"/>
  <text x="350" y="83" text-anchor="middle" class="label">输入 x (mini-batch: m 个样本)</text>

  <path d="M350 100 L350 120" class="arrow"/>

  <!-- Step 1: Compute mean -->
  <rect x="250" y="120" width="200" height="50" class="box box-orange"/>
  <text x="350" y="142" text-anchor="middle" class="label">Step 1: 计算 mini-batch 均值</text>
  <text x="350" y="160" text-anchor="middle" class="formula">μ_B = (1/m) Σ x_i</text>

  <path d="M350 170 L350 190" class="arrow"/>

  <!-- Step 2: Compute variance -->
  <rect x="250" y="190" width="200" height="50" class="box box-orange"/>
  <text x="350" y="212" text-anchor="middle" class="label">Step 2: 计算 mini-batch 方差</text>
  <text x="350" y="230" text-anchor="middle" class="formula">σ²_B = (1/m) Σ (x_i - μ_B)²</text>

  <path d="M350 240 L350 260" class="arrow"/>

  <!-- Step 3: Normalize -->
  <rect x="250" y="260" width="200" height="50" class="box box-green"/>
  <text x="350" y="282" text-anchor="middle" class="label">Step 3: 归一化 (均值0, 方差1)</text>
  <text x="350" y="300" text-anchor="middle" class="formula">x̂_i = (x_i - μ_B) / √(σ²_B + ε)</text>

  <path d="M350 310 L350 330" class="arrow"/>

  <!-- Step 4: Scale and shift -->
  <rect x="250" y="330" width="200" height="50" class="box box-purple"/>
  <text x="350" y="352" text-anchor="middle" class="label">Step 4: 缩放和平移 (可学习参数)</text>
  <text x="350" y="370" text-anchor="middle" class="formula">y_i = γ · x̂_i + β</text>

  <path d="M350 380 L350 400" class="arrow"/>

  <!-- Output -->
  <rect x="250" y="400" width="200" height="45" class="box box-blue"/>
  <text x="350" y="428" text-anchor="middle" class="label">输出 y → 送入下一层</text>

  <!-- Side annotations -->
  <text x="480" y="145" class="label-small" fill="#e65100">← 固定分布</text>
  <text x="480" y="215" class="label-small" fill="#e65100">← 固定分布</text>
  <text x="480" y="285" class="label-small" fill="#2e7d32">← 每层输入稳定</text>
  <text x="480" y="355" class="label-small" fill="#6a1b9a">← γ, β 随网络训练</text>

  <!-- Key insight box -->
  <rect x="30" y="120" width="190" height="130" rx="8" ry="8" fill="#fff8e1" stroke="#ff9800" stroke-width="2"/>
  <text x="125" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">关键洞察</text>
  <text x="40" y="170" class="label-small">• 用 mini-batch 统计量</text>
  <text x="40" y="190" class="label-small">  代替全量数据</text>
  <text x="40" y="215" class="label-small">• ε 防止除零 (通常 10⁻⁵)</text>
  <text x="40" y="240" class="label-small">• 每个特征独立归一化</text>

  <!-- Training vs Inference box -->
  <rect x="30" y="280" width="190" height="165" rx="8" ry="8" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
  <text x="125" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">训练 vs 推理</text>
  <text x="40" y="330" class="label-small" font-weight="bold">训练时:</text>
  <text x="40" y="348" class="label-small">• 用当前 batch 的 μ_B, σ²_B</text>
  <text x="40" y="366" class="label-small">• γ, β 通过反向传播更新</text>
  <text x="40" y="390" class="label-small" font-weight="bold">推理时:</text>
  <text x="40" y="408" class="label-small">• 用训练时累积的</text>
  <text x="40" y="426" class="label-small">  全局均值和方差</text>
  <text x="40" y="444" class="label-small">• 变成线性变换, 可融合</text>
</svg>
