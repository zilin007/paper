<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="sans-serif">
  <style>
    .title { font-size: 16px; font-weight: bold; fill: #333; }
    .label { font-size: 13px; fill: #333; }
    .label-small { font-size: 11px; fill: #555; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .arrow-gray { stroke: #888; stroke-width: 1.5; fill: none; stroke-dasharray: 4,3; marker-end: url(#arrowhead-gray); }
    .box { rx: 6; ry: 6; }
    .box-green { fill: #e8f5e9; stroke: #4caf50; stroke-width: 2; }
    .box-red { fill: #ffebee; stroke: #f44336; stroke-width: 2; }
    .box-blue { fill: #e3f2fd; stroke: #2196f3; stroke-width: 2; }
    .box-gray { fill: #f5f5f5; stroke: #999; stroke-width: 2; }
    .box-yellow { fill: #fff8e1; stroke: #ff9800; stroke-width: 2; }
    .problem { font-size: 11px; fill: #c62828; font-weight: bold; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" class="title">训练深层网络：BatchNorm 之前的问题</text>

  <!-- Method 1: 传统训练 -->
  <rect x="20" y="55" width="200" height="340" rx="8" ry="8" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="120" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">方案一：小心调参</text>

  <rect x="40" y="100" width="160" height="40" class="box box-blue"/>
  <text x="120" y="125" text-anchor="middle" class="label">小学习率 (0.001)</text>

  <path d="M120 140 L120 160" class="arrow"/>

  <rect x="40" y="160" width="160" height="40" class="box box-blue"/>
  <text x="120" y="185" text-anchor="middle" class="label">精心初始化权重</text>

  <path d="M120 200 L120 220" class="arrow"/>

  <rect x="40" y="220" width="160" height="40" class="box box-yellow"/>
  <text x="120" y="245" text-anchor="middle" class="label">ReLU 激活函数</text>

  <path d="M120 260 L120 280" class="arrow"/>

  <rect x="40" y="280" width="160" height="40" class="box box-yellow"/>
  <text x="120" y="305" text-anchor="middle" class="label">Dropout 防过拟合</text>

  <path d="M120 320 L120 350" class="arrow-gray"/>

  <rect x="40" y="350" width="160" height="35" class="box box-red"/>
  <text x="120" y="367" text-anchor="middle" class="problem">收敛慢、调参难</text>

  <!-- Method 2: 内部协变量偏移 -->
  <rect x="250" y="55" width="200" height="340" rx="8" ry="8" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="350" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">核心问题：内部协变量偏移</text>

  <rect x="270" y="100" width="160" height="50" class="box box-gray"/>
  <text x="350" y="120" text-anchor="middle" class="label">第1层输出分布</text>
  <text x="350" y="138" text-anchor="middle" class="label-small" fill="#c62828">N(0, 1) → N(2, 5)</text>

  <path d="M350 150 L350 170" class="arrow"/>

  <rect x="270" y="170" width="160" height="50" class="box box-gray"/>
  <text x="350" y="190" text-anchor="middle" class="label">第2层被迫适应</text>
  <text x="350" y="208" text-anchor="middle" class="label-small" fill="#c62828">输入分布持续变化!</text>

  <path d="M350 220 L350 240" class="arrow"/>

  <rect x="270" y="240" width="160" height="50" class="box box-gray"/>
  <text x="350" y="260" text-anchor="middle" class="label">第3层更不稳定</text>
  <text x="350" y="278" text-anchor="middle" class="label-small" fill="#c62828">梯度消失/爆炸</text>

  <path d="M350 290 L350 310" class="arrow"/>

  <rect x="270" y="310" width="160" height="50" class="box box-red"/>
  <text x="350" y="330" text-anchor="middle" class="label">激活进入饱和区</text>
  <text x="350" y="348" text-anchor="middle" class="label-small" fill="#c62828">梯度 ≈ 0, 训练停滞</text>

  <path d="M350 360 L350 380" class="arrow-gray"/>

  <text x="350" y="395" text-anchor="middle" class="problem">分布漂移 → 训练困难</text>

  <!-- Method 3: BatchNorm 方案 -->
  <rect x="480" y="55" width="200" height="340" rx="8" ry="8" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="580" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">方案三：BatchNorm</text>

  <rect x="500" y="100" width="160" height="40" class="box box-green"/>
  <text x="580" y="125" text-anchor="middle" class="label">归一化: 均值0, 方差1</text>

  <path d="M580 140 L580 160" class="arrow"/>

  <rect x="500" y="160" width="160" height="40" class="box box-green"/>
  <text x="580" y="185" text-anchor="middle" class="label">可学习 γ, β 恢复表达力</text>

  <path d="M580 200 L580 220" class="arrow"/>

  <rect x="500" y="220" width="160" height="40" class="box box-green"/>
  <text x="580" y="245" text-anchor="middle" class="label">稳定每层输入分布</text>

  <path d="M580 260 L580 280" class="arrow"/>

  <rect x="500" y="280" width="160" height="40" class="box box-green"/>
  <text x="580" y="305" text-anchor="middle" class="label">可用更大学习率</text>

  <path d="M580 320 L580 340" class="arrow"/>

  <rect x="500" y="340" width="160" height="40" class="box box-green"/>
  <text x="580" y="365" text-anchor="middle" class="label">自带正则化, 可去Dropout</text>

  <path d="M580 380 L580 395" class="arrow"/>

  <text x="580" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">✓ 训练快14倍</text>
</svg>
