<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  
  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" font-size="16" font-weight="bold">知识精炼流程 (Decompose-then-Recompose)</text>
  
  <!-- Input Document -->
  <rect x="20" y="50" width="180" height="80" rx="8" fill="#FFF3E0" stroke="#FF9800" stroke-width="2"/>
  <text x="110" y="75" text-anchor="middle" font-size="13" font-weight="bold">检索文档</text>
  <text x="110" y="95" text-anchor="middle" font-size="11">长文本，包含</text>
  <text x="110" y="110" text-anchor="middle" font-size="11">相关和无关内容</text>
  
  <line x1="200" y1="90" x2="240" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Decompose -->
  <rect x="250" y="50" width="120" height="80" rx="8" fill="#E1BEE7" stroke="#9C27B0" stroke-width="2"/>
  <text x="310" y="80" text-anchor="middle" font-size="13" font-weight="bold">Decompose</text>
  <text x="310" y="100" text-anchor="middle" font-size="11">分解为</text>
  <text x="310" y="115" text-anchor="middle" font-size="11">知识片段 strips</text>
  
  <line x1="370" y1="90" x2="410" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Filter -->
  <rect x="420" y="50" width="120" height="80" rx="8" fill="#FFCDD2" stroke="#F44336" stroke-width="2"/>
  <text x="480" y="80" text-anchor="middle" font-size="13" font-weight="bold">Filter</text>
  <text x="480" y="100" text-anchor="middle" font-size="11">评估相关性</text>
  <text x="480" y="115" text-anchor="middle" font-size="11">过滤无关片段</text>
  
  <line x1="540" y1="90" x2="580" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Recompose -->
  <rect x="590" y="50" width="90" height="80" rx="8" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2"/>
  <text x="635" y="80" text-anchor="middle" font-size="13" font-weight="bold">Recompose</text>
  <text x="635" y="100" text-anchor="middle" font-size="11">重组为</text>
  <text x="635" y="115" text-anchor="middle" font-size="11">精炼知识</text>
  
  <!-- Strips visualization -->
  <text x="310" y="160" text-anchor="middle" font-size="12" font-weight="bold">分解后的知识片段:</text>
  
  <rect x="100" y="175" width="80" height="30" rx="4" fill="#4CAF50"/>
  <text x="140" y="195" text-anchor="middle" font-size="11" fill="white">strip1 ✓</text>
  
  <rect x="190" y="175" width="80" height="30" rx="4" fill="#F44336"/>
  <text x="230" y="195" text-anchor="middle" font-size="11" fill="white">strip2 ✗</text>
  
  <rect x="280" y="175" width="80" height="30" rx="4" fill="#4CAF50"/>
  <text x="320" y="195" text-anchor="middle" font-size="11" fill="white">strip3 ✓</text>
  
  <rect x="370" y="175" width="80" height="30" rx="4" fill="#F44336"/>
  <text x="410" y="195" text-anchor="middle" font-size="11" fill="white">strip4 ✗</text>
  
  <rect x="460" y="175" width="80" height="30" rx="4" fill="#4CAF50"/>
  <text x="500" y="195" text-anchor="middle" font-size="11" fill="white">strip5 ✓</text>
  
  <!-- Arrow down -->
  <line x1="310" y1="205" x2="310" y2="230" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Output -->
  <rect x="200" y="235" width="220" height="35" rx="8" fill="#C8E6C9" stroke="#4CAF50" stroke-width="2"/>
  <text x="310" y="257" text-anchor="middle" font-size="13">内部知识 = strip1 + strip3 + strip5</text>
  
  <!-- Legend -->
  <rect x="50" y="245" width="20" height="15" fill="#4CAF50"/>
  <text x="75" y="257" font-size="11">相关片段 (保留)</text>
  <rect x="200" y="245" width="20" height="15" fill="#F44336"/>
  <text x="225" y="257" font-size="11">无关片段 (过滤)</text>
</svg>
