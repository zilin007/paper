<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">DPO 计算流程</text>

  <!-- Step 1: Input -->
  <rect x="50" y="55" width="140" height="70" rx="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="120" y="80" text-anchor="middle" font-size="13" fill="#fff">Step 1: 输入</text>
  <text x="120" y="100" text-anchor="middle" font-size="11" fill="#ecf0f1">(x, yw, yl)</text>
  <text x="120" y="115" text-anchor="middle" font-size="10" fill="#ecf0f1">prompt + 偏好对</text>

  <!-- Arrow -->
  <line x1="190" y1="90" x2="250" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Compute ratios -->
  <rect x="250" y="55" width="200" height="70" rx="10" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="350" y="78" text-anchor="middle" font-size="13" fill="#fff">Step 2: 计算比率</text>
  <text x="350" y="98" text-anchor="middle" font-size="11" fill="#ecf0f1">hw = πθ(yw|x) / πref(yw|x)</text>
  <text x="350" y="115" text-anchor="middle" font-size="11" fill="#ecf0f1">hl = πθ(yl|x) / πref(yl|x)</text>

  <!-- Arrow -->
  <line x1="450" y1="90" x2="510" y2="90" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Log transform -->
  <rect x="510" y="55" width="240" height="70" rx="10" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <text x="630" y="78" text-anchor="middle" font-size="13" fill="#fff">Step 3: 对数变换</text>
  <text x="630" y="98" text-anchor="middle" font-size="11" fill="#ecf0f1">Δ = β · (log hw - log hl)</text>
  <text x="630" y="115" text-anchor="middle" font-size="10" fill="#ecf0f1">β 控制 KL 约束强度</text>

  <!-- Arrow down -->
  <line x1="630" y1="125" x2="630" y2="175" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Sigmoid -->
  <rect x="530" y="175" width="200" height="60" rx="10" fill="#e74c3c" stroke="#c0392b" stroke-width="2"/>
  <text x="630" y="200" text-anchor="middle" font-size="13" fill="#fff">Step 4: Sigmoid</text>
  <text x="630" y="220" text-anchor="middle" font-size="11" fill="#ecf0f1">p = σ(Δ) = 1/(1+e^(-Δ))</text>

  <!-- Arrow left -->
  <line x1="530" y1="205" x2="350" y2="205" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Loss -->
  <rect x="250" y="175" width="200" height="60" rx="10" fill="#27ae60" stroke="#219a52" stroke-width="2"/>
  <text x="350" y="200" text-anchor="middle" font-size="13" fill="#fff">Step 5: 损失</text>
  <text x="350" y="220" text-anchor="middle" font-size="11" fill="#ecf0f1">L = -log(p)</text>

  <!-- Arrow left -->
  <line x1="250" y1="205" x2="120" y2="205" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Update -->
  <rect x="50" y="175" width="140" height="60" rx="10" fill="#1abc9c" stroke="#16a085" stroke-width="2"/>
  <text x="120" y="200" text-anchor="middle" font-size="13" fill="#fff">Step 6: 更新</text>
  <text x="120" y="220" text-anchor="middle" font-size="11" fill="#ecf0f1">θ ← θ - η·∇L</text>

  <!-- Explanation box -->
  <rect x="50" y="270" width="700" height="160" rx="10" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="400" y="295" text-anchor="middle" font-size="14" font-weight="bold">直观理解</text>

  <text x="70" y="320" font-size="12">
    <tspan font-weight="bold">比率 hw = πθ(yw|x) / πref(yw|x)</tspan>：模型对偏好回答的"信心倍数"
  </text>
  <text x="70" y="342" font-size="12">
    <tspan font-weight="bold">比率 hl = πθ(yl|x) / πref(yl|x)</tspan>：模型对不偏好回答的"信心倍数"
  </text>
  <text x="70" y="364" font-size="12">
    <tspan font-weight="bold">差值 Δ = β(log hw - log hl)</tspan>：偏好回答应该比不偏好回答"更自信"多少
  </text>
  <text x="70" y="386" font-size="12">
    <tspan font-weight="bold">Sigmoid σ(Δ)</tspan>：把差值映射到 (0,1)，越大说明偏好区分越好
  </text>
  <text x="70" y="408" font-size="12">
    <tspan font-weight="bold">目标</tspan>：让 σ(Δ) → 1，即模型能清楚区分偏好和不偏好回答
  </text>
</svg>
