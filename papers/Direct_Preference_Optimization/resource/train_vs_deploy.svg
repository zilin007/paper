<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">DPO：训练时 vs 推理时</text>

  <!-- Training Phase -->
  <rect x="30" y="50" width="350" height="220" rx="10" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="2"/>
  <text x="205" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#d68910">训练阶段</text>

  <!-- Training components -->
  <rect x="50" y="95" width="120" height="50" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <text x="110" y="118" text-anchor="middle" font-size="12" fill="#fff">输入 x</text>
  <text x="110" y="133" text-anchor="middle" font-size="10" fill="#ecf0f1">prompt</text>

  <line x1="170" y1="120" x2="210" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="95" width="150" height="50" rx="8" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
  <text x="285" y="115" text-anchor="middle" font-size="12" fill="#fff">语言模型 πθ</text>
  <text x="285" y="132" text-anchor="middle" font-size="10" fill="#ecf0f1">可训练 ✓</text>

  <line x1="285" y1="145" x2="285" y2="175" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="210" y="175" width="150" height="50" rx="8" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="285" y="198" text-anchor="middle" font-size="12" fill="#fff">参考模型 πref</text>
  <text x="285" y="215" text-anchor="middle" font-size="10" fill="#ecf0f1">冻结 ✗</text>

  <!-- Arrow between models -->
  <path d="M 285 175 Q 285 160 285 145" fill="none" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="330" y="165" font-size="10" fill="#e74c3c">计算比率</text>

  <!-- Inference Phase -->
  <rect x="420" y="50" width="350" height="220" rx="10" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="595" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#27ae60">推理阶段</text>

  <!-- Inference components -->
  <rect x="440" y="95" width="120" height="50" rx="8" fill="#3498db" stroke="#2980b9" stroke-width="1.5"/>
  <text x="500" y="118" text-anchor="middle" font-size="12" fill="#fff">输入 x</text>
  <text x="500" y="133" text-anchor="middle" font-size="10" fill="#ecf0f1">prompt</text>

  <line x1="560" y1="120" x2="600" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="600" y="95" width="150" height="80" rx="8" fill="#2ecc71" stroke="#27ae60" stroke-width="2"/>
  <text x="675" y="120" text-anchor="middle" font-size="13" fill="#fff">语言模型 πθ*</text>
  <text x="675" y="140" text-anchor="middle" font-size="11" fill="#ecf0f1">训练好的模型</text>
  <text x="675" y="158" text-anchor="middle" font-size="10" fill="#27ae60">直接生成回答</text>

  <!-- Key difference -->
  <rect x="440" y="195" width="310" height="55" rx="8" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="595" y="218" text-anchor="middle" font-size="12" fill="#27ae60">✅ 推理时不需要参考模型</text>
  <text x="595" y="238" text-anchor="middle" font-size="11" fill="#666">参考模型只在训练时提供"锚点"</text>

  <!-- Bottom comparison -->
  <rect x="30" y="280" width="740" height="1" fill="none"/>
  <text x="400" y="295" text-anchor="middle" font-size="11" fill="#666">训练时需要两个模型（πθ + πref），推理时只需要一个模型（πθ*）</text>
</svg>
