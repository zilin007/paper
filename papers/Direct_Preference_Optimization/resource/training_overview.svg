<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold">DPO 训练迭代全景图</text>

  <!-- Round 1 -->
  <rect x="30" y="50" width="220" height="280" rx="10" fill="#ffeaa7" stroke="#fdcb6e" stroke-width="2"/>
  <text x="140" y="75" text-anchor="middle" font-size="14" font-weight="bold">第 1 轮</text>

  <!-- Round 1 content -->
  <rect x="45" y="90" width="190" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="140" y="115" text-anchor="middle" font-size="11">πθ = πref (初始化)</text>

  <rect x="45" y="140" width="190" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="140" y="158" text-anchor="middle" font-size="11">hw = hl = 1</text>
  <text x="140" y="172" text-anchor="middle" font-size="10" fill="#666">Δ = 0, σ(0) = 0.5</text>

  <rect x="45" y="190" width="190" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="140" y="215" text-anchor="middle" font-size="11">L = -log(0.5) ≈ 0.693</text>

  <rect x="45" y="240" width="190" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="140" y="258" text-anchor="middle" font-size="11">θ₁ = θ₀ - η·∇L</text>
  <text x="140" y="272" text-anchor="middle" font-size="10" fill="#666">开始区分偏好</text>

  <!-- Arrow -->
  <line x1="250" y1="190" x2="310" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="180" text-anchor="middle" font-size="11">迭代</text>

  <!-- Round 2 -->
  <rect x="310" y="50" width="220" height="280" rx="10" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="420" y="75" text-anchor="middle" font-size="14" font-weight="bold">第 2 轮</text>

  <!-- Round 2 content -->
  <rect x="325" y="90" width="190" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="420" y="115" text-anchor="middle" font-size="11">πθ₁ 已更新</text>

  <rect x="325" y="140" width="190" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="420" y="158" text-anchor="middle" font-size="11">hw > hl</text>
  <text x="420" y="172" text-anchor="middle" font-size="10" fill="#666">Δ > 0, σ(Δ) > 0.5</text>

  <rect x="325" y="190" width="190" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="420" y="215" text-anchor="middle" font-size="11">L = -log(σ(Δ)) ↓</text>

  <rect x="325" y="240" width="190" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="420" y="258" text-anchor="middle" font-size="11">θ₂ = θ₁ - η·∇L</text>
  <text x="420" y="272" text-anchor="middle" font-size="10" fill="#666">区分能力增强</text>

  <!-- Arrow -->
  <line x1="530" y1="190" x2="590" y2="190" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="560" y="180" text-anchor="middle" font-size="11">继续...</text>

  <!-- Round N -->
  <rect x="590" y="50" width="180" height="280" rx="10" fill="#d6eaf8" stroke="#3498db" stroke-width="2"/>
  <text x="680" y="75" text-anchor="middle" font-size="14" font-weight="bold">第 N 轮 (收敛)</text>

  <!-- Round N content -->
  <rect x="605" y="90" width="150" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="680" y="115" text-anchor="middle" font-size="11">πθ* 最优策略</text>

  <rect x="605" y="140" width="150" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="680" y="158" text-anchor="middle" font-size="11">hw >> hl</text>
  <text x="680" y="172" text-anchor="middle" font-size="10" fill="#666">Δ >> 0, σ(Δ) ≈ 1</text>

  <rect x="605" y="190" width="150" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="680" y="215" text-anchor="middle" font-size="11">L ≈ 0 (最小)</text>

  <rect x="605" y="240" width="150" height="40" rx="6" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="680" y="258" text-anchor="middle" font-size="11">训练完成 ✓</text>
  <text x="680" y="272" text-anchor="middle" font-size="10" fill="#666">输出最终模型</text>

  <!-- Loss curve -->
  <rect x="30" y="340" width="740" height="1" fill="none"/>
</svg>
