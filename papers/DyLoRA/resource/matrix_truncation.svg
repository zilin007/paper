<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="sans-serif">
  <rect width="700" height="480" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">矩阵截断与排序机制详解</text>

  <!-- 完整矩阵 -->
  <rect x="40" y="60" width="280" height="180" rx="10" fill="#eaf2f8" stroke="#3498db" stroke-width="2"/>
  <text x="180" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#2980b9">完整 DyLoRA 矩阵 (r_max = 8)</text>

  <!-- W_up 矩阵示意 -->
  <rect x="60" y="100" width="120" height="120" rx="4" fill="#3498db"/>
  <text x="120" y="165" text-anchor="middle" font-size="11" fill="white">W_up ∈ R^(m×8)</text>
  <text x="120" y="185" text-anchor="middle" font-size="10" fill="#d4e6f1">8 列，每列对应一个秩</text>

  <!-- W_dw 矩阵示意 -->
  <rect x="200" y="100" width="100" height="120" rx="4" fill="#2980b9"/>
  <text x="250" y="165" text-anchor="middle" font-size="11" fill="white">W_dw ∈ R^(8×d)</text>
  <text x="250" y="185" text-anchor="middle" font-size="10" fill="#d4e6f1">8 行，每行对应一个秩</text>

  <!-- 截断示意图 -->
  <rect x="360" y="60" width="300" height="180" rx="10" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="510" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#d68910">截断到秩 b = 4</text>

  <!-- 截断后的 W_up -->
  <rect x="380" y="100" width="60" height="120" rx="4" fill="#f39c12"/>
  <text x="410" y="165" text-anchor="middle" font-size="10" fill="white">W_up↓4</text>
  <text x="410" y="185" text-anchor="middle" font-size="9" fill="#fdebd0">前 4 列</text>

  <!-- 截断后的 W_dw -->
  <rect x="460" y="100" width="60" height="120" rx="4" fill="#e67e22"/>
  <text x="490" y="165" text-anchor="middle" font-size="10" fill="white">W_dw↓4</text>
  <text x="490" y="185" text-anchor="middle" font-size="9" fill="#fdebd0">前 4 行</text>

  <!-- 箭头 -->
  <line x1="340" y1="150" x2="360" y2="150" stroke="#f39c12" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 排序机制 -->
  <rect x="40" y="260" width="620" height="100" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="350" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">排序机制：确保低秩包含重要信息</text>

  <text x="350" y="315" text-anchor="middle" font-size="11" fill="#333">训练时，模型学会将最重要的信息编码在前面的行/列中</text>
  <text x="350" y="335" text-anchor="middle" font-size="11" fill="#333">这样截断到任意秩 b 时，前 b 行/列仍然包含最有价值的表示</text>
  <text x="350" y="355" text-anchor="middle" font-size="11" fill="#27ae60">类比：Nested Dropout 的思想，但应用于矩阵分解而非向量表示</text>

  <!-- 更新策略对比 -->
  <rect x="40" y="380" width="300" height="80" rx="8" fill="#fee"/>
  <text x="190" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Frozen 模式 (推荐)</text>
  <text x="190" y="428" text-anchor="middle" font-size="11" fill="#333">仅更新第 b 行/列: W_up[b], W_dw[b]</text>
  <text x="190" y="448" text-anchor="middle" font-size="11" fill="#333">优点: 防止遗忘, 更快</text>

  <rect x="360" y="380" width="300" height="80" rx="8" fill="#eaf2f8"/>
  <text x="510" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#2980b9">Full 模式</text>
  <text x="510" y="428" text-anchor="middle" font-size="11" fill="#333">更新所有截断参数: W_up↓b, W_dw↓b</text>
  <text x="510" y="448" text-anchor="middle" font-size="11" fill="#333">优点: 性能略高, 但更慢</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#f39c12"/>
    </marker>
  </defs>
</svg>
