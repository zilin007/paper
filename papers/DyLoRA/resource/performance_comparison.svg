<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="sans-serif">
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">DyLoRA vs LoRA: 不同秩下的性能对比</text>

  <!-- X轴: 秩 -->
  <line x1="80" y1="320" x2="650" y2="320" stroke="#333" stroke-width="2"/>
  <text x="365" y="350" text-anchor="middle" font-size="13" fill="#555">秩 (Rank)</text>

  <!-- Y轴: 平均准确率 -->
  <line x1="80" y1="50" x2="80" y2="320" stroke="#333" stroke-width="2"/>
  <text x="30" y="185" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90, 30, 185)">GLUE 平均准确率</text>

  <!-- Y轴刻度 -->
  <text x="70" y="323" text-anchor="end" font-size="11" fill="#999">50</text>
  <text x="70" y="268" text-anchor="end" font-size="11" fill="#999">60</text>
  <text x="70" y="213" text-anchor="end" font-size="11" fill="#999">70</text>
  <text x="70" y="158" text-anchor="end" font-size="11" fill="#999">80</text>
  <text x="70" y="103" text-anchor="end" font-size="11" fill="#999">90</text>

  <!-- X轴刻度 -->
  <text x="120" y="340" text-anchor="middle" font-size="11" fill="#999">1</text>
  <text x="230" y="340" text-anchor="middle" font-size="11" fill="#999">2</text>
  <text x="340" y="340" text-anchor="middle" font-size="11" fill="#999">4</text>
  <text x="450" y="340" text-anchor="middle" font-size="11" fill="#999">8</text>

  <!-- 网格线 -->
  <line x1="80" y1="268" x2="650" y2="268" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="213" x2="650" y2="213" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="158" x2="650" y2="158" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="103" x2="650" y2="103" stroke="#eee" stroke-width="1"/>

  <!-- LoRA 曲线 (在低秩崩溃，高秩才有效) -->
  <polyline points="120,295 230,275 340,225 450,165" fill="none" stroke="#e74c3c" stroke-width="3"/>

  <!-- LoRA 数据点 -->
  <circle cx="120" cy="295" r="6" fill="#e74c3c"/>
  <text x="120" y="282" text-anchor="middle" font-size="10" fill="#e74c3c">54.9</text>

  <circle cx="230" cy="275" r="6" fill="#e74c3c"/>
  <text x="230" y="262" text-anchor="middle" font-size="10" fill="#e74c3c">66.5</text>

  <circle cx="340" cy="225" r="6" fill="#e74c3c"/>
  <text x="340" y="212" text-anchor="middle" font-size="10" fill="#e74c3c">80.0</text>

  <circle cx="450" cy="165" r="6" fill="#e74c3c"/>
  <text x="450" y="152" text-anchor="middle" font-size="10" fill="#e74c3c">85.3</text>

  <!-- DyLoRA 曲线 (所有秩都稳定) -->
  <polyline points="120,155 230,148 340,140 450,142" fill="none" stroke="#27ae60" stroke-width="3"/>

  <!-- DyLoRA 数据点 -->
  <circle cx="120" cy="155" r="6" fill="#27ae60"/>
  <text x="100" y="150" text-anchor="end" font-size="10" fill="#27ae60">84.2</text>

  <circle cx="230" cy="148" r="6" fill="#27ae60"/>
  <text x="210" y="143" text-anchor="end" font-size="10" fill="#27ae60">85.0</text>

  <circle cx="340" cy="140" r="6" fill="#27ae60"/>
  <text x="320" y="135" text-anchor="end" font-size="10" fill="#27ae60">85.5</text>

  <circle cx="450" cy="142" r="6" fill="#27ae60"/>
  <text x="430" y="137" text-anchor="end" font-size="10" fill="#27ae60">85.4</text>

  <!-- 图例 -->
  <line x1="480" y1="80" x2="510" y2="80" stroke="#e74c3c" stroke-width="3"/>
  <text x="515" y="84" font-size="11" fill="#555">LoRA (训练 rank=8)</text>

  <line x1="480" y1="105" x2="510" y2="105" stroke="#27ae60" stroke-width="3"/>
  <text x="515" y="109" font-size="11" fill="#555">DyLoRA (训练 [1,8])</text>

  <!-- 关键观察 -->
  <rect x="480" y="130" width="190" height="100" rx="8" fill="#f8f9f9" stroke="#bdc3c7" stroke-width="1"/>
  <text x="575" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">关键发现</text>
  <text x="575" y="172" text-anchor="middle" font-size="10" fill="#e74c3c">LoRA: 低秩性能崩溃</text>
  <text x="575" y="192" text-anchor="middle" font-size="10" fill="#e74c3c">rank=1 时仅 54.9%</text>
  <text x="575" y="212" text-anchor="middle" font-size="10" fill="#27ae60">DyLoRA: 所有秩都稳定</text>
  <text x="575" y="232" text-anchor="middle" font-size="10" fill="#27ae60">rank=1 时仍 84.2%</text>
</svg>
