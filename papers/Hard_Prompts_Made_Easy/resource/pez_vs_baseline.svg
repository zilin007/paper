<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" font-family="sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="430" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">PEZ vs 基线方法：投影策略对比</text>

  <!-- Baseline: AutoPrompt / FluentPrompt -->
  <g transform="translate(20, 55)">
    <rect x="0" y="0" width="390" height="270" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="195" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#B91C1C">基线方法 (AutoPrompt / FluentPrompt)</text>
    <text x="195" y="48" text-anchor="middle" font-size="12" fill="#B91C1C">每步都投影 -> 容易卡住</text>

    <!-- Step visualization -->
    <!-- Step 1 -->
    <circle cx="60" cy="100" r="18" fill="#3B82F6" opacity="0.3"/>
    <text x="60" y="105" text-anchor="middle" font-size="10" fill="#1D4ED8">P_0</text>

    <line x1="78" y1="100" x2="98" y2="100" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- Proj -->
    <rect x="100" y="86" width="40" height="28" rx="4" fill="#EF4444" opacity="0.2"/>
    <text x="120" y="105" text-anchor="middle" font-size="9" fill="#B91C1C">Proj</text>

    <line x1="140" y1="100" x2="155" y2="100" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- P'_0 -->
    <circle cx="175" cy="100" r="18" fill="#EF4444" opacity="0.2"/>
    <text x="175" y="105" text-anchor="middle" font-size="10" fill="#B91C1C">P'_0</text>

    <!-- Gradient + Proj again -->
    <line x1="175" y1="118" x2="175" y2="138" stroke="#6B7280" stroke-width="1" marker-end="url(#ar)"/>
    <text x="190" y="135" font-size="9" fill="#6B7280">-lr*g</text>

    <circle cx="175" cy="158" r="18" fill="#3B82F6" opacity="0.3"/>
    <text x="175" y="163" text-anchor="middle" font-size="10" fill="#1D4ED8">P_1</text>

    <line x1="193" y1="158" x2="213" y2="158" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="215" y="144" width="40" height="28" rx="4" fill="#EF4444" opacity="0.2"/>
    <text x="235" y="163" text-anchor="middle" font-size="9" fill="#B91C1C">Proj</text>

    <line x1="255" y1="158" x2="275" y2="158" stroke="#6B7280" stroke-width="1.5" marker-end="url(#ar)"/>

    <circle cx="295" cy="158" r="18" fill="#EF4444" opacity="0.2"/>
    <text x="295" y="163" text-anchor="middle" font-size="10" fill="#B91C1C">P'_1</text>

    <!-- Problem annotation -->
    <text x="195" y="210" text-anchor="middle" font-size="12" fill="#DC2626">问题: 每步投影后跳回同一个 token</text>
    <text x="195" y="228" text-anchor="middle" font-size="12" fill="#DC2626">-> 嵌入可能"停滞不动"</text>
    <text x="195" y="248" text-anchor="middle" font-size="12" fill="#DC2626">-> 需要精细调节学习率</text>
  </g>

  <!-- PEZ -->
  <g transform="translate(440, 55)">
    <rect x="0" y="0" width="390" height="270" rx="12" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
    <text x="195" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#065F46">PEZ（本文方法）</text>
    <text x="195" y="48" text-anchor="middle" font-size="12" fill="#065F46">连续空间自由移动 -> 最终一次投影</text>

    <!-- Continuous path -->
    <circle cx="50" cy="100" r="18" fill="#10B981" opacity="0.3"/>
    <text x="50" y="105" text-anchor="middle" font-size="10" fill="#065F46">P_0</text>

    <!-- Dashed project -->
    <line x1="50" y1="82" x2="50" y2="70" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="70" y="72" font-size="9" fill="#3B82F6">Proj(仅前向)</text>

    <!-- Gradient update continuous -->
    <line x1="68" y1="100" x2="102" y2="130" stroke="#10B981" stroke-width="2" marker-end="url(#ar)"/>
    <text x="100" y="112" font-size="9" fill="#065F46">-lr*g</text>

    <circle cx="120" cy="140" r="18" fill="#10B981" opacity="0.3"/>
    <text x="120" y="145" text-anchor="middle" font-size="10" fill="#065F46">P_1</text>

    <line x1="138" y1="140" x2="172" y2="160" stroke="#10B981" stroke-width="2" marker-end="url(#ar)"/>

    <circle cx="190" cy="170" r="18" fill="#10B981" opacity="0.3"/>
    <text x="190" y="175" text-anchor="middle" font-size="10" fill="#065F46">P_2</text>

    <line x1="208" y1="170" x2="232" y2="170" stroke="#10B981" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="245" y="175" font-size="12" fill="#065F46">...</text>

    <circle cx="280" cy="170" r="18" fill="#10B981" opacity="0.3"/>
    <text x="280" y="175" text-anchor="middle" font-size="10" fill="#065F46">P_T</text>

    <!-- Final project -->
    <line x1="298" y1="170" x2="328" y2="170" stroke="#3B82F6" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="330" y="156" width="50" height="28" rx="6" fill="#3B82F6" opacity="0.3"/>
    <text x="355" y="175" text-anchor="middle" font-size="10" font-weight="bold" fill="#1D4ED8">Proj</text>

    <!-- Advantage annotation -->
    <text x="195" y="218" text-anchor="middle" font-size="12" fill="#059669">优势: 连续嵌入自由移动，不被离散点"拖回"</text>
    <text x="195" y="236" text-anchor="middle" font-size="12" fill="#059669">-> 积累多步梯度，探索更好的区域</text>
    <text x="195" y="254" text-anchor="middle" font-size="12" fill="#059669">-> 对学习率更鲁棒</text>
  </g>
</svg>