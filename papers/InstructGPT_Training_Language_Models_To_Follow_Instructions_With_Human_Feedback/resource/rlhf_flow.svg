<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 420" font-family="sans-serif">
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a90d9"/>
    </marker>
  </defs>

  <text x="375" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">RLHF 训练流程</text>

  <!-- Step 1: SFT -->
  <rect x="20" y="60" width="220" height="100" rx="8" fill="#e3f2fd" stroke="#4a90d9" stroke-width="2"/>
  <text x="130" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#4a90d9">Step 1: 监督微调 (SFT)</text>
  <text x="130" y="105" text-anchor="middle" font-size="11" fill="#555">人类标注员写示范回答</text>
  <text x="130" y="125" text-anchor="middle" font-size="11" fill="#555">↓</text>
  <text x="130" y="145" text-anchor="middle" font-size="11" fill="#555">微调 GPT-3 学习模仿</text>

  <!-- Step 2: RM -->
  <rect x="270" y="60" width="220" height="100" rx="8" fill="#fff3e0" stroke="#f39c12" stroke-width="2"/>
  <text x="380" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#f39c12">Step 2: 奖励模型 (RM)</text>
  <text x="380" y="105" text-anchor="middle" font-size="11" fill="#555">模型生成多个回答</text>
  <text x="380" y="125" text-anchor="middle" font-size="11" fill="#555">↓</text>
  <text x="380" y="145" text-anchor="middle" font-size="11" fill="#555">标注员排序 → 训练打分模型</text>

  <!-- Step 3: PPO -->
  <rect x="520" y="60" width="220" height="100" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="630" y="85" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Step 3: PPO 强化学习</text>
  <text x="630" y="105" text-anchor="middle" font-size="11" fill="#555">RM 当裁判自动打分</text>
  <text x="630" y="125" text-anchor="middle" font-size="11" fill="#555">↓</text>
  <text x="630" y="145" text-anchor="middle" font-size="11" fill="#555">PPO 优化策略 → InstructGPT</text>

  <!-- Arrows between steps -->
  <line x1="240" y1="110" x2="270" y2="110" stroke="#4a90d9" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="490" y1="110" x2="520" y2="110" stroke="#f39c12" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Iteration loop -->
  <rect x="270" y="190" width="470" height="80" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="505" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#666">迭代循环（可选）</text>
  <text x="505" y="230" text-anchor="middle" font-size="11" fill="#555">用当前最佳模型生成新回答 → 收集更多标注 → 训练新 RM → 训练新 PPO</text>
  <text x="505" y="250" text-anchor="middle" font-size="11" fill="#555">反复迭代，模型越来越好</text>

  <!-- Arrow from PPO to iteration -->
  <line x1="630" y1="160" x2="630" y2="190" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Data flow -->
  <rect x="20" y="300" width="710" height="100" rx="8" fill="#fafafa" stroke="#ddd" stroke-width="1"/>
  <text x="375" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">数据流</text>

  <!-- Data boxes -->
  <rect x="40" y="335" width="140" height="50" rx="4" fill="#e3f2fd"/>
  <text x="110" y="355" text-anchor="middle" font-size="11" fill="#333">~13k SFT 数据</text>
  <text x="110" y="372" text-anchor="middle" font-size="10" fill="#666">(prompt + 示范回答)</text>

  <rect x="210" y="335" width="140" height="50" rx="4" fill="#fff3e0"/>
  <text x="280" y="355" text-anchor="middle" font-size="11" fill="#333">~33k RM 数据</text>
  <text x="280" y="372" text-anchor="middle" font-size="10" fill="#666">(prompt + 排序回答)</text>

  <rect x="380" y="335" width="140" height="50" rx="4" fill="#e8f5e9"/>
  <text x="450" y="355" text-anchor="middle" font-size="11" fill="#333">~31k PPO 数据</text>
  <text x="450" y="372" text-anchor="middle" font-size="10" fill="#666">(仅 prompt，无标签)</text>

  <rect x="550" y="335" width="160" height="50" rx="4" fill="#f0f0f0"/>
  <text x="630" y="355" text-anchor="middle" font-size="11" fill="#333">预训练数据混入</text>
  <text x="630" y="372" text-anchor="middle" font-size="10" fill="#666">(PPO-ptx 方案)</text>

  <!-- Arrows from data to steps -->
  <line x1="110" y1="335" x2="110" y2="160" stroke="#4a90d9" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="280" y1="335" x2="380" y2="160" stroke="#f39c12" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="450" y1="335" x2="630" y2="160" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>
</svg>
