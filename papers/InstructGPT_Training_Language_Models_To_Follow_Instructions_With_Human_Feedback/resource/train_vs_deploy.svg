<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 300" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <text x="325" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">训练时 vs 部署时</text>

  <!-- Training phase -->
  <rect x="20" y="50" width="280" height="230" rx="8" fill="#fff3e0" stroke="#f39c12" stroke-width="2"/>
  <text x="160" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#f39c12">训练阶段</text>

  <!-- Training components -->
  <rect x="40" y="90" width="240" height="35" rx="4" fill="#4a90d9"/>
  <text x="160" y="113" text-anchor="middle" font-size="12" fill="white">预训练权重 W（初始化）</text>

  <rect x="40" y="135" width="240" height="35" rx="4" fill="#27ae60"/>
  <text x="160" y="158" text-anchor="middle" font-size="12" fill="white">SFT 微调 → 更新 W</text>

  <rect x="40" y="180" width="115" height="35" rx="4" fill="#f39c12"/>
  <text x="98" y="203" text-anchor="middle" font-size="11" fill="white">奖励模型 RM</text>

  <rect x="165" y="180" width="115" height="35" rx="4" fill="#e74c3c"/>
  <text x="223" y="203" text-anchor="middle" font-size="11" fill="white">PPO 优化策略</text>

  <rect x="40" y="225" width="240" height="35" rx="4" fill="#9b59b6"/>
  <text x="160" y="248" text-anchor="middle" font-size="12" fill="white">混入预训练梯度 (PPO-ptx)</text>

  <!-- Arrow -->
  <line x1="300" y1="165" x2="370" y2="165" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="335" y="155" text-anchor="middle" font-size="10" fill="#333">训练完成</text>

  <!-- Deploy phase -->
  <rect x="370" y="50" width="260" height="230" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="2"/>
  <text x="500" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">部署/推理阶段</text>

  <rect x="390" y="90" width="220" height="35" rx="4" fill="#4a90d9"/>
  <text x="500" y="113" text-anchor="middle" font-size="12" fill="white">预训练权重 W（已微调）</text>

  <rect x="390" y="135" width="220" height="35" rx="4" fill="#27ae60"/>
  <text x="500" y="158" text-anchor="middle" font-size="12" fill="white">直接生成回答</text>

  <!-- Crossed out components -->
  <rect x="390" y="180" width="220" height="35" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <line x1="395" y1="185" x2="605" y2="210" stroke="#e74c3c" stroke-width="2"/>
  <text x="500" y="203" text-anchor="middle" font-size="11" fill="#999">✗ 不需要 RM</text>

  <rect x="390" y="225" width="220" height="35" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <line x1="395" y1="230" x2="605" y2="255" stroke="#e74c3c" stroke-width="2"/>
  <text x="500" y="248" text-anchor="middle" font-size="11" fill="#999">✗ 不需要 PPO</text>

  <!-- Key insight box -->
  <rect x="20" y="285" width="610" height="0" rx="0" fill="none" stroke="none"/>

  <!-- Bottom note -->
  <rect x="20" y="280" width="610" height="0" rx="0" fill="none" stroke="none"/>
  <text x="325" y="295" text-anchor="middle" font-size="11" fill="#666">关键：推理时与原始 GPT-3 完全一样，只是权重不同——没有额外开销</text>
</svg>
