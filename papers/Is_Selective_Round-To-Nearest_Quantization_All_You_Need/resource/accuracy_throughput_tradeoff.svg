<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="sans-serif">
  <style>
    .title { font-size: 16px; font-weight: bold; fill: #333; }
    .axis { font-size: 11px; fill: #555; }
    .label { font-size: 12px; fill: #333; }
  </style>

  <!-- Title -->
  <text x="300" y="30" text-anchor="middle" class="title">RTN-5̃ 精度-效率权衡示意</text>

  <!-- Axes -->
  <line x1="80" y1="60" x2="80" y2="280" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="280" x2="550" y2="280" stroke="#333" stroke-width="2"/>

  <!-- Y axis label -->
  <text x="25" y="170" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90 25 170)">精度（Accuracy）↑</text>

  <!-- X axis label -->
  <text x="315" y="310" text-anchor="middle" font-size="12" fill="#333">模型大小（平均比特数）→</text>

  <!-- Grid lines -->
  <line x1="80" y1="100" x2="550" y2="100" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="140" x2="550" y2="140" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="180" x2="550" y2="180" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="220" x2="550" y2="220" stroke="#eee" stroke-width="1"/>

  <!-- X axis ticks -->
  <text x="120" y="298" text-anchor="middle" class="axis">4bit</text>
  <text x="230" y="298" text-anchor="middle" class="axis">5bit</text>
  <text x="340" y="298" text-anchor="middle" class="axis">6bit</text>
  <text x="450" y="298" text-anchor="middle" class="axis">8bit</text>
  <text x="520" y="298" text-anchor="middle" class="axis">16bit</text>

  <!-- Y axis ticks -->
  <text x="70" y="224" text-anchor="end" class="axis">低</text>
  <text x="70" y="104" text-anchor="end" class="axis">高</text>

  <!-- Baseline (16bit) -->
  <circle cx="520" cy="85" r="8" fill="#9e9e9e"/>
  <text x="535" y="89" class="label" fill="#9e9e9e">BF16 基线</text>

  <!-- RTN-8 -->
  <circle cx="450" cy="88" r="8" fill="#4caf50"/>
  <text x="465" y="92" class="label" fill="#4caf50">RTN-8</text>

  <!-- RTN-4 (poor) -->
  <circle cx="120" cy="200" r="8" fill="#f44336"/>
  <text x="135" y="204" class="label" fill="#f44336">RTN-4</text>

  <!-- RTN-5~ (sweet spot) -->
  <circle cx="230" cy="110" r="10" fill="#ff9800" stroke="#e65100" stroke-width="3"/>
  <text x="245" y="105" class="label" fill="#e65100" font-weight="bold">RTN-5̃ ★</text>
  <text x="245" y="122" font-size="10" fill="#e65100">本文推荐方案</text>

  <!-- RTN-6~ -->
  <circle cx="340" cy="95" r="8" fill="#2196f3"/>
  <text x="355" y="99" class="label" fill="#2196f3">RTN-6̃</text>

  <!-- GPTQ/AWQ -->
  <circle cx="120" cy="130" r="8" fill="#9c27b0"/>
  <text x="135" y="134" class="label" fill="#9c27b0">GPTQ/AWQ</text>

  <!-- Arrow showing RTN-5~ advantage -->
  <path d="M 230,110 Q 180,150 120,130" fill="none" stroke="#ff9800" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="140" y="160" font-size="10" fill="#ff9800">精度相当，但无需校准数据</text>

  <!-- Annotation box -->
  <rect x="350" y="160" width="190" height="100" rx="8" fill="#fff3e0" stroke="#ff9800"/>
  <text x="445" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">RTN-5̃ 的优势</text>
  <text x="365" y="208" font-size="10" fill="#333">• 精度 ≈ GPTQ/AWQ</text>
  <text x="365" y="226" font-size="10" fill="#333">• 无需校准数据</text>
  <text x="365" y="244" font-size="10" fill="#333">• 量化速度：毫秒级</text>
  <text x="365" y="262" font-size="10" fill="#333">• 推理吞吐量更高</text>
</svg>
