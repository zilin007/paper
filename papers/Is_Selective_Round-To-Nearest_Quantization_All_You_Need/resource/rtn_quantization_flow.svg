<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" font-family="sans-serif">
  <style>
    .title { font-size: 16px; font-weight: bold; fill: #333; }
    .box { font-size: 13px; fill: #333; }
    .formula { font-size: 14px; fill: #1565c0; font-family: monospace; }
    .arrow { stroke: #555; stroke-width: 2; marker-end: url(#arrowhead); }
    .note { font-size: 11px; fill: #777; font-style: italic; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="325" y="30" text-anchor="middle" class="title">RTN（Round-to-Nearest）量化流程</text>

  <!-- Step 1: Input weights -->
  <rect x="30" y="60" width="150" height="70" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="105" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">输入权重</text>
  <text x="105" y="110" text-anchor="middle" class="box">FP16/BF16 浮点数</text>
  <text x="105" y="125" text-anchor="middle" class="note">例如: [1.23, -0.87, 2.45, ...]</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="95" x2="240" y2="95" class="arrow"/>

  <!-- Step 2: Compute scaling factor -->
  <rect x="240" y="55" width="170" height="80" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="325" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">计算缩放因子 S</text>
  <text x="325" y="105" text-anchor="middle" class="formula">S = max(|r|) / (2^(b-1) - 0.5)</text>
  <text x="325" y="125" text-anchor="middle" class="note">b = 目标比特数 (4或8)</text>

  <!-- Arrow 2 -->
  <line x1="410" y1="95" x2="470" y2="95" class="arrow"/>

  <!-- Step 3: Divide and Round -->
  <rect x="470" y="55" width="155" height="80" rx="8" fill="#e8f5e9" stroke="#2d7d32" stroke-width="2"/>
  <text x="547" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d7d32">除法 + 四舍五入</text>
  <text x="547" y="105" text-anchor="middle" class="formula">Int(r / S)</text>
  <text x="547" y="125" text-anchor="middle" class="note">取最接近的整数</text>

  <!-- Arrow down -->
  <line x1="547" y1="135" x2="547" y2="175" class="arrow"/>

  <!-- Step 4: Truncate -->
  <rect x="470" y="175" width="155" height="70" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="547" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">截断到目标范围</text>
  <text x="547" y="225" text-anchor="middle" class="note">INT4: [-8, 7] / INT8: [-128, 127]</text>

  <!-- Arrow left -->
  <line x1="470" y1="210" x2="340" y2="210" class="arrow"/>

  <!-- Output -->
  <rect x="190" y="175" width="150" height="70" rx="8" fill="#e8f5e9" stroke="#2d7d32" stroke-width="2"/>
  <text x="265" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#2d7d32">输出量化权重</text>
  <text x="265" y="225" text-anchor="middle" class="box">INT4/INT8 整数</text>
  <text x="265" y="240" text-anchor="middle" class="note">例如: [3, -2, 6, ...]</text>

  <!-- Group-wise illustration -->
  <rect x="30" y="280" width="595" height="130" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <text x="325" y="305" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">子通道分组量化（Group-wise Quantization）</text>

  <!-- Weight tensor visualization -->
  <text x="50" y="335" font-size="12" fill="#555">权重张量:</text>
  <rect x="140" y="320" width="40" height="25" rx="3" fill="#bbdefb" stroke="#1565c0"/>
  <text x="160" y="337" text-anchor="middle" font-size="10" fill="#1565c0">g=128</text>
  <rect x="185" y="320" width="40" height="25" rx="3" fill="#c8e6c9" stroke="#2d7d32"/>
  <text x="205" y="337" text-anchor="middle" font-size="10" fill="#2d7d32">g=128</text>
  <rect x="230" y="320" width="40" height="25" rx="3" fill="#fff9c4" stroke="#f9a825"/>
  <text x="250" y="337" text-anchor="middle" font-size="10" fill="#f9a825">g=128</text>
  <text x="285" y="337" font-size="14" fill="#999">...</text>
  <rect x="310" y="320" width="40" height="25" rx="3" fill="#bbdefb" stroke="#1565c0"/>
  <text x="330" y="337" text-anchor="middle" font-size="10" fill="#1565c0">g=128</text>
  <rect x="355" y="320" width="40" height="25" rx="3" fill="#c8e6c9" stroke="#2d7d32"/>
  <text x="375" y="337" text-anchor="middle" font-size="10" fill="#2d7d32">g=128</text>

  <text x="50" y="375" font-size="12" fill="#555">每组独立计算 S:</text>
  <text x="200" y="375" font-size="12" fill="#1565c0">S₁ = max(|g₁|)/7.5</text>
  <text x="350" y="375" font-size="12" fill="#2d7d32">S₂ = max(|g₂|)/7.5</text>
  <text x="500" y="375" font-size="12" fill="#f9a825">S₃ = max(|g₃|)/7.5</text>

  <text x="325" y="405" text-anchor="middle" class="note">好处：限制异常值影响范围，提高量化精度；代价：需要存储更多缩放因子</text>
</svg>
