<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">模型规模与性能的关系 (Scaling Laws)</text>

  <!-- Axes -->
  <line x1="100" y1="340" x2="720" y2="340" stroke="#333" stroke-width="2"/>
  <line x1="100" y1="60" x2="100" y2="340" stroke="#333" stroke-width="2"/>

  <!-- X axis label -->
  <text x="410" y="375" text-anchor="middle" font-size="12" fill="#333">模型参数量 (对数尺度)</text>

  <!-- Y axis label -->
  <text x="30" y="200" text-anchor="middle" font-size="12" fill="#333" transform="rotate(-90, 30, 200)">任务准确率 / 困惑度</text>

  <!-- X axis ticks (log scale) -->
  <text x="130" y="358" text-anchor="middle" font-size="10" fill="#555">125M</text>
  <text x="230" y="358" text-anchor="middle" font-size="10" fill="#555">1.3B</text>
  <text x="350" y="358" text-anchor="middle" font-size="10" fill="#555">6.7B</text>
  <text x="480" y="358" text-anchor="middle" font-size="10" fill="#555">13B</text>
  <text x="620" y="358" text-anchor="middle" font-size="10" fill="#555">175B</text>

  <!-- Grid lines -->
  <line x1="130" y1="60" x2="130" y2="340" stroke="#eee" stroke-width="1"/>
  <line x1="230" y1="60" x2="230" y2="340" stroke="#eee" stroke-width="1"/>
  <line x1="350" y1="60" x2="350" y2="340" stroke="#eee" stroke-width="1"/>
  <line x1="480" y1="60" x2="480" y2="340" stroke="#eee" stroke-width="1"/>
  <line x1="620" y1="60" x2="620" y2="340" stroke="#eee" stroke-width="1"/>

  <!-- Y axis ticks -->
  <text x="90" y="340" text-anchor="end" font-size="10" fill="#555">0%</text>
  <text x="90" y="270" text-anchor="end" font-size="10" fill="#555">25%</text>
  <text x="90" y="200" text-anchor="end" font-size="10" fill="#555">50%</text>
  <text x="90" y="130" text-anchor="end" font-size="10" fill="#555">75%</text>
  <text x="90" y="60" text-anchor="end" font-size="10" fill="#555">100%</text>

  <!-- Zero-shot curve (blue, lower performance) -->
  <polyline points="130,290 230,260 350,230 480,210 620,180" fill="none" stroke="#3498db" stroke-width="3" stroke-linecap="round"/>
  <circle cx="130" cy="290" r="5" fill="#3498db"/>
  <circle cx="230" cy="260" r="5" fill="#3498db"/>
  <circle cx="350" cy="230" r="5" fill="#3498db"/>
  <circle cx="480" cy="210" r="5" fill="#3498db"/>
  <circle cx="620" cy="180" r="5" fill="#3498db"/>

  <!-- One-shot curve (green, middle) -->
  <polyline points="130,285 230,245 350,205 480,175 620,130" fill="none" stroke="#27ae60" stroke-width="3" stroke-linecap="round"/>
  <circle cx="130" cy="285" r="5" fill="#27ae60"/>
  <circle cx="230" cy="245" r="5" fill="#27ae60"/>
  <circle cx="350" cy="205" r="5" fill="#27ae60"/>
  <circle cx="480" cy="175" r="5" fill="#27ae60"/>
  <circle cx="620" cy="130" r="5" fill="#27ae60"/>

  <!-- Few-shot curve (red, highest performance) -->
  <polyline points="130,280 230,230 350,180 480,140 620,80" fill="none" stroke="#e74c3c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="130" cy="280" r="5" fill="#e74c3c"/>
  <circle cx="230" cy="230" r="5" fill="#e74c3c"/>
  <circle cx="350" cy="180" r="5" fill="#e74c3c"/>
  <circle cx="480" cy="140" r="5" fill="#e74c3c"/>
  <circle cx="620" cy="80" r="5" fill="#e74c3c"/>

  <!-- Legend -->
  <rect x="560" y="70" width="180" height="85" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <line x1="575" y1="90" x2="605" y2="90" stroke="#3498db" stroke-width="3"/>
  <text x="615" y="94" font-size="11" fill="#333">Zero-shot (零样本)</text>
  <line x1="575" y1="112" x2="605" y2="112" stroke="#27ae60" stroke-width="3"/>
  <text x="615" y="116" font-size="11" fill="#333">One-shot (单样本)</text>
  <line x1="575" y1="134" x2="605" y2="134" stroke="#e74c3c" stroke-width="3"/>
  <text x="615" y="138" font-size="11" fill="#333">Few-shot (少样本)</text>

  <!-- Key insight annotation -->
  <rect x="130" y="100" width="200" height="50" rx="4" fill="#f9e79f" stroke="#f39c12" stroke-width="1"/>
  <text x="230" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#d68910">关键发现:</text>
  <text x="230" y="135" text-anchor="middle" font-size="10" fill="#555">Few-shot 性能随规模</text>
  <text x="230" y="150" text-anchor="middle" font-size="10" fill="#555">提升速度 &gt; Zero-shot</text>

  <!-- Gap arrow -->
  <line x1="620" y1="180" x2="620" y2="80" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="640" y="135" font-size="10" fill="#e74c3c">差距扩大</text>

</svg>
