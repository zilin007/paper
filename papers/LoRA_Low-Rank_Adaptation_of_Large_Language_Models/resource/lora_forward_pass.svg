<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 260" width="650" height="260" font-family="sans-serif">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5B7FA5"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#27AE60"/>
    </marker>
    <marker id="a3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8E44AD"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="0" y="0" width="650" height="34" rx="6" fill="#D6EAF8"/>
  <text x="325" y="23" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C3E50">LoRA 前向传播数据流</text>

  <!-- Input x -->
  <rect x="16" y="104" width="62" height="40" rx="6" fill="#EDE7F6" stroke="#9575CD" stroke-width="1.2"/>
  <text x="47" y="121" text-anchor="middle" font-size="12" font-weight="bold" fill="#4527A0">x</text>
  <text x="47" y="136" text-anchor="middle" font-size="9" fill="#7E57C2">4 x 1</text>

  <!-- Fork point -->
  <circle cx="105" cy="124" r="4" fill="#666"/>
  <line x1="78" y1="124" x2="101" y2="124" stroke="#666" stroke-width="1.5"/>

  <!-- ====== Path 1: Main path (top) ====== -->
  <!-- Arrow to W0 -->
  <line x1="109" y1="124" x2="109" y2="68" stroke="#5B7FA5" stroke-width="1.5"/>
  <line x1="109" y1="68" x2="178" y2="68" stroke="#5B7FA5" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- W0 box -->
  <rect x="186" y="48" width="90" height="40" rx="6" fill="#D6DBDF" stroke="#95A5A6" stroke-width="1.2"/>
  <text x="231" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#566573">W&#x2080;</text>
  <text x="231" y="80" text-anchor="middle" font-size="9" fill="#7F8C8D">4x4 &#x2744;&#xFE0F;冻结</text>

  <!-- Arrow from W0 to W0x -->
  <line x1="276" y1="68" x2="340" y2="68" stroke="#5B7FA5" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- W0x result -->
  <rect x="348" y="48" width="72" height="40" rx="6" fill="#D6DBDF" stroke="#95A5A6" stroke-width="1.2"/>
  <text x="384" y="65" text-anchor="middle" font-size="11" font-weight="bold" fill="#566573">W&#x2080;x</text>
  <text x="384" y="80" text-anchor="middle" font-size="9" fill="#7F8C8D">4 x 1</text>

  <!-- Label: path 1 -->
  <text x="268" y="44" text-anchor="middle" font-size="10" fill="#5B7FA5" font-style="italic">主路径（冻结）</text>

  <!-- ====== Path 2: LoRA bypass (bottom) ====== -->
  <!-- Arrow down to A -->
  <line x1="109" y1="128" x2="109" y2="186" stroke="#27AE60" stroke-width="1.5"/>
  <line x1="109" y1="186" x2="138" y2="186" stroke="#27AE60" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- A matrix -->
  <rect x="146" y="166" width="72" height="40" rx="6" fill="#A9DFBF" stroke="#27AE60" stroke-width="1.2"/>
  <text x="182" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8449">A</text>
  <text x="182" y="198" text-anchor="middle" font-size="9" fill="#27AE60">2x4 可训练</text>

  <!-- Arrow from A to Ax -->
  <line x1="218" y1="186" x2="248" y2="186" stroke="#27AE60" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Ax result -->
  <rect x="256" y="170" width="56" height="32" rx="5" fill="#D5F5E3" stroke="#27AE60"/>
  <text x="284" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E8449">Ax</text>
  <text x="284" y="202" text-anchor="middle" font-size="8" fill="#27AE60">2x1</text>

  <!-- dimension label -->
  <text x="284" y="164" text-anchor="middle" font-size="9" fill="#E67E22" font-weight="bold">降维 4&#x2192;2</text>

  <!-- Arrow from Ax to B -->
  <line x1="312" y1="186" x2="342" y2="186" stroke="#27AE60" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- B matrix -->
  <rect x="350" y="166" width="72" height="40" rx="6" fill="#A9DFBF" stroke="#27AE60" stroke-width="1.2"/>
  <text x="386" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#1E8449">B</text>
  <text x="386" y="198" text-anchor="middle" font-size="9" fill="#27AE60">4x2 可训练</text>

  <!-- Arrow from B to BAx -->
  <line x1="422" y1="186" x2="452" y2="186" stroke="#27AE60" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- BAx result -->
  <rect x="460" y="170" width="56" height="32" rx="5" fill="#D5F5E3" stroke="#27AE60"/>
  <text x="488" y="190" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E8449">BAx</text>
  <text x="488" y="202" text-anchor="middle" font-size="8" fill="#27AE60">4x1</text>

  <!-- dimension label -->
  <text x="488" y="164" text-anchor="middle" font-size="9" fill="#E67E22" font-weight="bold">升维 2&#x2192;4</text>

  <!-- Label: path 2 -->
  <text x="320" y="228" text-anchor="middle" font-size="10" fill="#27AE60" font-style="italic">LoRA 旁路（可训练）</text>

  <!-- ====== Merge ====== -->
  <!-- Lines converging to merge point -->
  <line x1="420" y1="68" x2="540" y2="68" stroke="#5B7FA5" stroke-width="1.5"/>
  <line x1="540" y1="68" x2="540" y2="112" stroke="#8E44AD" stroke-width="1.5"/>

  <line x1="516" y1="186" x2="540" y2="186" stroke="#27AE60" stroke-width="1.5"/>
  <line x1="540" y1="186" x2="540" y2="140" stroke="#8E44AD" stroke-width="1.5"/>

  <!-- Plus circle -->
  <circle cx="540" cy="126" r="14" fill="#F4ECF7" stroke="#8E44AD" stroke-width="1.5"/>
  <text x="540" y="131" text-anchor="middle" font-size="16" font-weight="bold" fill="#8E44AD">+</text>

  <!-- Arrow to h -->
  <line x1="554" y1="126" x2="580" y2="126" stroke="#8E44AD" stroke-width="1.5" marker-end="url(#a3)"/>

  <!-- Output h -->
  <rect x="588" y="106" width="52" height="40" rx="6" fill="#E8DAEF" stroke="#8E44AD" stroke-width="1.2"/>
  <text x="614" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#6C3483">h</text>
  <text x="614" y="138" text-anchor="middle" font-size="9" fill="#8E44AD">4 x 1</text>

  <!-- Formula at bottom -->
  <rect x="160" y="240" width="330" height="18" rx="4" fill="#FDEBD0" stroke="#F0C040"/>
  <text x="325" y="253" text-anchor="middle" font-size="11" font-weight="bold" fill="#7D6608">h = W&#x2080;x + BAx</text>
</svg>