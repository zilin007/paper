<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" font-family="sans-serif">
  <defs>
    <marker id="at" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7F8C8D"/>
    </marker>
  </defs>

  <!-- Title -->
  <rect x="0" y="0" width="600" height="34" rx="6" fill="#D6EAF8"/>
  <text x="300" y="23" text-anchor="middle" font-size="15" font-weight="bold" fill="#2C3E50">训练迭代全景图</text>

  <!-- Timeline line -->
  <line x1="50" y1="60" x2="50" y2="430" stroke="#B0BEC5" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- ===== Round 1 ===== -->
  <rect x="70" y="46" width="510" height="110" rx="8" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1"/>
  <circle cx="50" cy="56" r="14" fill="#FF9800" stroke="#FFF" stroke-width="2"/>
  <text x="50" y="61" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">1</text>

  <text x="86" y="64" font-size="12" font-weight="bold" fill="#E65100">第 1 轮：初始化</text>

  <!-- Row content for round 1 -->
  <rect x="86" y="72" width="108" height="22" rx="4" fill="#FFE0B2" stroke="#FFB74D"/>
  <text x="140" y="87" text-anchor="middle" font-size="10" fill="#E65100">B=0, A=随机初始化</text>

  <text x="200" y="88" font-size="12" fill="#999">&#x2192;</text>

  <rect x="214" y="72" width="110" height="22" rx="4" fill="#FFE0B2" stroke="#FFB74D"/>
  <text x="269" y="87" text-anchor="middle" font-size="10" fill="#E65100">BAx = 0 (无贡献)</text>

  <text x="330" y="88" font-size="12" fill="#999">&#x2192;</text>

  <rect x="344" y="72" width="100" height="22" rx="4" fill="#FFCCBC" stroke="#FF8A65"/>
  <text x="394" y="87" text-anchor="middle" font-size="10" font-weight="bold" fill="#BF360C">损失 0.185</text>

  <!-- Gradient info -->
  <rect x="86" y="100" width="220" height="20" rx="4" fill="#FBE9E7" stroke="#FFAB91"/>
  <text x="196" y="114" text-anchor="middle" font-size="10" fill="#BF360C">&#x2202;L/&#x2202;B = (&#x2202;L/&#x2202;h)&#xB7;(Ax)&#x1D40; &#x2260; 0    (B 有梯度)</text>

  <rect x="320" y="100" width="246" height="20" rx="4" fill="#FBE9E7" stroke="#FFAB91"/>
  <text x="443" y="114" text-anchor="middle" font-size="10" fill="#BF360C">&#x2202;L/&#x2202;A = B&#x1D40;(&#x2202;L/&#x2202;h)&#xB7;x&#x1D40; = 0    (A 无梯度!)</text>

  <rect x="86" y="126" width="140" height="20" rx="4" fill="#E8F5E9" stroke="#A5D6A7"/>
  <text x="156" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#2E7D32">&#x2192; 仅 B 被更新</text>

  <!-- Arrow down -->
  <line x1="50" y1="160" x2="50" y2="180" stroke="#7F8C8D" stroke-width="2" marker-end="url(#at)"/>

  <!-- ===== Round 2 ===== -->
  <rect x="70" y="180" width="510" height="110" rx="8" fill="#E8F5E9" stroke="#81C784" stroke-width="1"/>
  <circle cx="50" cy="190" r="14" fill="#4CAF50" stroke="#FFF" stroke-width="2"/>
  <text x="50" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF">2</text>

  <text x="86" y="198" font-size="12" font-weight="bold" fill="#1B5E20">第 2 轮：关键转折</text>

  <!-- Star highlight -->
  <text x="192" y="199" font-size="12" fill="#F57F17">&#x2B50;</text>

  <rect x="86" y="206" width="90" height="22" rx="4" fill="#C8E6C9" stroke="#81C784"/>
  <text x="131" y="221" text-anchor="middle" font-size="10" fill="#1B5E20">B &#x2260; 0 了</text>

  <text x="182" y="222" font-size="12" fill="#999">&#x2192;</text>

  <rect x="196" y="206" width="130" height="22" rx="4" fill="#C8E6C9" stroke="#81C784"/>
  <text x="261" y="221" text-anchor="middle" font-size="10" fill="#1B5E20">LoRA 开始有贡献!</text>

  <text x="332" y="222" font-size="12" fill="#999">&#x2192;</text>

  <rect x="346" y="206" width="140" height="22" rx="4" fill="#A5D6A7" stroke="#66BB6A"/>
  <text x="416" y="221" text-anchor="middle" font-size="10" font-weight="bold" fill="#1B5E20">损失 0.1417 (&#x2193;23%)</text>

  <!-- Gradient info -->
  <rect x="86" y="234" width="220" height="20" rx="4" fill="#E8F5E9" stroke="#A5D6A7"/>
  <text x="196" y="248" text-anchor="middle" font-size="10" fill="#2E7D32">B &#x2260; 0 &#x2192; &#x2202;L/&#x2202;A &#x2260; 0   (A 也有梯度了!)</text>

  <rect x="86" y="260" width="180" height="20" rx="4" fill="#C8E6C9" stroke="#81C784"/>
  <text x="176" y="274" text-anchor="middle" font-size="10" font-weight="bold" fill="#1B5E20">&#x2192; A 和 B 同时被更新</text>

  <!-- Arrow down -->
  <line x1="50" y1="294" x2="50" y2="314" stroke="#7F8C8D" stroke-width="2" marker-end="url(#at)"/>

  <!-- ===== Rounds 3-5... ===== -->
  <rect x="70" y="314" width="510" height="80" rx="8" fill="#E3F2FD" stroke="#64B5F6" stroke-width="1"/>
  <circle cx="50" cy="324" r="14" fill="#2196F3" stroke="#FFF" stroke-width="2"/>
  <text x="50" y="329" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFF">3+</text>

  <text x="86" y="332" font-size="12" font-weight="bold" fill="#0D47A1">第 3, 4, 5 ... 轮：协同优化</text>

  <rect x="86" y="340" width="150" height="22" rx="4" fill="#BBDEFB" stroke="#64B5F6"/>
  <text x="161" y="355" text-anchor="middle" font-size="10" fill="#0D47A1">A 和 B 协同优化</text>

  <text x="242" y="356" font-size="12" fill="#999">&#x2192;</text>

  <rect x="256" y="340" width="150" height="22" rx="4" fill="#BBDEFB" stroke="#64B5F6"/>
  <text x="331" y="355" text-anchor="middle" font-size="10" fill="#0D47A1">损失持续下降</text>

  <text x="412" y="356" font-size="12" fill="#999">&#x2192;</text>

  <rect x="426" y="340" width="140" height="22" rx="4" fill="#90CAF9" stroke="#42A5F5"/>
  <text x="496" y="355" text-anchor="middle" font-size="10" font-weight="bold" fill="#0D47A1">直到收敛 &#x2714;</text>

  <!-- Loss curve visualization -->
  <text x="86" y="380" font-size="10" fill="#546E7A">损失曲线趋势:</text>
  <polyline points="170,382 210,374 260,368 320,364 380,362 440,361 500,360" fill="none" stroke="#1565C0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="170" cy="382" r="3" fill="#FF9800"/>
  <circle cx="210" cy="374" r="3" fill="#4CAF50"/>
  <circle cx="500" cy="360" r="3" fill="#2196F3"/>
  <text x="170" y="396" text-anchor="middle" font-size="8" fill="#E65100">0.185</text>
  <text x="210" y="396" text-anchor="middle" font-size="8" fill="#2E7D32">0.142</text>
  <text x="500" y="396" text-anchor="middle" font-size="8" fill="#0D47A1">收敛</text>

  <!-- Bottom summary -->
  <rect x="100" y="412" width="400" height="28" rx="6" fill="#F3E5F5" stroke="#CE93D8"/>
  <text x="300" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#6A1B9A">核心洞察：B 先启动 &#x2192; A 随后被激活 &#x2192; AB 协同收敛</text>
</svg>