<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" font-family="sans-serif">
  <!-- Background -->
  <rect width="750" height="500" fill="#f8f9fa" rx="8"/>
  
  <!-- Title -->
  <text x="375" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">LoftQ 交替优化算法流程</text>
  
  <!-- Input -->
  <rect x="250" y="55" width="250" height="50" fill="#e3f2fd" rx="6" stroke="#1976d2" stroke-width="2"/>
  <text x="375" y="85" text-anchor="middle" font-size="14" fill="#333">预训练权重 W</text>
  
  <text x="375" y="125" text-anchor="middle" font-size="18" fill="#666">↓</text>
  
  <!-- Initialization -->
  <rect x="200" y="135" width="350" height="45" fill="#f3e5f5" rx="6" stroke="#7b1fa2" stroke-width="2"/>
  <text x="375" y="163" text-anchor="middle" font-size="13" fill="#333">初始化: A₀=0, B₀=0, t=1</text>
  
  <text x="375" y="200" text-anchor="middle" font-size="18" fill="#666">↓</text>
  
  <!-- Loop box -->
  <rect x="100" y="210" width="550" height="210" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="8,4" rx="8"/>
  <text x="120" y="235" font-size="12" fill="#666" font-weight="bold">循环 t = 1 → T</text>
  
  <!-- Step 1: Quantization -->
  <rect x="150" y="250" width="450" height="55" fill="#fff3e0" rx="6" stroke="#f57c00" stroke-width="2"/>
  <text x="375" y="273" text-anchor="middle" font-size="13" fill="#333">Step 1: 量化残差 Qₜ = q_N(W - Aₜ₋₁·Bₜ₋₁ᵀ)</text>
  <text x="375" y="295" text-anchor="middle" font-size="11" fill="#666">(减去上一轮 LoRA 近似后再量化)</text>
  
  <text x="375" y="325" text-anchor="middle" font-size="18" fill="#666">↓</text>
  
  <!-- Step 2: SVD -->
  <rect x="150" y="340" width="450" height="65" fill="#e8f5e9" rx="6" stroke="#2e7d32" stroke-width="2"/>
  <text x="375" y="363" text-anchor="middle" font-size="13" fill="#333">Step 2: SVD 分解残差 Rₜ = W - Qₜ</text>
  <text x="375" y="383" text-anchor="middle" font-size="12" fill="#2e7d32">取前 r 个奇异向量 → Aₜ, Bₜ</text>
  <text x="375" y="398" text-anchor="middle" font-size="11" fill="#666">(Aₜ = [√σᵢ·uᵢ], Bₜ = [√σᵢ·vᵢ])</text>
  
  <text x="375" y="440" text-anchor="middle" font-size="18" fill="#666">↓</text>
  
  <!-- Output -->
  <rect x="175" y="450" width="400" height="40" fill="#c8e6c9" rx="6" stroke="#1b5e20" stroke-width="2"/>
  <text x="375" y="475" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">输出: Qₜ (量化权重), Aₜ, Bₜ (LoRA 初始值)</text>
</svg>
