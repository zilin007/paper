<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="sans-serif">
  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold">LoftQ 多轮训练迭代全景图</text>

  <!-- Phase 1: Initialization -->
  <rect x="20" y="55" width="660" height="80" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="350" y="78" text-anchor="middle" font-size="13" font-weight="bold">阶段一: LoftQ 初始化 (离线, 一次性)</text>
  <text x="100" y="100" font-size="11">交替优化 T 轮:</text>
  <text x="250" y="100" font-size="11">Q_t = q_N(W - A_{t-1}B_{t-1}ᵀ)</text>
  <text x="450" y="100" font-size="11">A_t, B_t = SVD(W - Q_t)</text>
  <text x="600" y="100" font-size="11" fill="#27ae60">→ 得到 Q_T, A_T, B_T</text>

  <!-- Arrow -->
  <line x1="350" y1="135" x2="350" y2="155" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 2: Fine-tuning iterations -->
  <rect x="20" y="160" width="660" height="280" rx="8" fill="#e8f8f5" stroke="#1abc9c" stroke-width="2"/>
  <text x="350" y="185" text-anchor="middle" font-size="13" font-weight="bold">阶段二: LoRA 微调 (冻结 Q_T, 只训练 A, B)</text>

  <!-- Iteration boxes -->
  <!-- Iteration 1 -->
  <rect x="40" y="205" width="180" height="100" rx="8" fill="#ffffff" stroke="#2980b9" stroke-width="2"/>
  <text x="130" y="225" text-anchor="middle" font-size="12" font-weight="bold">第 1 轮</text>
  <text x="55" y="245" font-size="10">前向: Y₁ = XQ_T + XA_TB_Tᵀ</text>
  <text x="55" y="260" font-size="10">损失: L₁ = CE(Y₁, label)</text>
  <text x="55" y="275" font-size="10">反向: ∂L/∂A, ∂L/∂B</text>
  <text x="55" y="290" font-size="10">更新: A ← A - η·∂L/∂A</text>
  <text x="55" y="300" font-size="10">B ← B - η·∂L/∂B</text>

  <!-- Arrow -->
  <line x1="220" y1="255" x2="260" y2="255" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="240" y="248" text-anchor="middle" font-size="9">损失↓</text>

  <!-- Iteration 2 -->
  <rect x="260" y="205" width="180" height="100" rx="8" fill="#ffffff" stroke="#2980b9" stroke-width="2"/>
  <text x="350" y="225" text-anchor="middle" font-size="12" font-weight="bold">第 2 轮</text>
  <text x="275" y="245" font-size="10">前向: Y₂ = XQ_T + XA'B'ᵀ</text>
  <text x="275" y="260" font-size="10">损失: L₂ &lt; L₁ ✓</text>
  <text x="275" y="275" font-size="10">反向: ∂L/∂A, ∂L/∂B</text>
  <text x="275" y="290" font-size="10">更新: A ← A' - η·∂L/∂A</text>
  <text x="275" y="300" font-size="10">B ← B' - η·∂L/∂B</text>

  <!-- Arrow -->
  <line x1="440" y1="255" x2="480" y2="255" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="248" text-anchor="middle" font-size="9">损失↓↓</text>

  <!-- Iteration 3 -->
  <rect x="480" y="205" width="180" height="100" rx="8" fill="#ffffff" stroke="#2980b9" stroke-width="2"/>
  <text x="570" y="225" text-anchor="middle" font-size="12" font-weight="bold">第 3 轮</text>
  <text x="495" y="245" font-size="10">前向: Y₃ = XQ_T + XA''B''ᵀ</text>
  <text x="495" y="260" font-size="10">损失: L₃ &lt; L₂ ✓</text>
  <text x="495" y="275" font-size="10">反向: ∂L/∂A, ∂L/∂B</text>
  <text x="495" y="290" font-size="10">更新: A ← A'' - η·∂L/∂A</text>
  <text x="495" y="300" font-size="10">B ← B'' - η·∂L/∂B</text>

  <!-- Dots for more iterations -->
  <text x="350" y="335" text-anchor="middle" font-size="20">· · ·</text>

  <!-- Final result -->
  <rect x="200" y="355" width="300" height="60" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="350" y="378" text-anchor="middle" font-size="12" font-weight="bold">收敛: A*, B* 使适应任务</text>
  <text x="350" y="395" text-anchor="middle" font-size="11">Q_T 始终冻结, 保持量化精度</text>

  <!-- Key insight box -->
  <rect x="20" y="430" width="660" height="40" rx="8" fill="#fadbd8" stroke="#e74c3c" stroke-width="1"/>
  <text x="350" y="455" text-anchor="middle" font-size="11">关键: LoftQ 的 A_T, B_T 从 SVD 初始化, 已经吸收了量化误差, 所以微调起点远优于 QLoRA 的零初始化</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
</svg>
