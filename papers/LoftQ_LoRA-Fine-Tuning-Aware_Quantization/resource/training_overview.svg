<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 400" font-family="sans-serif">
  <!-- Background -->
  <rect width="750" height="400" fill="#f8f9fa" rx="8"/>
  
  <!-- Title -->
  <text x="375" y="35" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">训练迭代全景：LoftQ 如何逐步收敛</text>
  
  <!-- Axes -->
  <line x1="80" y1="320" x2="700" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="320" stroke="#333" stroke-width="2"/>
  <text x="390" y="360" text-anchor="middle" font-size="13" fill="#333">训练步数</text>
  <text x="30" y="190" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90 30 190)">损失值</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="260" x2="700" y2="260" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="200" x2="700" y2="200" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="140" x2="700" y2="140" stroke="#ddd" stroke-width="1"/>
  <line x1="80" y1="80" x2="700" y2="80" stroke="#ddd" stroke-width="1"/>
  
  <!-- Y-axis labels -->
  <text x="70" y="325" text-anchor="end" font-size="11" fill="#666">0</text>
  <text x="70" y="265" text-anchor="end" font-size="11" fill="#666">1</text>
  <text x="70" y="205" text-anchor="end" font-size="11" fill="#666">2</text>
  <text x="70" y="145" text-anchor="end" font-size="11" fill="#666">3</text>
  <text x="70" y="85" text-anchor="end" font-size="11" fill="#666">4</text>
  
  <!-- X-axis labels -->
  <text x="150" y="340" text-anchor="middle" font-size="11" fill="#666">0</text>
  <text x="270" y="340" text-anchor="middle" font-size="11" fill="#666">100</text>
  <text x="390" y="340" text-anchor="middle" font-size="11" fill="#666">200</text>
  <text x="510" y="340" text-anchor="middle" font-size="11" fill="#666">300</text>
  <text x="630" y="340" text-anchor="middle" font-size="11" fill="#666">400</text>
  
  <!-- QLoRA curve (dashed, high loss) -->
  <path d="M 150 100 L 270 110 L 390 120 L 510 125 L 630 128" fill="none" stroke="#d32f2f" stroke-width="3" stroke-dasharray="8,4"/>
  
  <!-- LoftQ curve (solid, lower loss) -->
  <path d="M 150 180 L 270 230 L 390 270 L 510 295 L 630 305" fill="none" stroke="#2e7d32" stroke-width="3"/>
  
  <!-- Annotations -->
  <rect x="480" y="90" width="200" height="30" fill="#ffebee" rx="4"/>
  <text x="580" y="110" text-anchor="middle" font-size="12" fill="#d32f2f">--- QLoRA: 损失居高不下</text>
  
  <rect x="480" y="130" width="200" height="30" fill="#e8f5e9" rx="4"/>
  <text x="580" y="150" text-anchor="middle" font-size="12" fill="#2e7d32">— LoftQ: 损失稳步下降</text>
  
  <!-- Initial gap annotation -->
  <line x1="150" y1="100" x2="150" y2="180" stroke="#666" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="155" y="145" font-size="11" fill="#666">初始化差距</text>
  
  <!-- Key insight -->
  <rect x="80" y="370" width="590" height="25" fill="#fff3e0" rx="4"/>
  <text x="375" y="387" text-anchor="middle" font-size="12" fill="#f57c00">💡 LoftQ 从更好的起点出发，训练更高效，最终损失更低</text>
</svg>
