<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="sans-serif">
  <style>
    .title { font-size: 16px; font-weight: bold; }
    .label { font-size: 12px; }
    .small { font-size: 11px; }
    .frozen { fill: #bdc3c7; stroke: #7f8c8d; }
    .trainable { fill: #27ae60; stroke: #1e8449; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; }
    .grad-arrow { stroke: #e74c3c; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .grad-arrow-frozen { stroke: #95a5a6; stroke-width: 1.5; stroke-dasharray: 5,5; fill: none; marker-end: url(#arrowhead-gray); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#95a5a6"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" class="title">LongLoRA 训练时梯度流向图</text>

  <!-- Forward pass blocks (left column) -->
  <text x="200" y="70" text-anchor="middle" class="label" fill="#333">前向传播</text>

  <rect x="80" y="90" width="240" height="40" rx="5" class="trainable"/>
  <text x="200" y="115" text-anchor="middle" class="label" fill="white">Embedding 层 (可训练, &lt;2% 参数)</text>

  <rect x="80" y="150" width="240" height="50" rx="5" class="trainable"/>
  <text x="200" y="172" text-anchor="middle" class="label" fill="white">Attention: QKV 投影 + LoRA (B, A)</text>
  <text x="200" y="190" text-anchor="middle" class="small" fill="white">S²-Attn 稀疏注意力 (仅训练时)</text>

  <rect x="80" y="220" width="240" height="40" rx="5" class="trainable"/>
  <text x="200" y="245" text-anchor="middle" class="label" fill="white">FFN 层 + LoRA (可训练)</text>

  <rect x="80" y="280" width="240" height="40" rx="5" class="trainable"/>
  <text x="200" y="305" text-anchor="middle" class="label" fill="white">RMSNorm 层 (可训练, ≤0.004%)</text>

  <rect x="80" y="340" width="240" height="40" rx="5" class="frozen"/>
  <text x="200" y="365" text-anchor="middle" class="label" fill="#333">预训练权重 W (冻结)</text>

  <!-- Arrows for forward pass -->
  <line x1="200" y1="130" x2="200" y2="148" class="arrow"/>
  <line x1="200" y1="200" x2="200" y2="218" class="arrow"/>
  <line x1="200" y1="260" x2="200" y2="278" class="arrow"/>
  <line x1="200" y1="320" x2="200" y2="338" class="arrow"/>

  <!-- Loss -->
  <rect x="120" y="410" width="160" height="45" rx="5" fill="#e74c3c"/>
  <text x="200" y="438" text-anchor="middle" class="label" fill="white">Cross-Entropy Loss</text>
  <line x1="200" y1="380" x2="200" y2="408" class="arrow"/>

  <!-- Gradient flow (right column) -->
  <text x="700" y="70" text-anchor="middle" class="label" fill="#e74c3c">反向传播 (梯度流向)</text>

  <!-- Gradient arrows going UP -->
  <line x1="700" y1="410" x2="700" y2="385" class="grad-arrow"/>
  <text x="720" y="400" class="small" fill="#e74c3c">∂L/∂output</text>

  <!-- To RMSNorm -->
  <rect x="580" y="280" width="240" height="40" rx="5" class="trainable"/>
  <text x="700" y="305" text-anchor="middle" class="label" fill="white">∂L/∂Norm 权重 ✓ 有梯度</text>
  <line x1="700" y1="340" x2="700" y2="318" class="grad-arrow"/>

  <!-- To FFN+LoRA -->
  <rect x="580" y="220" width="240" height="40" rx="5" class="trainable"/>
  <text x="700" y="245" text-anchor="middle" class="label" fill="white">∂L/∂LoRA(B,A) ✓ 有梯度</text>
  <line x1="700" y1="280" x2="700" y2="258" class="grad-arrow"/>

  <!-- To Attention+LoRA -->
  <rect x="580" y="150" width="240" height="50" rx="5" class="trainable"/>
  <text x="700" y="172" text-anchor="middle" class="label" fill="white">∂L/∂LoRA(B,A) ✓ 有梯度</text>
  <text x="700" y="190" text-anchor="middle" class="small" fill="white">∂L/∂S²-Attn 移位 ✓ 有梯度</text>
  <line x1="700" y1="220" x2="700" y2="198" class="grad-arrow"/>

  <!-- To Embedding -->
  <rect x="580" y="90" width="240" height="40" rx="5" class="trainable"/>
  <text x="700" y="115" text-anchor="middle" class="label" fill="white">∂L/∂Embedding ✓ 有梯度</text>
  <line x1="700" y1="150" x2="700" y2="128" class="grad-arrow"/>

  <!-- Frozen weights -->
  <rect x="580" y="340" width="240" height="40" rx="5" class="frozen"/>
  <text x="700" y="365" text-anchor="middle" class="label" fill="#7f8c8d">∂L/∂W ✗ 无梯度 (冻结)</text>
  <line x1="700" y1="380" x2="700" y2="378" class="grad-arrow-frozen"/>

  <!-- Legend -->
  <rect x="30" y="470" width="15" height="15" rx="3" class="trainable"/>
  <text x="55" y="483" class="small">可训练参数 (有梯度)</text>
  <rect x="250" y="470" width="15" height="15" rx="3" class="frozen"/>
  <text x="275" y="483" class="small">冻结参数 (无梯度)</text>
  <line x1="470" y1="478" x2="500" y2="478" class="grad-arrow"/>
  <text x="510" y="483" class="small">梯度流动方向</text>
</svg>
