<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="500" rx="12" ry="12" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#212529">三种剪枝方法对比</text>

  <!-- Column 1: Magnitude -->
  <g transform="translate(15, 55)">
    <rect x="0" y="0" width="300" height="38" rx="6" ry="6" fill="#dc3545"/>
    <text x="150" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="white">Magnitude 按权重大小删</text>
    <rect x="0" y="48" width="300" height="125" rx="6" ry="6" fill="white" stroke="#dee2e6"/>
    <text x="15" y="72" font-size="12" fill="#495057">判据: |w| 权重绝对值</text>
    <text x="15" y="94" font-size="12" fill="#495057">做法: 删绝对值最小的权重</text>
    <text x="15" y="116" font-size="12" fill="#dc3545">问题: 小权重可能很关键!</text>
    <text x="15" y="138" font-size="12" fill="#dc3545">问题: 删后不调整其余权重</text>
    <text x="15" y="160" font-size="12" fill="#6c757d">Hessian: 不使用</text>
    <rect x="0" y="183" width="300" height="80" rx="6" ry="6" fill="white" stroke="#dee2e6"/>
    <text x="150" y="205" text-anchor="middle" font-size="13" fill="#495057" font-weight="bold">Saliency 公式</text>
    <text x="150" y="230" text-anchor="middle" font-size="16" fill="#dc3545" font-weight="bold">s = |w|</text>
    <text x="150" y="252" text-anchor="middle" font-size="11" fill="#6c757d">只看权重大小，忽略曲率</text>
    <rect x="25" y="278" width="250" height="30" rx="6" ry="6" fill="#dc3545" opacity="0.12"/>
    <text x="150" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc3545">效果最差</text>
    <!-- 特征标签 -->
    <rect x="0" y="320" width="300" height="110" rx="6" ry="6" fill="#fff5f5" stroke="#fecaca"/>
    <text x="15" y="343" font-size="12" fill="#495057">删除后:</text>
    <text x="25" y="363" font-size="12" fill="#495057">- 被删权重 -> 0</text>
    <text x="25" y="383" font-size="12" fill="#dc3545">- 其余权重: 不变</text>
    <text x="25" y="403" font-size="12" fill="#dc3545">- 需要重训练才能恢复</text>
    <text x="25" y="423" font-size="12" fill="#6c757d">- 计算成本: O(1)</text>
  </g>

  <!-- Column 2: OBD -->
  <g transform="translate(330, 55)">
    <rect x="0" y="0" width="300" height="38" rx="6" ry="6" fill="#fd7e14"/>
    <text x="150" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="white">OBD 对角 Hessian</text>
    <rect x="0" y="48" width="300" height="125" rx="6" ry="6" fill="white" stroke="#dee2e6"/>
    <text x="15" y="72" font-size="12" fill="#495057">判据: s = h_kk * w^2 / 2</text>
    <text x="15" y="94" font-size="12" fill="#495057">做法: 综合权重大小+曲率</text>
    <text x="15" y="116" font-size="12" fill="#fd7e14">问题: 假设 Hessian 对角</text>
    <text x="15" y="138" font-size="12" fill="#fd7e14">问题: 忽略权重间耦合</text>
    <text x="15" y="160" font-size="12" fill="#6c757d">Hessian: 仅对角元素</text>
    <rect x="0" y="183" width="300" height="80" rx="6" ry="6" fill="white" stroke="#dee2e6"/>
    <text x="150" y="205" text-anchor="middle" font-size="13" fill="#495057" font-weight="bold">Saliency 公式</text>
    <text x="150" y="230" text-anchor="middle" font-size="16" fill="#fd7e14" font-weight="bold">s = h_kk * w^2 / 2</text>
    <text x="150" y="252" text-anchor="middle" font-size="11" fill="#6c757d">考虑曲率，但假设参数独立</text>
    <rect x="25" y="278" width="250" height="30" rx="6" ry="6" fill="#fd7e14" opacity="0.12"/>
    <text x="150" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#fd7e14">效果较好</text>
    <rect x="0" y="320" width="300" height="110" rx="6" ry="6" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="15" y="343" font-size="12" fill="#495057">删除后:</text>
    <text x="25" y="363" font-size="12" fill="#495057">- 被删权重 -> 0</text>
    <text x="25" y="383" font-size="12" fill="#fd7e14">- 其余权重: 不变</text>
    <text x="25" y="403" font-size="12" fill="#fd7e14">- 通常需要重训练</text>
    <text x="25" y="423" font-size="12" fill="#6c757d">- 计算成本: O(n)</text>
  </g>

  <!-- Column 3: OBS -->
  <g transform="translate(645, 55)">
    <rect x="0" y="0" width="300" height="38" rx="6" ry="6" fill="#198754"/>
    <text x="150" y="25" text-anchor="middle" font-size="15" font-weight="bold" fill="white">OBS 完整 Hessian</text>
    <rect x="0" y="48" width="300" height="125" rx="6" ry="6" fill="white" stroke="#dee2e6"/>
    <text x="15" y="72" font-size="12" fill="#495057">判据: L = w^2 / (2*[H^-1]_qq)</text>
    <text x="15" y="94" font-size="12" fill="#495057">做法: 完整二阶信息+权重调整</text>
    <text x="15" y="116" font-size="12" fill="#198754">优势: 不假设 Hessian 对角</text>
    <text x="15" y="138" font-size="12" fill="#198754">优势: 删后最优调整其余权重</text>
    <text x="15" y="160" font-size="12" fill="#6c757d">Hessian: 完整逆矩阵 H^-1</text>
    <rect x="0" y="183" width="300" height="80" rx="6" ry="6" fill="white" stroke="#dee2e6"/>
    <text x="150" y="205" text-anchor="middle" font-size="13" fill="#495057" font-weight="bold">Saliency 公式</text>
    <text x="150" y="230" text-anchor="middle" font-size="16" fill="#198754" font-weight="bold">L = w^2 / (2[H^-1]_qq)</text>
    <text x="150" y="252" text-anchor="middle" font-size="11" fill="#6c757d">用逆 Hessian，考虑全局耦合</text>
    <rect x="25" y="278" width="250" height="30" rx="6" ry="6" fill="#198754" opacity="0.12"/>
    <text x="150" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#198754">效果最好</text>
    <rect x="0" y="320" width="300" height="110" rx="6" ry="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="15" y="343" font-size="12" fill="#495057">删除后:</text>
    <text x="25" y="363" font-size="12" fill="#495057">- 被删权重 -> 0</text>
    <text x="25" y="383" font-size="12" fill="#198754">- 其余权重: 最优调整!</text>
    <text x="25" y="403" font-size="12" fill="#198754">- 通常不需要重训练</text>
    <text x="25" y="423" font-size="12" fill="#6c757d">- 计算成本: O(n^2)</text>
  </g>

  <!-- Bottom arrow -->
  <line x1="120" y1="480" x2="840" y2="480" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="480" y="496" text-anchor="middle" font-size="13" fill="#6c757d" font-style="italic">剪枝精度与复杂度提升 E(mag) >= E(OBD) >= E(OBS)</text>
</svg>