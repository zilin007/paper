<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 480" font-family="sans-serif">
  <!-- 标题 -->
  <text x="375" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">P-Tuning v2 梯度流向图</text>
  <text x="375" y="45" text-anchor="middle" font-size="12" fill="#868e96">红色箭头 = 梯度流向 | 绿色 = 可训练参数 | 灰色 = 冻结参数</text>
  
  <!-- 输入 -->
  <rect x="300" y="65" width="150" height="35" rx="6" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="375" y="88" text-anchor="middle" font-size="12" fill="#495057">输入嵌入 x</text>
  
  <!-- 向下的箭头 -->
  <line x1="375" y1="100" x2="375" y2="125" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Layer 1 -->
  <rect x="200" y="130" width="350" height="70" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  <text x="375" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#495057">Transformer Layer 1</text>
  
  <!-- 冻结权重 -->
  <rect x="220" y="165" width="100" height="25" rx="4" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="270" y="182" text-anchor="middle" font-size="10" fill="#868e96">W⁽¹⁾ (冻结)</text>
  
  <!-- 可训练提示 -->
  <rect x="335" y="165" width="100" height="25" rx="4" fill="#51cf66" stroke="#2b8a3e"/>
  <text x="385" y="182" text-anchor="middle" font-size="10" fill="white">P⁽¹⁾ (可训练)</text>
  
  <!-- Layer 2 -->
  <rect x="200" y="215" width="350" height="70" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  <text x="375" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#495057">Transformer Layer 2</text>
  
  <rect x="220" y="250" width="100" height="25" rx="4" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="270" y="267" text-anchor="middle" font-size="10" fill="#868e96">W⁽²⁾ (冻结)</text>
  
  <rect x="335" y="250" width="100" height="25" rx="4" fill="#51cf66" stroke="#2b8a3e"/>
  <text x="385" y="267" text-anchor="middle" font-size="10" fill="white">P⁽²⁾ (可训练)</text>
  
  <!-- Layer 3 -->
  <rect x="200" y="300" width="350" height="70" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2"/>
  <text x="375" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#495057">Transformer Layer 3</text>
  
  <rect x="220" y="335" width="100" height="25" rx="4" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="270" y="352" text-anchor="middle" font-size="10" fill="#868e96">W⁽³⁾ (冻结)</text>
  
  <rect x="335" y="335" width="100" height="25" rx="4" fill="#51cf66" stroke="#2b8a3e"/>
  <text x="385" y="352" text-anchor="middle" font-size="10" fill="white">P⁽³⁾ (可训练)</text>
  
  <!-- 层间箭头 -->
  <line x1="375" y1="200" x2="375" y2="215" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="375" y1="285" x2="375" y2="300" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 分类头 -->
  <rect x="275" y="385" width="200" height="40" rx="6" fill="#51cf66" stroke="#2b8a3e"/>
  <text x="375" y="410" text-anchor="middle" font-size="12" fill="white">线性分类头 W_cls (可训练)</text>
  
  <!-- 输出 -->
  <line x1="375" y1="370" x2="375" y2="385" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  <rect x="310" y="435" width="130" height="30" rx="6" fill="#e9ecef" stroke="#adb5bd"/>
  <text x="375" y="455" text-anchor="middle" font-size="11" fill="#495057">输出 ŷ, 损失 L</text>
  
  <!-- 梯度回流箭头 (红色) -->
  <!-- 从损失到分类头 -->
  <path d="M 500 450 Q 580 450 580 405 Q 580 385 475 385" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="590" y="420" font-size="10" fill="#e03131">∂L/∂W_cls</text>
  
  <!-- 从分类头到 Layer 3 提示 -->
  <path d="M 500 380 Q 600 380 600 335 Q 600 315 435 315" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="610" y="350" font-size="10" fill="#e03131">∂L/∂P⁽³⁾</text>
  <text x="610" y="365" font-size="9" fill="#e03131">(梯度最大)</text>
  
  <!-- 从 Layer 3 到 Layer 2 提示 -->
  <path d="M 500 310 Q 620 310 620 267 Q 620 250 435 250" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="630" y="285" font-size="10" fill="#e03131">∂L/∂P⁽²⁾</text>
  <text x="630" y="300" font-size="9" fill="#e03131">(梯度中等)</text>
  
  <!-- 从 Layer 2 到 Layer 1 提示 -->
  <path d="M 500 230 Q 640 230 640 182 Q 640 165 435 165" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <text x="650" y="200" font-size="10" fill="#e03131">∂L/∂P⁽¹⁾</text>
  <text x="650" y="215" font-size="9" fill="#e03131">(梯度较小)</text>
  
  <!-- 冻结权重无梯度标注 -->
  <text x="150" y="180" font-size="10" fill="#868e96">∂L/∂W⁽¹⁾ = 0 ✗</text>
  <text x="150" y="265" font-size="10" fill="#868e96">∂L/∂W⁽²⁾ = 0 ✗</text>
  <text x="150" y="350" font-size="10" fill="#868e96">∂L/∂W⁽³⁾ = 0 ✗</text>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e03131"/>
    </marker>
  </defs>
  
  <!-- 底部说明 -->
  <text x="375" y="475" text-anchor="middle" font-size="10" fill="#868e96">关键：所有层提示都有梯度，但越深层梯度越大 → 深层提示对预测影响更直接</text>
</svg>
