<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#374151"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10B981"/>
    </marker>
  </defs>

  <text x="390" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Adapter 模块内部计算流程 (瓶颈结构)</text>

  <!-- Left: Full adapter computation flow -->
  <g transform="translate(50, 50)">
    <text x="140" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">前向传播数据流</text>

    <!-- Input -->
    <rect x="60" y="20" width="160" height="36" rx="8" ry="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="140" y="43" text-anchor="middle" font-size="13" fill="#1E40AF">输入 x (d 维)</text>

    <!-- Down-project -->
    <line x1="140" y1="56" x2="140" y2="80" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="40" y="85" width="200" height="44" rx="8" ry="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="140" y="104" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">降维投影 W_down</text>
    <text x="140" y="120" text-anchor="middle" font-size="11" fill="#059669">d -> m  (如 768 -> 64)</text>

    <!-- Nonlinearity -->
    <line x1="140" y1="129" x2="140" y2="150" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="55" y="155" width="170" height="36" rx="8" ry="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="140" y="178" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">ReLU 激活函数</text>

    <!-- Up-project -->
    <line x1="140" y1="191" x2="140" y2="212" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="40" y="217" width="200" height="44" rx="8" ry="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="140" y="236" text-anchor="middle" font-size="13" fill="#065F46" font-weight="bold">升维投影 W_up</text>
    <text x="140" y="252" text-anchor="middle" font-size="11" fill="#059669">m -> d  (如 64 -> 768)</text>

    <!-- Skip connection line -->
    <line x1="60" y1="38" x2="20" y2="38" stroke="#3B82F6" stroke-width="2"/>
    <line x1="20" y1="38" x2="20" y2="290" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6,3"/>
    <line x1="20" y1="290" x2="115" y2="290" stroke="#3B82F6" stroke-width="2" marker-end="url(#arr)"/>
    <text x="8" y="168" text-anchor="middle" font-size="11" fill="#3B82F6" transform="rotate(-90, 8, 168)">跳跃连接 (skip)</text>

    <!-- Add -->
    <circle cx="140" cy="290" r="18" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="140" y="295" text-anchor="middle" font-size="18" font-weight="bold" fill="#3B82F6">+</text>
    <line x1="140" y1="261" x2="140" y2="272" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>

    <!-- Output -->
    <line x1="140" y1="308" x2="140" y2="330" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="60" y="335" width="160" height="36" rx="8" ry="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="140" y="358" text-anchor="middle" font-size="13" fill="#1E40AF">输出 (d 维)</text>

    <!-- Formula -->
    <rect x="-10" y="390" width="300" height="50" rx="8" ry="8" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
    <text x="140" y="412" text-anchor="middle" font-size="13" fill="#374151" font-weight="bold">Adapter(x) = x + W_up · ReLU(W_down · x)</text>
    <text x="140" y="430" text-anchor="middle" font-size="11" fill="#6B7280">初始化 W_up 近零 => 初始输出 ≈ x (近恒等)</text>
  </g>

  <!-- Right: Dimension visualization -->
  <g transform="translate(430, 50)">
    <text x="160" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">维度变化示意 (瓶颈)</text>

    <!-- Wide input bar -->
    <rect x="30" y="30" width="260" height="40" rx="6" ry="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="160" y="55" text-anchor="middle" font-size="13" fill="#1E40AF">输入: d = 768 维</text>

    <!-- Narrowing arrow -->
    <polygon points="100,80 220,80 190,120 130,120" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="160" y="105" text-anchor="middle" font-size="11" fill="#065F46">W_down</text>

    <!-- Narrow bottleneck -->
    <rect x="110" y="125" width="100" height="45" rx="6" ry="6" fill="#A7F3D0" stroke="#10B981" stroke-width="2"/>
    <text x="160" y="145" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">瓶颈: m = 64</text>
    <text x="160" y="162" text-anchor="middle" font-size="11" fill="#059669">+ ReLU</text>

    <!-- Widening arrow -->
    <polygon points="130,175 190,175 220,215 100,215" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="160" y="200" text-anchor="middle" font-size="11" fill="#065F46">W_up</text>

    <!-- Wide output bar -->
    <rect x="30" y="220" width="260" height="40" rx="6" ry="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="160" y="245" text-anchor="middle" font-size="13" fill="#1E40AF">输出: d = 768 维</text>

    <!-- Parameter count -->
    <rect x="10" y="290" width="300" height="120" rx="8" ry="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="160" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">参数量计算</text>
    <text x="160" y="340" text-anchor="middle" font-size="12" fill="#6B7280">W_down: d x m = 768 x 64 = 49,152</text>
    <text x="160" y="358" text-anchor="middle" font-size="12" fill="#6B7280">W_up:   m x d = 64 x 768 = 49,152</text>
    <text x="160" y="376" text-anchor="middle" font-size="12" fill="#6B7280">偏置: d + m = 768 + 64 = 832</text>
    <line x1="50" y1="383" x2="270" y2="383" stroke="#D1D5DB" stroke-width="1"/>
    <text x="160" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#10B981">每个 Adapter: 约 99,136 (≈0.1M)</text>

    <!-- vs original -->
    <text x="160" y="435" text-anchor="middle" font-size="12" fill="#6B7280">对比: Transformer 层 ≈ 7M 参数</text>
    <text x="160" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#10B981">仅占原层参数的 ~1.4%</text>
  </g>
</svg>