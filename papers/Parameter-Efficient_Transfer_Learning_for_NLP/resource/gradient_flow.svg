<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="sans-serif">
  <defs>
    <marker id="ga" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#374151"/>
    </marker>
    <marker id="ga-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EF4444"/>
    </marker>
    <marker id="ga-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10B981"/>
    </marker>
  </defs>

  <text x="410" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Adapter 训练: 梯度流向 vs 全量微调</text>

  <!-- Left: Fine-tuning gradient flow -->
  <g transform="translate(30, 55)">
    <text x="150" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#F59E0B">全量微调 (Fine-tuning)</text>

    <rect x="50" y="20" width="200" height="30" rx="6" ry="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="150" y="40" text-anchor="middle" font-size="12" fill="#92400E">分类头 (可训练)</text>

    <line x1="150" y1="50" x2="150" y2="68" stroke="#EF4444" stroke-width="2" marker-end="url(#ga-red)"/>

    <rect x="50" y="72" width="200" height="30" rx="6" ry="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="150" y="92" text-anchor="middle" font-size="12" fill="#92400E">Layer Norm (可训练)</text>

    <line x1="150" y1="102" x2="150" y2="118" stroke="#EF4444" stroke-width="2" marker-end="url(#ga-red)"/>

    <rect x="50" y="122" width="200" height="30" rx="6" ry="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="150" y="142" text-anchor="middle" font-size="12" fill="#92400E">FFN (可训练)</text>

    <line x1="150" y1="152" x2="150" y2="168" stroke="#EF4444" stroke-width="2" marker-end="url(#ga-red)"/>

    <rect x="50" y="172" width="200" height="30" rx="6" ry="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="150" y="192" text-anchor="middle" font-size="12" fill="#92400E">Attention (可训练)</text>

    <line x1="150" y1="202" x2="150" y2="218" stroke="#EF4444" stroke-width="2" marker-end="url(#ga-red)"/>

    <text x="150" y="235" text-anchor="middle" font-size="11" fill="#6B7280">... 更多层 ...</text>

    <!-- Gradient label -->
    <line x1="280" y1="35" x2="280" y2="195" stroke="#EF4444" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="285" y="120" font-size="11" fill="#EF4444" transform="rotate(90, 285, 120)">梯度流过所有层</text>

    <!-- Summary -->
    <rect x="20" y="255" width="260" height="55" rx="8" ry="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="150" y="275" text-anchor="middle" font-size="12" fill="#DC2626">所有 330M 参数都接收梯度</text>
    <text x="150" y="295" text-anchor="middle" font-size="12" fill="#DC2626">需要优化器为每个参数维护状态</text>
  </g>

  <!-- Right: Adapter gradient flow -->
  <g transform="translate(430, 55)">
    <text x="170" y="0" text-anchor="middle" font-size="14" font-weight="bold" fill="#10B981">Adapter 微调 (本文)</text>

    <rect x="70" y="20" width="200" height="30" rx="6" ry="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="170" y="40" text-anchor="middle" font-size="12" fill="#065F46">分类头 (可训练)</text>

    <line x1="170" y1="50" x2="170" y2="68" stroke="#10B981" stroke-width="2" marker-end="url(#ga-green)"/>

    <rect x="70" y="72" width="200" height="30" rx="6" ry="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="170" y="92" text-anchor="middle" font-size="12" fill="#065F46">Layer Norm (可训练)</text>

    <line x1="170" y1="102" x2="170" y2="118" stroke="#374151" stroke-width="1.5" marker-end="url(#ga)"/>

    <rect x="70" y="122" width="200" height="30" rx="6" ry="6" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="170" y="142" text-anchor="middle" font-size="12" fill="#6B7280">FFN (冻结)</text>

    <!-- Adapter after FFN -->
    <line x1="170" y1="152" x2="170" y2="164" stroke="#374151" stroke-width="1.5"/>
    <rect x="90" y="166" width="160" height="26" rx="6" ry="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="170" y="183" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Adapter (可训练)</text>

    <line x1="170" y1="192" x2="170" y2="206" stroke="#374151" stroke-width="1.5" marker-end="url(#ga)"/>

    <rect x="70" y="210" width="200" height="30" rx="6" ry="6" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="170" y="230" text-anchor="middle" font-size="12" fill="#6B7280">Attention (冻结)</text>

    <!-- Adapter after Attention -->
    <line x1="170" y1="240" x2="170" y2="252" stroke="#374151" stroke-width="1.5"/>
    <rect x="90" y="254" width="160" height="26" rx="6" ry="6" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="170" y="271" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Adapter (可训练)</text>

    <!-- Gradient annotations -->
    <line x1="300" y1="35" x2="300" y2="90" stroke="#10B981" stroke-width="2"/>
    <line x1="300" y1="100" x2="300" y2="145" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="300" y1="155" x2="300" y2="190" stroke="#10B981" stroke-width="2"/>
    <line x1="300" y1="200" x2="300" y2="235" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="300" y1="245" x2="300" y2="275" stroke="#10B981" stroke-width="2"/>
    <text x="340" y="70" font-size="10" fill="#10B981">更新</text>
    <text x="340" y="130" font-size="10" fill="#9CA3AF">穿过</text>
    <text x="340" y="175" font-size="10" fill="#10B981">更新</text>
    <text x="340" y="220" font-size="10" fill="#9CA3AF">穿过</text>
    <text x="340" y="265" font-size="10" fill="#10B981">更新</text>

    <!-- Summary -->
    <rect x="30" y="295" width="300" height="55" rx="8" ry="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="180" y="315" text-anchor="middle" font-size="12" fill="#065F46">仅 Adapter + LayerNorm + 分类头 接收梯度</text>
    <text x="180" y="335" text-anchor="middle" font-size="12" fill="#065F46">约 3.6% 参数, 优化器状态大幅减少</text>
  </g>

  <!-- Legend -->
  <g transform="translate(250, 375)">
    <rect x="0" y="0" width="14" height="14" rx="2" ry="2" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="20" y="12" font-size="12" fill="#374151">可训练 (接收梯度并更新)</text>
    <rect x="200" y="0" width="14" height="14" rx="2" ry="2" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="220" y="12" font-size="12" fill="#374151">冻结 (梯度穿过但不更新)</text>
  </g>
</svg>