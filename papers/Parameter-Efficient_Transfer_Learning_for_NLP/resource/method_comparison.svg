<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="sans-serif">
  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">三种迁移学习方案对比</text>

  <!-- Method 1: Feature-based -->
  <g transform="translate(30, 60)">
    <text x="120" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#6B7280">特征提取 (Feature-based)</text>
    <!-- Pre-trained model -->
    <rect x="30" y="20" width="180" height="140" rx="8" ry="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="120" y="55" text-anchor="middle" font-size="13" fill="#6B7280">预训练模型</text>
    <text x="120" y="75" text-anchor="middle" font-size="12" fill="#9CA3AF">(冻结, 提取特征)</text>
    <rect x="50" y="90" width="140" height="25" rx="4" ry="4" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1"/>
    <text x="120" y="107" text-anchor="middle" font-size="11" fill="#6B7280">Layer 1...N</text>
    <rect x="50" y="120" width="140" height="25" rx="4" ry="4" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1"/>
    <text x="120" y="137" text-anchor="middle" font-size="11" fill="#6B7280">Embeddings</text>
    <!-- Arrow -->
    <line x1="120" y1="165" x2="120" y2="185" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow-gray)"/>
    <!-- New model -->
    <rect x="30" y="190" width="180" height="60" rx="8" ry="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="120" y="215" text-anchor="middle" font-size="13" fill="#3B82F6">全新下游模型</text>
    <text x="120" y="233" text-anchor="middle" font-size="11" fill="#3B82F6">(需要设计+训练)</text>
    <!-- Problems -->
    <rect x="10" y="270" width="220" height="70" rx="6" ry="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="120" y="290" text-anchor="middle" font-size="12" fill="#DC2626">每个任务需要独立的下游模型</text>
    <text x="120" y="308" text-anchor="middle" font-size="12" fill="#DC2626">特征固定, 无法适配任务</text>
    <text x="120" y="326" text-anchor="middle" font-size="12" fill="#DC2626">效果通常不如 Fine-tuning</text>
  </g>

  <!-- Method 2: Fine-tuning -->
  <g transform="translate(310, 60)">
    <text x="120" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#6B7280">全量微调 (Fine-tuning)</text>
    <!-- Model copies -->
    <rect x="30" y="20" width="180" height="140" rx="8" ry="8" fill="#FDE68A" stroke="#F59E0B" stroke-width="2"/>
    <text x="120" y="48" text-anchor="middle" font-size="13" fill="#92400E">预训练模型 (副本1)</text>
    <text x="120" y="66" text-anchor="middle" font-size="12" fill="#B45309">全部参数可训练</text>
    <rect x="50" y="78" width="140" height="22" rx="4" ry="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
    <text x="120" y="93" text-anchor="middle" font-size="11" fill="#92400E">330M params (BERT-L)</text>
    <!-- Task arrows -->
    <rect x="50" y="108" width="60" height="20" rx="4" ry="4" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
    <text x="80" y="122" text-anchor="middle" font-size="10" fill="#92400E">Task 1</text>
    <rect x="130" y="108" width="60" height="20" rx="4" ry="4" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
    <text x="160" y="122" text-anchor="middle" font-size="10" fill="#92400E">Task 2</text>
    <text x="120" y="148" text-anchor="middle" font-size="11" fill="#92400E">... 每个任务一份完整副本</text>
    <!-- Size indicator -->
    <rect x="30" y="190" width="180" height="60" rx="8" ry="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="120" y="212" text-anchor="middle" font-size="13" fill="#92400E">N 个任务 = N x 330M</text>
    <text x="120" y="232" text-anchor="middle" font-size="12" fill="#B45309">= 9x 参数 (GLUE)</text>
    <!-- Problems -->
    <rect x="10" y="270" width="220" height="70" rx="6" ry="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"/>
    <text x="120" y="290" text-anchor="middle" font-size="12" fill="#DC2626">每个任务存一份完整模型</text>
    <text x="120" y="308" text-anchor="middle" font-size="12" fill="#DC2626">存储成本随任务数线性增长</text>
    <text x="120" y="326" text-anchor="middle" font-size="12" fill="#DC2626">无法增量学习新任务</text>
  </g>

  <!-- Method 3: Adapter (ours) -->
  <g transform="translate(590, 60)">
    <text x="140" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#10B981">Adapter 微调 (本文)</text>
    <!-- Shared model -->
    <rect x="30" y="20" width="220" height="140" rx="8" ry="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
    <text x="140" y="45" text-anchor="middle" font-size="13" fill="#6B7280">预训练模型 (共享)</text>
    <text x="140" y="63" text-anchor="middle" font-size="12" fill="#9CA3AF">冻结, 所有任务共用</text>
    <!-- Adapter modules -->
    <rect x="50" y="78" width="75" height="30" rx="4" ry="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="87" y="97" text-anchor="middle" font-size="10" fill="#065F46">Adapter-T1</text>
    <rect x="135" y="78" width="75" height="30" rx="4" ry="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="172" y="97" text-anchor="middle" font-size="10" fill="#065F46">Adapter-T2</text>
    <rect x="50" y="115" width="160" height="25" rx="4" ry="4" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
    <text x="130" y="132" text-anchor="middle" font-size="10" fill="#065F46">+ LayerNorm + 分类头</text>
    <!-- Size -->
    <rect x="30" y="190" width="220" height="60" rx="8" ry="8" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
    <text x="140" y="212" text-anchor="middle" font-size="13" fill="#065F46">N 个任务 = 1x + N x 3.6%</text>
    <text x="140" y="232" text-anchor="middle" font-size="12" fill="#059669">= 1.3x 参数 (GLUE)</text>
    <!-- Advantages -->
    <rect x="10" y="270" width="260" height="70" rx="6" ry="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="140" y="290" text-anchor="middle" font-size="12" fill="#065F46">共享主体, 每任务仅加 3.6% 参数</text>
    <text x="140" y="308" text-anchor="middle" font-size="12" fill="#065F46">新任务即插即用, 不影响旧任务</text>
    <text x="140" y="326" text-anchor="middle" font-size="12" fill="#065F46">性能仅差 0.4% (vs Fine-tuning)</text>
  </g>

  <!-- Arrows definitions -->
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
  </defs>

  <!-- Bottom comparison bar -->
  <g transform="translate(0, 380)">
    <text x="150" y="20" text-anchor="middle" font-size="13" fill="#9CA3AF">参数效率: 低</text>
    <text x="450" y="20" text-anchor="middle" font-size="13" fill="#F59E0B">参数效率: 低</text>
    <text x="730" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#10B981">参数效率: 极高</text>
  </g>
</svg>