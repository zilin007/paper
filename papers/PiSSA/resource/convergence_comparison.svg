<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="sans-serif">
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">PiSSA vs LoRA: 收敛速度对比</text>

  <!-- X轴: 训练步数 -->
  <line x1="80" y1="320" x2="650" y2="320" stroke="#333" stroke-width="2"/>
  <text x="365" y="350" text-anchor="middle" font-size="13" fill="#555">训练步数 (steps)</text>

  <!-- Y轴: 损失 -->
  <line x1="80" y1="50" x2="80" y2="320" stroke="#333" stroke-width="2"/>
  <text x="30" y="185" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90, 30, 185)">训练损失</text>

  <!-- Y轴刻度 -->
  <text x="70" y="323" text-anchor="end" font-size="11" fill="#999">0.0</text>
  <text x="70" y="268" text-anchor="end" font-size="11" fill="#999">0.2</text>
  <text x="70" y="213" text-anchor="end" font-size="11" fill="#999">0.4</text>
  <text x="70" y="158" text-anchor="end" font-size="11" fill="#999">0.6</text>
  <text x="70" y="103" text-anchor="end" font-size="11" fill="#999">0.8</text>

  <!-- X轴刻度 -->
  <text x="120" y="340" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="230" y="340" text-anchor="middle" font-size="11" fill="#999">200</text>
  <text x="340" y="340" text-anchor="middle" font-size="11" fill="#999">400</text>
  <text x="450" y="340" text-anchor="middle" font-size="11" fill="#999">600</text>
  <text x="560" y="340" text-anchor="middle" font-size="11" fill="#999">800</text>

  <!-- 网格线 -->
  <line x1="80" y1="268" x2="650" y2="268" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="213" x2="650" y2="213" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="158" x2="650" y2="158" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="103" x2="650" y2="103" stroke="#eee" stroke-width="1"/>

  <!-- LoRA 曲线 (慢速下降) -->
  <polyline points="120,103 175,130 230,165 285,195 340,220 395,240 450,255 505,265 560,272" fill="none" stroke="#e74c3c" stroke-width="3"/>

  <!-- LoRA 数据点 -->
  <circle cx="120" cy="103" r="5" fill="#e74c3c"/>
  <text x="120" y="90" text-anchor="middle" font-size="10" fill="#e74c3c">0.888</text>

  <circle cx="230" cy="165" r="5" fill="#e74c3c"/>
  <text x="230" y="152" text-anchor="middle" font-size="10" fill="#e74c3c">0.40</text>

  <circle cx="340" cy="220" r="5" fill="#e74c3c"/>
  <text x="340" y="207" text-anchor="middle" font-size="10" fill="#e74c3c">0.25</text>

  <circle cx="450" cy="255" r="5" fill="#e74c3c"/>
  <text x="450" y="242" text-anchor="middle" font-size="10" fill="#e74c3c">0.18</text>

  <circle cx="560" cy="272" r="5" fill="#e74c3c"/>
  <text x="560" y="259" text-anchor="middle" font-size="10" fill="#e74c3c">0.15</text>

  <!-- PiSSA 曲线 (快速下降) -->
  <polyline points="120,103 175,180 230,230 285,260 340,275 395,283 450,288 505,291 560,293" fill="none" stroke="#27ae60" stroke-width="3"/>

  <!-- PiSSA 数据点 -->
  <circle cx="120" cy="103" r="5" fill="#27ae60"/>
  <text x="100" y="98" text-anchor="end" font-size="10" fill="#27ae60">0.888</text>

  <circle cx="230" cy="230" r="5" fill="#27ae60"/>
  <text x="210" y="225" text-anchor="end" font-size="10" fill="#27ae60">0.24</text>

  <circle cx="340" cy="275" r="5" fill="#27ae60"/>
  <text x="320" y="270" text-anchor="end" font-size="10" fill="#27ae60">0.16</text>

  <circle cx="450" cy="288" r="5" fill="#27ae60"/>
  <text x="430" y="283" text-anchor="end" font-size="10" fill="#27ae60">0.13</text>

  <circle cx="560" cy="293" r="5" fill="#27ae60"/>
  <text x="540" y="288" text-anchor="end" font-size="10" fill="#27ae60">0.12</text>

  <!-- 图例 -->
  <line x1="480" y1="60" x2="510" y2="60" stroke="#e74c3c" stroke-width="3"/>
  <text x="515" y="64" font-size="11" fill="#555">LoRA (收敛慢)</text>

  <line x1="480" y1="85" x2="510" y2="85" stroke="#27ae60" stroke-width="3"/>
  <text x="515" y="89" font-size="11" fill="#555">PiSSA (收敛快)</text>

  <!-- 关键观察 -->
  <rect x="480" y="105" width="190" height="70" rx="8" fill="#f8f9f9" stroke="#bdc3c7" stroke-width="1"/>
  <text x="575" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">关键发现</text>
  <text x="575" y="145" text-anchor="middle" font-size="10" fill="#27ae60">PiSSA 在 200 步时损失 0.24</text>
  <text x="575" y="162" text-anchor="middle" font-size="10" fill="#e74c3c">LoRA 在 200 步时损失 0.40</text>
</svg>
