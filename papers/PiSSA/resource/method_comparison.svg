<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 520" font-family="sans-serif">
  <rect width="750" height="520" fill="#fafafa"/>
  <text x="375" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">LoRA vs PiSSA：初始化方式的根本差异</text>

  <!-- LoRA -->
  <rect x="20" y="55" width="340" height="440" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <text x="190" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#e74c3c">LoRA：噪声与零初始化</text>

  <!-- LoRA 公式 -->
  <rect x="40" y="100" width="300" height="50" rx="6" fill="#3498db"/>
  <text x="190" y="120" text-anchor="middle" font-size="12" fill="white">Y = X(W + AB)</text>
  <text x="190" y="138" text-anchor="middle" font-size="11" fill="#d4e6f1">W 冻结，A 和 B 可训练</text>

  <!-- 初始化 -->
  <rect x="40" y="170" width="300" height="80" rx="8" fill="#fee"/>
  <text x="190" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">初始化方式:</text>
  <text x="190" y="218" text-anchor="middle" font-size="11" fill="#333">A ~ N(0, σ²) — 高斯噪声</text>
  <text x="190" y="238" text-anchor="middle" font-size="11" fill="#333">B = 0 — 零矩阵</text>

  <!-- 梯度问题 -->
  <rect x="40" y="270" width="300" height="80" rx="8" fill="#fdebd0"/>
  <text x="190" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#d68910">初始梯度问题:</text>
  <text x="190" y="318" text-anchor="middle" font-size="11" fill="#333">∂L/∂A = X^T(∂L/∂Y)B^T → 0 (因为 B=0)</text>
  <text x="190" y="338" text-anchor="middle" font-size="11" fill="#333">∂L/∂B = A^T X^T(∂L/∂Y) → 随机方向</text>

  <!-- 后果 -->
  <rect x="40" y="370" width="300" height="60" rx="8" fill="#fee"/>
  <text x="190" y="395" text-anchor="middle" font-size="11" fill="#c0392b">✗ 收敛慢，浪费训练时间</text>
  <text x="190" y="415" text-anchor="middle" font-size="11" fill="#c0392b">✗ 可能陷入次优局部最小值</text>

  <!-- PiSSA -->
  <rect x="390" y="55" width="340" height="440" rx="10" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <text x="560" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#27ae60">PiSSA：主成分初始化</text>

  <!-- PiSSA 公式 -->
  <rect x="410" y="100" width="300" height="50" rx="6" fill="#27ae60"/>
  <text x="560" y="120" text-anchor="middle" font-size="12" fill="white">Y = X(W^res + AB)</text>
  <text x="560" y="138" text-anchor="middle" font-size="11" fill="#d5f5e3">W^res 冻结，A 和 B 可训练</text>

  <!-- 初始化 -->
  <rect x="410" y="170" width="300" height="80" rx="8" fill="#eafaf1"/>
  <text x="560" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e8449">初始化方式 (SVD):</text>
  <text x="560" y="218" text-anchor="middle" font-size="11" fill="#333">A = U[:,:r] · S[:r,:r]^(1/2) — 主奇异向量</text>
  <text x="560" y="238" text-anchor="middle" font-size="11" fill="#333">B = S[:r,:r]^(1/2) · V[:,:r]^T — 主奇异值</text>

  <!-- 梯度优势 -->
  <rect x="410" y="270" width="300" height="80" rx="8" fill="#d5f5e3"/>
  <text x="560" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e8449">初始梯度优势:</text>
  <text x="560" y="318" text-anchor="middle" font-size="11" fill="#333">∂L/∂A → 主方向 (非零)</text>
  <text x="560" y="338" text-anchor="middle" font-size="11" fill="#333">∂L/∂B → 主方向 (非随机)</text>

  <!-- 后果 -->
  <rect x="410" y="370" width="300" height="60" rx="8" fill="#eafaf1"/>
  <text x="560" y="395" text-anchor="middle" font-size="11" fill="#1e8449">✓ 收敛快，训练效率高</text>
  <text x="560" y="415" text-anchor="middle" font-size="11" fill="#1e8449">✓ 性能优于 LoRA</text>

  <!-- 中间箭头 -->
  <line x1="360" y1="275" x2="390" y2="275" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="375" y="265" text-anchor="middle" font-size="10" fill="#27ae60">改进</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#27ae60"/>
    </marker>
  </defs>
</svg>
