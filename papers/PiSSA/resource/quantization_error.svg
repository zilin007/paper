<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="sans-serif">
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">QPiSSA 量化误差减少原理</text>

  <!-- QLoRA 量化 -->
  <rect x="20" y="55" width="320" height="150" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <text x="180" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">QLoRA 量化误差</text>

  <rect x="40" y="95" width="280" height="40" rx="6" fill="#3498db"/>
  <text x="180" y="120" text-anchor="middle" font-size="12" fill="white">量化原始权重: nf4(W)</text>

  <rect x="40" y="145" width="280" height="40" rx="6" fill="#e74c3c"/>
  <text x="180" y="170" text-anchor="middle" font-size="12" fill="white">误差 = ‖W - nf4(W)‖_* (大)</text>

  <text x="180" y="200" text-anchor="middle" font-size="11" fill="#666">W 的分布宽，奇异值范围大</text>

  <!-- QPiSSA 量化 -->
  <rect x="360" y="55" width="320" height="150" rx="10" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <text x="520" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">QPiSSA 量化误差</text>

  <rect x="380" y="95" width="280" height="40" rx="6" fill="#27ae60"/>
  <text x="520" y="120" text-anchor="middle" font-size="12" fill="white">量化残差权重: nf4(W^res)</text>

  <rect x="380" y="145" width="280" height="40" rx="6" fill="#2ecc71"/>
  <text x="520" y="170" text-anchor="middle" font-size="12" fill="white">误差 = ‖W^res - nf4(W^res)‖_* (小)</text>

  <text x="520" y="200" text-anchor="middle" font-size="11" fill="#666">W^res 分布窄，更接近高斯分布</text>

  <!-- 箭头 -->
  <line x1="340" y1="130" x2="360" y2="130" stroke="#27ae60" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="350" y="120" text-anchor="middle" font-size="10" fill="#27ae60">改进</text>

  <!-- 误差对比 -->
  <rect x="20" y="230" width="660" height="150" rx="10" fill="#f8f9f9" stroke="#bdc3c7" stroke-width="1"/>
  <text x="350" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#2c3e50">量化误差对比 (LLaMA-3-8B, rank=128)</text>

  <!-- QLoRA 误差 -->
  <rect x="40" y="275" width="280" height="40" rx="6" fill="#fee"/>
  <text x="180" y="300" text-anchor="middle" font-size="12" fill="#c0392b">QLoRA 平均误差: 0% (基准)</text>

  <!-- LoftQ 误差 -->
  <rect x="40" y="325" width="280" height="40" rx="6" fill="#fdebd0"/>
  <text x="180" y="350" text-anchor="middle" font-size="12" fill="#d68910">LoftQ 平均误差减少: 18.1%</text>

  <!-- PiSSA 误差 -->
  <rect x="380" y="275" width="280" height="40" rx="6" fill="#eafaf1"/>
  <text x="520" y="300" text-anchor="middle" font-size="12" fill="#1e8449">PiSSA 平均误差减少: 22.9%</text>

  <!-- PiSSA rank=128 -->
  <rect x="380" y="325" width="280" height="40" rx="6" fill="#d5f5e3"/>
  <text x="520" y="350" text-anchor="middle" font-size="12" fill="#1e8449">PiSSA (rank=128) 误差减少: 20.3%</text>

  <!-- 底部说明 -->
  <rect x="20" y="365" width="660" y2="25" rx="6" fill="#eaf2f8"/>
  <text x="350" y="380" text-anchor="middle" font-size="11" fill="#2980b9">关键: W^res 移除了大奇异值分量，分布更窄、更接近高斯，NF4 量化更适合</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#27ae60"/>
    </marker>
  </defs>
</svg>
