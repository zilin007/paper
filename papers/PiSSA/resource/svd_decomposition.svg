<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" font-family="sans-serif">
  <rect width="700" height="450" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">SVD 分解原理：奇异值与主成分选择</text>

  <!-- 奇异值分布图 -->
  <text x="100" y="70" font-size="12" fill="#555">矩阵 W 的奇异值通常呈快速衰减分布:</text>

  <!-- 奇异值柱状图 -->
  <rect x="80" y="100" width="40" height="200" rx="2" fill="#3498db"/>
  <rect x="130" y="120" width="40" height="180" rx="2" fill="#2980b9"/>
  <rect x="180" y="150" width="40" height="150" rx="2" fill="#2471a3"/>
  <rect x="230" y="180" width="40" height="120" rx="2" fill="#1f618d"/>
  <rect x="280" y="210" width="40" height="90" rx="2" fill="#1a5276"/>
  <rect x="330" y="235" width="40" height="65" rx="2" fill="#154360"/>
  <rect x="380" y="255" width="40" height="45" rx="2" fill="#12384a"/>
  <rect x="430" y="270" width="40" height="30" rx="2" fill="#0e2f3d"/>
  <rect x="480" y="280" width="40" height="20" rx="2" fill="#0b2630"/>
  <rect x="530" y="290" width="40" height="10" rx="2" fill="#081d24"/>

  <!-- 基线 -->
  <line x1="70" y1="300" x2="580" y2="300" stroke="#333" stroke-width="2"/>

  <!-- 标注 -->
  <text x="100" y="320" text-anchor="middle" font-size="10" fill="#333">σ₁</text>
  <text x="150" y="320" text-anchor="middle" font-size="10" fill="#333">σ₂</text>
  <text x="200" y="320" text-anchor="middle" font-size="10" fill="#333">σ₃</text>
  <text x="250" y="320" text-anchor="middle" font-size="10" fill="#333">σ₄</text>
  <text x="300" y="320" text-anchor="middle" font-size="10" fill="#333">σ₅</text>
  <text x="350" y="320" text-anchor="middle" font-size="10" fill="#333">σ₆</text>
  <text x="400" y="320" text-anchor="middle" font-size="10" fill="#333">σ₇</text>
  <text x="450" y="320" text-anchor="middle" font-size="10" fill="#333">σ₈</text>
  <text x="500" y="320" text-anchor="middle" font-size="10" fill="#333">...</text>
  <text x="550" y="320" text-anchor="middle" font-size="10" fill="#333">σ_n</text>

  <!-- 分割线 -->
  <line x1="270" y1="80" x2="270" y2="310" stroke="#e74c3c" stroke-width="2" stroke-dasharray="6"/>
  <text x="270" y="75" text-anchor="middle" font-size="10" fill="#e74c3c" font-weight="bold">r = 5</text>

  <!-- 主成分标注 -->
  <rect x="70" y="340" width="200" height="40" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1"/>
  <text x="170" y="365" text-anchor="middle" font-size="11" fill="#1e8449">主成分 (σ₁~σ₅): 包含大部分信息</text>

  <!-- 残差标注 -->
  <rect x="290" y="340" width="260" height="40" rx="6" fill="#f8f0ff" stroke="#95a5a6" stroke-width="1"/>
  <text x="420" y="365" text-anchor="middle" font-size="11" fill="#7f8c8d">残差 (σ₆~σ_n): 信息量较小</text>

  <!-- 关键说明 -->
  <rect x="30" y="395" width="640" height="45" rx="8" fill="#f8f9f9" stroke="#bdc3c7" stroke-width="1"/>
  <text x="350" y="415" text-anchor="middle" font-size="11" fill="#2c3e50">PiSSA 选择前 r 个最大奇异值对应的奇异向量初始化适配器</text>
  <text x="350" y="433" text-anchor="middle" font-size="11" fill="#555">这些方向是原始权重矩阵中"最重要"的变换方向，直接优化它们可以更快收敛</text>
</svg>
