<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" font-family="sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6B7280"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10B981"/>
    </marker>
  </defs>

  <text x="410" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1F2937">Prefix-Tuning 在 Transformer 各层的工作机制</text>

  <!-- Left: Embedding-only (less expressive) -->
  <g transform="translate(30, 55)">
    <rect x="0" y="0" width="230" height="400" rx="10" ry="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="115" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#B45309">Embedding-only (弱)</text>
    <text x="115" y="45" text-anchor="middle" font-size="11" fill="#92400E">只优化嵌入层</text>

    <!-- Layers -->
    <rect x="20" y="280" width="190" height="35" rx="6" ry="6" fill="#10B981" fill-opacity="0.4" stroke="#10B981"/>
    <text x="115" y="302" text-anchor="middle" font-size="11" fill="#065F46">Embedding 层 (可训练前缀嵌入)</text>

    <rect x="20" y="220" width="190" height="35" rx="6" ry="6" fill="#9CA3AF" fill-opacity="0.3" stroke="#9CA3AF"/>
    <text x="115" y="242" text-anchor="middle" font-size="11" fill="#4B5563">Transformer Layer 1 (冻结)</text>

    <rect x="20" y="160" width="190" height="35" rx="6" ry="6" fill="#9CA3AF" fill-opacity="0.3" stroke="#9CA3AF"/>
    <text x="115" y="182" text-anchor="middle" font-size="11" fill="#4B5563">Transformer Layer 2 (冻结)</text>

    <rect x="20" y="100" width="190" height="35" rx="6" ry="6" fill="#9CA3AF" fill-opacity="0.3" stroke="#9CA3AF"/>
    <text x="115" y="122" text-anchor="middle" font-size="11" fill="#4B5563">... Layer N (冻结)</text>

    <!-- Arrows -->
    <line x1="115" y1="280" x2="115" y2="260" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="115" y1="220" x2="115" y2="200" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="115" y1="160" x2="115" y2="140" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Note -->
    <text x="115" y="345" text-anchor="middle" font-size="11" fill="#B45309">前缀影响逐层衰减</text>
    <text x="115" y="365" text-anchor="middle" font-size="11" fill="#B45309">表达力 &lt; 离散提示词</text>
    <text x="115" y="385" text-anchor="middle" font-size="10" fill="#92400E">BLEU: 62.2 (E2E)</text>
  </g>

  <!-- Middle: Prefix-tuning (optimal) -->
  <g transform="translate(295, 55)">
    <rect x="0" y="0" width="230" height="400" rx="10" ry="10" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="115" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">Prefix-tuning (本文)</text>
    <text x="115" y="45" text-anchor="middle" font-size="11" fill="#065F46">优化所有层的前缀激活</text>

    <!-- Layers with prefix -->
    <rect x="20" y="280" width="140" height="35" rx="6" ry="6" fill="#9CA3AF" fill-opacity="0.3" stroke="#9CA3AF"/>
    <text x="90" y="302" text-anchor="middle" font-size="10" fill="#4B5563">Embedding (冻结)</text>
    <rect x="165" y="280" width="45" height="35" rx="6" ry="6" fill="#10B981" stroke="#059669" stroke-width="1.5"/>
    <text x="187" y="300" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">P_0</text>

    <rect x="20" y="220" width="140" height="35" rx="6" ry="6" fill="#9CA3AF" fill-opacity="0.3" stroke="#9CA3AF"/>
    <text x="90" y="242" text-anchor="middle" font-size="10" fill="#4B5563">Layer 1 (冻结)</text>
    <rect x="165" y="220" width="45" height="35" rx="6" ry="6" fill="#10B981" stroke="#059669" stroke-width="1.5"/>
    <text x="187" y="240" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">P_1</text>

    <rect x="20" y="160" width="140" height="35" rx="6" ry="6" fill="#9CA3AF" fill-opacity="0.3" stroke="#9CA3AF"/>
    <text x="90" y="182" text-anchor="middle" font-size="10" fill="#4B5563">Layer 2 (冻结)</text>
    <rect x="165" y="160" width="45" height="35" rx="6" ry="6" fill="#10B981" stroke="#059669" stroke-width="1.5"/>
    <text x="187" y="180" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">P_2</text>

    <rect x="20" y="100" width="140" height="35" rx="6" ry="6" fill="#9CA3AF" fill-opacity="0.3" stroke="#9CA3AF"/>
    <text x="90" y="122" text-anchor="middle" font-size="10" fill="#4B5563">... Layer N (冻结)</text>
    <rect x="165" y="100" width="45" height="35" rx="6" ry="6" fill="#10B981" stroke="#059669" stroke-width="1.5"/>
    <text x="187" y="120" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">P_N</text>

    <!-- Arrows -->
    <line x1="90" y1="280" x2="90" y2="260" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="90" y1="220" x2="90" y2="200" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="90" y1="160" x2="90" y2="140" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Green arrows for prefix influence -->
    <line x1="187" y1="280" x2="187" y2="260" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <line x1="187" y1="220" x2="187" y2="200" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <line x1="187" y1="160" x2="187" y2="140" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

    <!-- Horizontal influence -->
    <line x1="165" y1="237" x2="160" y2="237" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <line x1="165" y1="177" x2="160" y2="177" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
    <line x1="165" y1="117" x2="160" y2="117" stroke="#10B981" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

    <!-- Note -->
    <text x="115" y="345" text-anchor="middle" font-size="11" fill="#059669">每层都有独立的前缀激活</text>
    <text x="115" y="365" text-anchor="middle" font-size="11" fill="#059669">通过注意力机制影响后续 token</text>
    <text x="115" y="385" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">BLEU: 69.7 (E2E)</text>
  </g>

  <!-- Right: Fine-tuning (all params) -->
  <g transform="translate(560, 55)">
    <rect x="0" y="0" width="230" height="400" rx="10" ry="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5,3"/>
    <text x="115" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#DC2626">Fine-tuning (全量)</text>
    <text x="115" y="45" text-anchor="middle" font-size="11" fill="#991B1B">更新所有参数</text>

    <!-- Layers all red -->
    <rect x="20" y="280" width="190" height="35" rx="6" ry="6" fill="#EF4444" fill-opacity="0.3" stroke="#EF4444"/>
    <text x="115" y="302" text-anchor="middle" font-size="11" fill="#991B1B">Embedding (可训练)</text>

    <rect x="20" y="220" width="190" height="35" rx="6" ry="6" fill="#EF4444" fill-opacity="0.3" stroke="#EF4444"/>
    <text x="115" y="242" text-anchor="middle" font-size="11" fill="#991B1B">Layer 1 (可训练)</text>

    <rect x="20" y="160" width="190" height="35" rx="6" ry="6" fill="#EF4444" fill-opacity="0.3" stroke="#EF4444"/>
    <text x="115" y="182" text-anchor="middle" font-size="11" fill="#991B1B">Layer 2 (可训练)</text>

    <rect x="20" y="100" width="190" height="35" rx="6" ry="6" fill="#EF4444" fill-opacity="0.3" stroke="#EF4444"/>
    <text x="115" y="122" text-anchor="middle" font-size="11" fill="#991B1B">... Layer N (可训练)</text>

    <!-- Arrows -->
    <line x1="115" y1="280" x2="115" y2="260" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="115" y1="220" x2="115" y2="200" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="115" y1="160" x2="115" y2="140" stroke="#EF4444" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Note -->
    <text x="115" y="345" text-anchor="middle" font-size="11" fill="#DC2626">345M 参数全部更新</text>
    <text x="115" y="365" text-anchor="middle" font-size="11" fill="#DC2626">最大表达力,但存储代价高</text>
    <text x="115" y="385" text-anchor="middle" font-size="10" fill="#991B1B">BLEU: 68.2 (E2E)</text>
  </g>

  <!-- Expressiveness scale -->
  <line x1="80" y1="480" x2="740" y2="480" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="497" text-anchor="middle" font-size="13" fill="#4B5563">表达力递增 / 可训练参数递增</text>
  <circle cx="145" cy="480" r="5" fill="#F59E0B"/>
  <text x="145" y="470" text-anchor="middle" font-size="10" fill="#B45309">Embedding-only</text>
  <circle cx="410" cy="480" r="5" fill="#10B981"/>
  <text x="410" y="470" text-anchor="middle" font-size="10" fill="#059669" font-weight="bold">Prefix-tuning</text>
  <circle cx="675" cy="480" r="5" fill="#EF4444"/>
  <text x="675" y="470" text-anchor="middle" font-size="10" fill="#DC2626">Fine-tuning</text>
</svg>