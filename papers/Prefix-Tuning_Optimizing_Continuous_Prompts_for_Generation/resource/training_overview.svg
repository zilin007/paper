<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 360" font-family="sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3B82F6"/>
    </marker>
    <marker id="arrR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EF4444"/>
    </marker>
    <marker id="arrG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10B981"/>
    </marker>
  </defs>

  <text x="425" y="25" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Prefix-Tuning 训练迭代全景图</text>

  <!-- Round 1 -->
  <g transform="translate(15, 50)">
    <rect x="0" y="0" width="245" height="280" rx="10" ry="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="122" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E40AF">第 1 轮</text>

    <!-- Forward -->
    <rect x="15" y="40" width="215" height="45" rx="6" ry="6" fill="#DBEAFE" stroke="#3B82F6"/>
    <text x="122" y="58" text-anchor="middle" font-size="11" fill="#1E40AF">前向传播</text>
    <text x="122" y="74" text-anchor="middle" font-size="10" fill="#3B82F6">h = LM(x, prefix) = [0.6, 1.4, 1.1, 0.2]</text>

    <!-- Loss -->
    <rect x="15" y="95" width="215" height="35" rx="6" ry="6" fill="#FEF2F2" stroke="#EF4444"/>
    <text x="122" y="117" text-anchor="middle" font-size="11" fill="#DC2626">Loss = 0.185</text>

    <!-- Backward -->
    <rect x="15" y="140" width="215" height="35" rx="6" ry="6" fill="#FEF2F2" stroke="#EF4444" stroke-dasharray="4,2"/>
    <text x="122" y="162" text-anchor="middle" font-size="11" fill="#DC2626">反向传播 -> dL/dP_theta</text>

    <!-- Update -->
    <rect x="15" y="185" width="215" height="55" rx="6" ry="6" fill="#ECFDF5" stroke="#10B981"/>
    <text x="122" y="203" text-anchor="middle" font-size="11" fill="#059669">更新前缀参数</text>
    <text x="122" y="220" text-anchor="middle" font-size="10" fill="#065F46">P_new = P_old - lr * grad</text>
    <text x="122" y="234" text-anchor="middle" font-size="9" fill="#6B7280">(模型参数保持冻结不变)</text>

    <text x="122" y="265" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">前缀从零开始学习</text>
  </g>

  <!-- Arrow -->
  <line x1="265" y1="190" x2="295" y2="190" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="280" y="180" text-anchor="middle" font-size="20" fill="#6B7280">></text>

  <!-- Round 2 -->
  <g transform="translate(300, 50)">
    <rect x="0" y="0" width="245" height="280" rx="10" ry="10" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
    <text x="122" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">第 2 轮</text>

    <!-- Forward -->
    <rect x="15" y="40" width="215" height="45" rx="6" ry="6" fill="#DBEAFE" stroke="#3B82F6"/>
    <text x="122" y="58" text-anchor="middle" font-size="11" fill="#1E40AF">前向传播 (用更新后的前缀)</text>
    <text x="122" y="74" text-anchor="middle" font-size="10" fill="#3B82F6">h = [0.587, 1.35, 1.15, 0.175]</text>

    <!-- Loss -->
    <rect x="15" y="95" width="215" height="35" rx="6" ry="6" fill="#FEF2F2" stroke="#EF4444"/>
    <text x="122" y="117" text-anchor="middle" font-size="11" fill="#059669">Loss = 0.142 (下降 23%!)</text>

    <!-- Backward -->
    <rect x="15" y="140" width="215" height="35" rx="6" ry="6" fill="#FEF2F2" stroke="#EF4444" stroke-dasharray="4,2"/>
    <text x="122" y="162" text-anchor="middle" font-size="11" fill="#DC2626">反向传播 -> 更新前缀</text>

    <!-- Update -->
    <rect x="15" y="185" width="215" height="55" rx="6" ry="6" fill="#ECFDF5" stroke="#10B981"/>
    <text x="122" y="203" text-anchor="middle" font-size="11" fill="#059669">前缀继续优化</text>
    <text x="122" y="220" text-anchor="middle" font-size="10" fill="#065F46">输出更接近目标</text>
    <text x="122" y="234" text-anchor="middle" font-size="9" fill="#065F46">4 个分量全部朝目标方向移动</text>

    <text x="122" y="265" text-anchor="middle" font-size="11" fill="#059669" font-style="italic">前缀开始发挥引导作用</text>
  </g>

  <!-- Arrow -->
  <line x1="550" y1="190" x2="580" y2="190" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="565" y="180" text-anchor="middle" font-size="20" fill="#6B7280">></text>

  <!-- Round N -->
  <g transform="translate(585, 50)">
    <rect x="0" y="0" width="245" height="280" rx="10" ry="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="122" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#059669">收敛 (第 N 轮)</text>

    <rect x="15" y="45" width="215" height="80" rx="6" ry="6" fill="#D1FAE5" stroke="#10B981"/>
    <text x="122" y="68" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">前缀已学到任务知识</text>
    <text x="122" y="88" text-anchor="middle" font-size="11" fill="#065F46">h 接近 y_target</text>
    <text x="122" y="108" text-anchor="middle" font-size="11" fill="#065F46">Loss 趋近最小值</text>

    <rect x="15" y="140" width="215" height="60" rx="6" ry="6" fill="#F0FDF4" stroke="#10B981"/>
    <text x="122" y="162" text-anchor="middle" font-size="11" fill="#059669">部署时只需保存前缀</text>
    <text x="122" y="180" text-anchor="middle" font-size="10" fill="#065F46">250K params vs 345M 全模型</text>

    <rect x="15" y="215" width="215" height="50" rx="6" ry="6" fill="#ECFDF5" stroke="#10B981"/>
    <text x="122" y="235" text-anchor="middle" font-size="11" fill="#059669">切换任务 = 换前缀</text>
    <text x="122" y="252" text-anchor="middle" font-size="10" fill="#065F46">Transformer 本体完全共享</text>
  </g>
</svg>