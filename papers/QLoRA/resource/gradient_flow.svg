<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" font-family="sans-serif">
  <rect width="700" height="550" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">QLoRA 训练流程与梯度传播</text>

  <!-- 前向传播 -->
  <rect x="200" y="55" width="300" height="40" rx="8" fill="#3498db"/>
  <text x="350" y="80" text-anchor="middle" font-size="13" fill="white">前向传播: 输入 X → 4-bit 权重 → 输出 Y</text>

  <line x1="350" y1="95" x2="350" y2="120" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 损失计算 -->
  <rect x="200" y="120" width="300" height="40" rx="8" fill="#e74c3c"/>
  <text x="350" y="145" text-anchor="middle" font-size="13" fill="white">计算损失 L (交叉熵)</text>

  <line x1="350" y1="160" x2="350" y2="185" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 反向传播 -->
  <rect x="200" y="185" width="300" height="40" rx="8" fill="#f39c12"/>
  <text x="350" y="210" text-anchor="middle" font-size="13" fill="white">反向传播: 计算梯度 ∂L/∂(LoRA 参数)</text>

  <line x1="350" y1="225" x2="350" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 关键: 梯度流向 -->
  <rect x="30" y="260" width="310" height="200" rx="10" fill="#fff" stroke="#27ae60" stroke-width="2"/>
  <text x="185" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">梯度流向详解</text>

  <!-- 4-bit 权重 -->
  <rect x="50" y="300" width="130" height="40" rx="6" fill="#8e44ad"/>
  <text x="115" y="325" text-anchor="middle" font-size="11" fill="white">W^(NF4) 4-bit 权重</text>

  <!-- LoRA 参数 -->
  <rect x="200" y="300" width="120" height="40" rx="6" fill="#27ae60"/>
  <text x="260" y="325" text-anchor="middle" font-size="11" fill="white">L₁, L₂ LoRA 参数</text>

  <!-- 梯度标注 -->
  <rect x="50" y="355" width="130" height="40" rx="6" fill="#d7bde2"/>
  <text x="115" y="375" text-anchor="middle" font-size="10" fill="#6c3483">∂L/∂W: 计算但不更新</text>
  <text x="115" y="390" text-anchor="middle" font-size="10" fill="#6c3483">(仅用于传播到 LoRA)</text>

  <rect x="200" y="355" width="120" height="40" rx="6" fill="#abebc6"/>
  <text x="260" y="375" text-anchor="middle" font-size="10" fill="#1e8449">∂L/∂L₁, ∂L/∂L₂: 计算</text>
  <text x="260" y="390" text-anchor="middle" font-size="10" fill="#1e8449">且更新 (可训练)</text>

  <!-- 箭头 -->
  <line x1="180" y1="320" x2="200" y2="320" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="115" y1="340" x2="115" y2="355" stroke="#8e44ad" stroke-width="1.5"/>
  <line x1="260" y1="340" x2="260" y2="355" stroke="#27ae60" stroke-width="1.5"/>

  <!-- 优化器更新 -->
  <rect x="370" y="260" width="300" height="200" rx="10" fill="#fff" stroke="#e74c3c" stroke-width="2"/>
  <text x="520" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#e74c3c">参数更新 (Adam 优化器)</text>

  <rect x="390" y="300" width="260" height="35" rx="6" fill="#fadbd8"/>
  <text x="520" y="322" text-anchor="middle" font-size="11" fill="#c0392b">L₁_new = L₁ - η · ∂L/∂L₁</text>

  <rect x="390" y="345" width="260" height="35" rx="6" fill="#fadbd8"/>
  <text x="520" y="367" text-anchor="middle" font-size="11" fill="#c0392b">L₂_new = L₂ - η · ∂L/∂L₂</text>

  <rect x="390" y="390" width="260" height="35" rx="6" fill="#d5f5e3"/>
  <text x="520" y="412" text-anchor="middle" font-size="11" fill="#1e8449">W^(NF4) 保持不变 (冻结)</text>

  <rect x="390" y="435" width="260" height="20" rx="6" fill="#fef9e7"/>
  <text x="520" y="450" text-anchor="middle" font-size="10" fill="#d68910">分页优化器: GPU OOM 时自动转移到 CPU</text>

  <!-- 底部总结 -->
  <rect x="30" y="480" width="640" height="55" rx="8" fill="#f8f9f9" stroke="#bdc3c7" stroke-width="1"/>
  <text x="350" y="500" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">关键理解: 梯度穿过 4-bit 权重传播到 LoRA 适配器, 但只有 LoRA 参数被更新</text>
  <text x="350" y="520" text-anchor="middle" font-size="11" fill="#555">4-bit 权重在前向时反量化为 BF16 参与计算, 反向时仅作为梯度传播的"通道", 本身不更新</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
