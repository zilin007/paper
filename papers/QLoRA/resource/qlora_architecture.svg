<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" font-family="sans-serif">
  <rect width="700" height="480" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">QLoRA 核心架构：4-bit 量化 + LoRA 适配器</text>

  <!-- 输入 -->
  <rect x="250" y="55" width="200" height="45" rx="8" fill="#3498db"/>
  <text x="350" y="83" text-anchor="middle" font-size="13" fill="white">输入 X (batch × hidden)</text>

  <!-- 箭头 -->
  <line x1="350" y1="100" x2="350" y2="130" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 分支：两条路径 -->
  <!-- 左路径：4-bit 量化权重 -->
  <rect x="40" y="140" width="280" height="160" rx="10" fill="#f8f0ff" stroke="#8e44ad" stroke-width="2"/>
  <text x="180" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#8e44ad">路径1: 冻结的 4-bit 基座权重</text>

  <rect x="60" y="180" width="240" height="35" rx="6" fill="#8e44ad"/>
  <text x="180" y="202" text-anchor="middle" font-size="12" fill="white">W^(NF4): 4-bit NormalFloat 量化权重</text>

  <rect x="60" y="225" width="240" height="35" rx="6" fill="#9b59b6"/>
  <text x="180" y="247" text-anchor="middle" font-size="12" fill="white">doubleDequant → W^(BF16) (反量化)</text>

  <rect x="60" y="270" width="240" height="25" rx="6" fill="#d7bde2"/>
  <text x="180" y="287" text-anchor="middle" font-size="11" fill="#6c3483">梯度不更新 (冻结)</text>

  <!-- 右路径：LoRA 适配器 -->
  <rect x="380" y="140" width="280" height="160" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="520" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">路径2: 可训练的 LoRA 适配器</text>

  <rect x="400" y="180" width="240" height="35" rx="6" fill="#27ae60"/>
  <text x="520" y="202" text-anchor="middle" font-size="12" fill="white">L₁ ∈ R^(h×r), L₂ ∈ R^(r×o)</text>

  <rect x="400" y="225" width="240" height="35" rx="6" fill="#2ecc71"/>
  <text x="520" y="247" text-anchor="middle" font-size="12" fill="white">s · X · L₁ · L₂ (低秩变换)</text>

  <rect x="400" y="270" width="240" height="25" rx="6" fill="#abebc6"/>
  <text x="520" y="287" text-anchor="middle" font-size="11" fill="#1e8449">梯度更新 (可训练)</text>

  <!-- 箭头到输出 -->
  <line x1="180" y1="300" x2="180" y2="340" stroke="#8e44ad" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="300" x2="520" y2="340" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 合并 -->
  <rect x="250" y="340" width="200" height="45" rx="8" fill="#f39c12"/>
  <text x="350" y="360" text-anchor="middle" font-size="12" fill="white">Y = X·W^(BF16) + s·X·L₁·L₂</text>
  <text x="350" y="377" text-anchor="middle" font-size="11" fill="#fef9e7">(相加得到输出)</text>

  <!-- 箭头到输出 -->
  <line x1="350" y1="385" x2="350" y2="415" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 输出 -->
  <rect x="250" y="415" width="200" height="45" rx="8" fill="#e74c3c"/>
  <text x="350" y="443" text-anchor="middle" font-size="13" fill="white">输出 Y (下一层输入)</text>

  <!-- 关键标注 -->
  <rect x="40" y="400" width="180" height="60" rx="6" fill="#fff" stroke="#e74c3c" stroke-width="1"/>
  <text x="130" y="420" text-anchor="middle" font-size="10" fill="#c0392b">核心创新:</text>
  <text x="130" y="437" text-anchor="middle" font-size="10" fill="#333">• 4-bit NF4 量化</text>
  <text x="130" y="452" text-anchor="middle" font-size="10" fill="#333">• 双重量化 (DQ)</text>

  <rect x="480" y="400" width="180" height="60" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1"/>
  <text x="570" y="420" text-anchor="middle" font-size="10" fill="#1e8449">关键设计:</text>
  <text x="570" y="437" text-anchor="middle" font-size="10" fill="#333">• 所有层都加 LoRA</text>
  <text x="570" y="452" text-anchor="middle" font-size="10" fill="#333">• 分页优化器</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L7,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
