<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="sans-serif">
  <rect width="700" height="400" fill="#fafafa"/>
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">QLoRA 训练迭代全景：损失下降与 LoRA 参数增长</text>

  <!-- X轴: 训练步数 -->
  <line x1="80" y1="320" x2="650" y2="320" stroke="#333" stroke-width="2"/>
  <text x="365" y="350" text-anchor="middle" font-size="13" fill="#555">训练步数 (steps)</text>

  <!-- Y轴: 损失 -->
  <line x1="80" y1="50" x2="80" y2="320" stroke="#333" stroke-width="2"/>
  <text x="30" y="185" text-anchor="middle" font-size="12" fill="#555" transform="rotate(-90, 30, 185)">损失 L</text>

  <!-- Y轴刻度 -->
  <text x="70" y="323" text-anchor="end" font-size="11" fill="#999">0.0</text>
  <text x="70" y="268" text-anchor="end" font-size="11" fill="#999">0.5</text>
  <text x="70" y="213" text-anchor="end" font-size="11" fill="#999">1.0</text>
  <text x="70" y="158" text-anchor="end" font-size="11" fill="#999">1.5</text>
  <text x="70" y="103" text-anchor="end" font-size="11" fill="#999">2.0</text>

  <!-- X轴刻度 -->
  <text x="120" y="340" text-anchor="middle" font-size="11" fill="#999">0</text>
  <text x="230" y="340" text-anchor="middle" font-size="11" fill="#999">500</text>
  <text x="340" y="340" text-anchor="middle" font-size="11" fill="#999">1000</text>
  <text x="450" y="340" text-anchor="middle" font-size="11" fill="#999">1500</text>
  <text x="560" y="340" text-anchor="middle" font-size="11" fill="#999">2000</text>

  <!-- 网格线 -->
  <line x1="80" y1="268" x2="650" y2="268" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="213" x2="650" y2="213" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="158" x2="650" y2="158" stroke="#eee" stroke-width="1"/>
  <line x1="80" y1="103" x2="650" y2="103" stroke="#eee" stroke-width="1"/>

  <!-- 损失曲线 (快速下降后趋于平稳) -->
  <polyline points="120,103 175,158 230,200 285,235 340,258 395,273 450,283 505,290 560,295" fill="none" stroke="#e74c3c" stroke-width="3"/>

  <!-- 数据点 -->
  <circle cx="120" cy="103" r="5" fill="#e74c3c"/>
  <text x="120" y="90" text-anchor="middle" font-size="10" fill="#e74c3c">2.0</text>

  <circle cx="230" cy="200" r="5" fill="#e74c3c"/>
  <text x="230" y="187" text-anchor="middle" font-size="10" fill="#e74c3c">1.0</text>

  <circle cx="340" cy="258" r="5" fill="#e74c3c"/>
  <text x="340" y="245" text-anchor="middle" font-size="10" fill="#e74c3c">0.5</text>

  <circle cx="450" cy="283" r="5" fill="#e74c3c"/>
  <text x="450" y="270" text-anchor="middle" font-size="10" fill="#e74c3c">0.3</text>

  <circle cx="560" cy="295" r="5" fill="#e74c3c"/>
  <text x="560" y="282" text-anchor="middle" font-size="10" fill="#e74c3c">0.2</text>

  <!-- LoRA 参数范数曲线 (逐渐增长) -->
  <polyline points="120,310 175,300 230,285 285,268 340,255 395,245 450,238 505,233 560,230" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="6"/>

  <circle cx="120" cy="310" r="4" fill="#27ae60"/>
  <text x="100" y="305" text-anchor="end" font-size="9" fill="#27ae60">0.01</text>

  <circle cx="230" cy="285" r="4" fill="#27ae60"/>
  <text x="210" y="280" text-anchor="end" font-size="9" fill="#27ae60">0.15</text>

  <circle cx="340" cy="255" r="4" fill="#27ae60"/>
  <text x="320" y="250" text-anchor="end" font-size="9" fill="#27ae60">0.35</text>

  <circle cx="450" cy="238" r="4" fill="#27ae60"/>
  <text x="430" y="233" text-anchor="end" font-size="9" fill="#27ae60">0.50</text>

  <circle cx="560" cy="230" r="4" fill="#27ae60"/>
  <text x="540" y="225" text-anchor="end" font-size="9" fill="#27ae60">0.60</text>

  <!-- 标注 -->
  <rect x="450" y="60" width="200" height="80" rx="8" fill="#f8f9f9" stroke="#bdc3c7" stroke-width="1"/>
  <text x="550" y="80" text-anchor="middle" font-size="11" font-weight="bold" fill="#2c3e50">训练阶段</text>
  <text x="550" y="100" text-anchor="middle" font-size="10" fill="#e74c3c">— 损失 L (下降)</text>
  <text x="550" y="120" text-anchor="middle" font-size="10" fill="#27ae60">- - LoRA 参数范数 (增长)</text>

  <!-- 关键观察 -->
  <rect x="80" y="365" width="540" height="25" rx="4" fill="#eaf2f8"/>
  <text x="350" y="382" text-anchor="middle" font-size="10" fill="#2980b9">关键观察: 损失快速下降后趋于平稳，LoRA 参数从接近零逐渐增长到稳定值——适配器在学习任务特定的知识</text>

  <!-- 第二阶段 Y轴 (右侧) -->
  <line x1="650" y1="50" x2="650" y2="320" stroke="#27ae60" stroke-width="1"/>
  <text x="670" y="185" text-anchor="middle" font-size="10" fill="#27ae60" transform="rotate(90, 670, 185)">||LoRA||</text>
</svg>
