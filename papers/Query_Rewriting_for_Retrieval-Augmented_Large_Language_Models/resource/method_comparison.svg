<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">检索增强 LLM 方案对比</text>

  <!-- Method 1: Direct -->
  <rect x="30" y="60" width="250" height="200" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <text x="155" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">方法一：Direct</text>
  <rect x="60" y="110" width="190" height="40" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="155" y="135" text-anchor="middle" font-size="12" fill="#333">用户问题 x</text>
  <line x1="155" y1="150" x2="155" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="175" width="190" height="40" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1"/>
  <text x="155" y="200" text-anchor="middle" font-size="12" fill="#333">黑盒 LLM 阅读器</text>
  <line x1="155" y1="215" x2="155" y2="240" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="240" width="190" height="30" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="1"/>
  <text x="155" y="260" text-anchor="middle" font-size="11" fill="#333">输出答案 ŷ</text>
  <text x="155" y="290" text-anchor="middle" font-size="11" fill="#d32f2f">✗ 无外部知识，易幻觉</text>

  <!-- Method 2: Retrieve-then-Read -->
  <rect x="320" y="60" width="250" height="200" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>
  <text x="445" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">方法二：Retrieve-then-Read</text>
  <rect x="350" y="110" width="190" height="35" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="445" y="132" text-anchor="middle" font-size="12" fill="#333">用户问题 x</text>
  <line x1="445" y1="145" x2="445" y2="165" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="165" width="190" height="35" rx="6" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1"/>
  <text x="445" y="187" text-anchor="middle" font-size="12" fill="#333">检索器 → 文档 doc</text>
  <line x1="445" y1="200" x2="445" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="350" y="220" width="190" height="35" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1"/>
  <text x="445" y="242" text-anchor="middle" font-size="11" fill="#333">黑盒 LLM ([doc, x] → ŷ)</text>
  <text x="445" y="290" text-anchor="middle" font-size="11" fill="#d32f2f">✗ 原始问题≠好查询</text>

  <!-- Method 3: Rewrite-Retrieve-Read (本文) -->
  <rect x="610" y="60" width="260" height="200" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="740" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">方法三：Rewrite-Retrieve-Read (本文)</text>
  <rect x="640" y="110" width="200" height="30" rx="6" fill="#e3f2bd" stroke="#1976d2" stroke-width="1"/>
  <text x="740" y="130" text-anchor="middle" font-size="12" fill="#333">用户问题 x</text>
  <line x1="740" y1="140" x2="740" y2="155" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="640" y="155" width="200" height="30" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="740" y="175" text-anchor="middle" font-size="12" fill="#1b5e20">★ 可训练 Rewriter → x̃</text>
  <line x1="740" y1="185" x2="740" y2="200" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="640" y="200" width="200" height="25" rx="6" fill="#e1bee7" stroke="#7b1fa2" stroke-width="1"/>
  <text x="740" y="217" text-anchor="middle" font-size="11" fill="#333">检索器 → 文档 doc</text>
  <line x1="740" y1="225" x2="740" y2="240" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="640" y="240" width="200" height="25" rx="6" fill="#fff3e0" stroke="#f57c00" stroke-width="1"/>
  <text x="740" y="257" text-anchor="middle" font-size="11" fill="#333">黑盒 LLM ([doc, x] → ŷ)</text>
  <text x="740" y="290" text-anchor="middle" font-size="11" fill="#2e7d32">✓ 查询适配，检索更准</text>

  <!-- Bottom comparison -->
  <rect x="30" y="320" width="840" height="180" rx="8" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="450" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">关键差异对比</text>

  <!-- Table header -->
  <rect x="50" y="365" width="200" height="30" rx="4" fill="#e0e0e0"/>
  <text x="150" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">维度</text>
  <rect x="250" y="365" width="200" height="30" rx="4" fill="#e0e0e0"/>
  <text x="350" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Retrieve-then-Read</text>
  <rect x="450" y="365" width="200" height="30" rx="4" fill="#c8e6c9"/>
  <text x="550" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">Rewrite-Retrieve-Read</text>
  <rect x="650" y="365" width="200" height="30" rx="4" fill="#e0e0e0"/>
  <text x="750" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">改进点</text>

  <!-- Row 1 -->
  <rect x="50" y="395" width="200" height="30" rx="4" fill="#f5f5f5"/>
  <text x="150" y="415" text-anchor="middle" font-size="11" fill="#333">查询来源</text>
  <rect x="250" y="395" width="200" height="30" rx="4" fill="#fff"/>
  <text x="350" y="415" text-anchor="middle" font-size="11" fill="#333">原始问题 x</text>
  <rect x="450" y="395" width="200" height="30" rx="4" fill="#fff"/>
  <text x="550" y="415" text-anchor="middle" font-size="11" fill="#333">重写查询 x̃</text>
  <rect x="650" y="395" width="200" height="30" rx="4" fill="#fff"/>
  <text x="750" y="415" text-anchor="middle" font-size="11" fill="#333">填补输入-知识差距</text>

  <!-- Row 2 -->
  <rect x="50" y="425" width="200" height="30" rx="4" fill="#f5f5f5"/>
  <text x="150" y="445" text-anchor="middle" font-size="11" fill="#333">可训练模块</text>
  <rect x="250" y="425" width="200" height="30" rx="4" fill="#fff"/>
  <text x="350" y="445" text-anchor="middle" font-size="11" fill="#333">无（全部冻结）</text>
  <rect x="450" y="425" width="200" height="30" rx="4" fill="#fff"/>
  <text x="550" y="445" text-anchor="middle" font-size="11" fill="#333">Rewriter (T5)</text>
  <rect x="650" y="425" width="200" height="30" rx="4" fill="#fff"/>
  <text x="750" y="445" text-anchor="middle" font-size="11" fill="#333">小模型适配大模型</text>

  <!-- Row 3 -->
  <rect x="50" y="455" width="200" height="30" rx="4" fill="#f5f5f5"/>
  <text x="150" y="475" text-anchor="middle" font-size="11" fill="#333">训练方式</text>
  <rect x="250" y="455" width="200" height="30" rx="4" fill="#fff"/>
  <text x="350" y="475" text-anchor="middle" font-size="11" fill="#333">N/A</text>
  <rect x="450" y="455" width="200" height="30" rx="4" fill="#fff"/>
  <text x="550" y="475" text-anchor="middle" font-size="11" fill="#333">Warm-up + RL (PPO)</text>
  <rect x="650" y="455" width="200" height="30" rx="4" fill="#fff"/>
  <text x="750" y="475" text-anchor="middle" font-size="11" fill="#333">用LLM反馈优化查询</text>
</svg>
