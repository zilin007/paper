<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="425" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Rewriter 训练迭代全景（简化数值示例）</text>

  <!-- Round 0: Warm-up -->
  <rect x="30" y="55" width="160" height="340" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="110" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1565c0">阶段 0: Warm-up</text>
  <text x="110" y="105" text-anchor="middle" font-size="10" fill="#333">用 LLM 生成的</text>
  <text x="110" y="120" text-anchor="middle" font-size="10" fill="#333">伪标签做 SFT</text>
  <line x1="50" y1="140" x2="170" y2="140" stroke="#1976d2" stroke-width="1"/>
  <text x="110" y="165" text-anchor="middle" font-size="10" fill="#333">输入: "All Star 电影?"</text>
  <text x="110" y="185" text-anchor="middle" font-size="10" fill="#333">LLM查询: "2000 movie"</text>
  <text x="110" y="200" text-anchor="middle" font-size="10" fill="#333">"All Star song"</text>
  <text x="110" y="225" text-anchor="middle" font-size="10" fill="#333">目标: 学会模仿</text>
  <text x="110" y="250" text-anchor="middle" font-size="10" fill="#333">损失: L_SFT = -log P(x̃|x)</text>
  <text x="110" y="280" text-anchor="middle" font-size="10" fill="#333">θ₀: 随机初始化</text>
  <text x="110" y="300" text-anchor="middle" font-size="10" fill="#333">→ θ_warm</text>
  <text x="110" y="335" text-anchor="middle" font-size="11" fill="#1565c0" font-weight="bold">输出: 初步查询能力</text>

  <!-- Arrow -->
  <line x1="190" y1="225" x2="220" y2="225" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="205" y="218" text-anchor="middle" font-size="9" fill="#666">θ_warm</text>

  <!-- Round 1: RL Iteration 1 -->
  <rect x="220" y="55" width="180" height="340" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="310" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#e65100">RL 第 1 轮</text>
  <line x1="240" y1="100" x2="380" y2="100" stroke="#f57c00" stroke-width="1"/>
  <text x="310" y="125" text-anchor="middle" font-size="10" fill="#333">输入: "All Star 电影?"</text>
  <text x="310" y="150" text-anchor="middle" font-size="10" fill="#333">Rewriter(θ_warm):</text>
  <text x="310" y="170" text-anchor="middle" font-size="10" fill="#333">x̃₁ = "All Star movie 2000"</text>
  <text x="310" y="195" text-anchor="middle" font-size="10" fill="#333">检索 → doc₁</text>
  <text x="310" y="215" text-anchor="middle" font-size="10" fill="#333">LLM([doc₁,x]) → ŷ₁</text>
  <text x="310" y="240" text-anchor="middle" font-size="10" fill="#333">R₁ = F1(ŷ₁, y) - β·KL</text>
  <text x="310" y="260" text-anchor="middle" font-size="10" fill="#d32f2f">R₁ = 0.3 (较低)</text>
  <text x="310" y="285" text-anchor="middle" font-size="10" fill="#333">PPO 更新: θ₁ = θ_warm - η·∇R₁</text>
  <text x="310" y="310" text-anchor="middle" font-size="10" fill="#333">查询质量: 一般</text>
  <text x="310" y="330" text-anchor="middle" font-size="10" fill="#333">EM: 0.35, F1: 0.45</text>
  <text x="310" y="365" text-anchor="middle" font-size="10" fill="#666">查询不够精确</text>
  <text x="310" y="380" text-anchor="middle" font-size="10" fill="#666">检索文档相关性差</text>

  <!-- Arrow -->
  <line x1="400" y1="225" x2="430" y2="225" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="415" y="218" text-anchor="middle" font-size="9" fill="#666">θ₁</text>

  <!-- Round 2: RL Iteration 2 -->
  <rect x="430" y="55" width="180" height="340" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="520" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#f57f17">RL 第 2 轮</text>
  <line x1="450" y1="100" x2="590" y2="100" stroke="#f9a825" stroke-width="1"/>
  <text x="520" y="125" text-anchor="middle" font-size="10" fill="#333">输入: "All Star 电影?"</text>
  <text x="520" y="150" text-anchor="middle" font-size="10" fill="#333">Rewriter(θ₁):</text>
  <text x="520" y="170" text-anchor="middle" font-size="10" fill="#333">x̃₂ = "2000 movie All Star"</text>
  <text x="520" y="195" text-anchor="middle" font-size="10" fill="#333">检索 → doc₂ (更好)</text>
  <text x="520" y="215" text-anchor="middle" font-size="10" fill="#333">LLM([doc₂,x]) → ŷ₂</text>
  <text x="520" y="240" text-anchor="middle" font-size="10" fill="#333">R₂ = F1(ŷ₂, y) - β·KL</text>
  <text x="520" y="260" text-anchor="middle" font-size="10" fill="#f57f17">R₂ = 0.6 (提升!)</text>
  <text x="520" y="285" text-anchor="middle" font-size="10" fill="#333">PPO 更新: θ₂ = θ₁ - η·∇R₂</text>
  <text x="520" y="310" text-anchor="middle" font-size="10" fill="#333">查询质量: 改善</text>
  <text x="520" y="330" text-anchor="middle" font-size="10" fill="#333">EM: 0.42, F1: 0.54</text>
  <text x="520" y="365" text-anchor="middle" font-size="10" fill="#666">关键词顺序优化</text>
  <text x="520" y="380" text-anchor="middle" font-size="10" fill="#666">检索命中率上升</text>

  <!-- Arrow -->
  <line x1="610" y1="225" x2="640" y2="225" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="625" y="218" text-anchor="middle" font-size="9" fill="#666">θ₂</text>

  <!-- Round N: Converged -->
  <rect x="640" y="55" width="180" height="340" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="730" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">RL 第 N 轮 (收敛)</text>
  <line x1="660" y1="100" x2="800" y2="100" stroke="#2e7d32" stroke-width="1"/>
  <text x="730" y="125" text-anchor="middle" font-size="10" fill="#333">输入: "All Star 电影?"</text>
  <text x="730" y="150" text-anchor="middle" font-size="10" fill="#333">Rewriter(θ_N):</text>
  <text x="730" y="170" text-anchor="middle" font-size="10" fill="#333">x̃_N = "2000 movie</text>
  <text x="730" y="185" text-anchor="middle" font-size="10" fill="#333">"All Star" song"</text>
  <text x="730" y="210" text-anchor="middle" font-size="10" fill="#333">检索 → doc_N (精准)</text>
  <text x="730" y="230" text-anchor="middle" font-size="10" fill="#333">LLM([doc_N,x]) → ŷ_N</text>
  <text x="730" y="255" text-anchor="middle" font-size="10" fill="#333">R_N = F1(ŷ_N, y) - β·KL</text>
  <text x="730" y="275" text-anchor="middle" font-size="10" fill="#2e7d32" font-weight="bold">R_N = 0.92 (很高!)</text>
  <text x="730" y="300" text-anchor="middle" font-size="10" fill="#333">θ_N 已充分优化</text>
  <text x="730" y="320" text-anchor="middle" font-size="10" fill="#333">EM: 0.48, F1: 0.61</text>
  <text x="730" y="355" text-anchor="middle" font-size="11" fill="#1b5e20" font-weight="bold">✓ 查询精准适配检索器</text>
  <text x="730" y="375" text-anchor="middle" font-size="10" fill="#2e7d32">✓ 检索命中率 82%+</text>

  <!-- Performance trend arrow at bottom -->
  <line x1="110" y1="410" x2="730" y2="410" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#2e7d32">训练轮次 ↑ → 查询质量 ↑ → 检索命中率 ↑ → 最终答案准确率 ↑</text>
</svg>
