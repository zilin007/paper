<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <defs>
    <style>
      .title { font-family: sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
      .label { font-family: sans-serif; font-size: 11px; text-anchor: middle; }
      .small { font-family: sans-serif; font-size: 10px; }
      .round { rx: 5; ry: 5; }
    </style>
  </defs>
  
  <text x="400" y="25" class="title">GRPO 多轮训练全景图</text>
  
  <!-- Round 1 -->
  <rect x="20" y="50" width="180" height="200" class="round" fill="#E3F2FD" stroke="#1976D2" />
  <text x="110" y="75" class="title" fill="#1976D2">第 1 轮</text>
  
  <rect x="40" y="90" width="140" height="25" class="round" fill="#BBDEFB" />
  <text x="110" y="107" class="small">生成 3 个回答</text>
  
  <rect x="40" y="125" width="140" height="25" class="round" fill="#BBDEFB" />
  <text x="110" y="142" class="small">y₁="5" ✓, y₂="5" ✓, y₃="7" ✗</text>
  
  <rect x="40" y="160" width="140" height="25" class="round" fill="#FFCCBC" />
  <text x="110" y="177" class="small">奖励: r=[1, 1, 0]</text>
  
  <rect x="40" y="195" width="140" height="25" class="round" fill="#C8E6C9" />
  <text x="110" y="212" class="small">更新: P("5")↑ P("7")↓</text>
  
  <!-- Arrow -->
  <text x="210" y="150" class="label" font-size="20">→</text>
  
  <!-- Round 2 -->
  <rect x="230" y="50" width="180" height="200" class="round" fill="#E3F2FD" stroke="#1976D2" />
  <text x="320" y="75" class="title" fill="#1976D2">第 2 轮</text>
  
  <rect x="250" y="90" width="140" height="25" class="round" fill="#BBDEFB" />
  <text x="320" y="107" class="small">生成 3 个回答</text>
  
  <rect x="250" y="125" width="140" height="25" class="round" fill="#BBDEFB" />
  <text x="320" y="142" class="small">y₁="5" ✓, y₂="5" ✓, y₃="5" ✓</text>
  
  <rect x="250" y="160" width="140" height="25" class="round" fill="#C8E6C9" />
  <text x="320" y="177" class="small">奖励: r=[1, 1, 1]</text>
  
  <rect x="250" y="195" width="140" height="25" class="round" fill="#FFF9C4" />
  <text x="320" y="212" class="small">优势全为 0，无梯度!</text>
  
  <!-- Arrow -->
  <text x="420" y="150" class="label" font-size="20">→</text>
  
  <!-- Round 3+ -->
  <rect x="440" y="50" width="180" height="200" class="round" fill="#E3F2FD" stroke="#1976D2" />
  <text x="530" y="75" class="title" fill="#1976D2">第 3 轮+</text>
  
  <rect x="460" y="90" width="140" height="25" class="round" fill="#BBDEFB" />
  <text x="530" y="107" class="small">引入更难问题</text>
  
  <rect x="460" y="125" width="140" height="25" class="round" fill="#BBDEFB" />
  <text x="530" y="142" class="small">x="What is 12+15?"</text>
  
  <rect x="460" y="160" width="140" height="25" class="round" fill="#FFCCBC" />
  <text x="530" y="177" class="small">奖励: r=[1, 0, 0]</text>
  
  <rect x="460" y="195" width="140" height="25" class="round" fill="#C8E6C9" />
  <text x="530" y="212" class="small">继续更新参数</text>
  
  <!-- Key insight box -->
  <rect x="630" y="50" width="150" height="200" class="round" fill="#FFF3E0" stroke="#F57C00" />
  <text x="705" y="80" class="title" fill="#F57C00">关键洞察</text>
  
  <text x="705" y="110" class="small" text-anchor="middle">当所有回答都正确时</text>
  <text x="705" y="125" class="small" text-anchor="middle">优势 = 0，无学习信号</text>
  
  <text x="705" y="155" class="small" text-anchor="middle">需要:</text>
  <text x="705" y="170" class="small" text-anchor="middle">1. 增加难度</text>
  <text x="705" y="185" class="small" text-anchor="middle">2. 课程学习</text>
  <text x="705" y="200" class="small" text-anchor="middle">3. 自适应采样</text>
  
  <!-- Bottom summary -->
  <rect x="20" y="265" width="760" height="25" class="round" fill="#E8F5E9" stroke="#4CAF50" />
  <text x="400" y="282" class="label" fill="#2E7D32">训练过程：模型逐渐学会正确答案，但需要持续增加难度以保持学习信号</text>
</svg>
