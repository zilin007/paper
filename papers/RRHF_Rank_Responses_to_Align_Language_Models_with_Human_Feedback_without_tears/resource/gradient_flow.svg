<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="sans-serif">
  <defs>
    <style>
      .title { font-size: 16px; font-weight: bold; }
      .label { font-size: 12px; }
      .small { font-size: 10px; }
      .box { rx: 6; ry: 6; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .grad-arrow { stroke: #e53935; stroke-width: 2.5; fill: none; marker-end: url(#redarrow); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="redarrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e53935"/>
    </marker>
  </defs>

  <text x="300" y="25" text-anchor="middle" class="title">RRHF 训练流程与梯度流向</text>

  <!-- Query Input -->
  <rect x="50" y="50" width="100" height="40" fill="#BBDEFB" class="box"/>
  <text x="100" y="75" text-anchor="middle" class="label">Query (x)</text>

  <!-- Language Model -->
  <rect x="200" y="40" width="160" height="60" fill="#4CAF50" class="box"/>
  <text x="280" y="65" text-anchor="middle" fill="white" class="label">Language Model (π)</text>
  <text x="280" y="82" text-anchor="middle" class="small" fill="white">参数 θ 可训练</text>

  <line x1="150" y1="70" x2="200" y2="70" class="arrow"/>

  <!-- Multiple Responses -->
  <rect x="410" y="30" width="140" height="30" fill="#81C784" class="box"/>
  <text x="480" y="50" text-anchor="middle" class="small">Response y₁ (好)</text>

  <rect x="410" y="65" width="140" height="30" fill="#A5D6A7" class="box"/>
  <text x="480" y="85" text-anchor="middle" class="small">Response y₂ (中)</text>

  <rect x="410" y="100" width="140" height="30" fill="#C8E6C9" class="box"/>
  <text x="480" y="120" text-anchor="middle" class="small">Response y₃ (差)</text>

  <line x1="360" y1="55" x2="410" y2="45" class="arrow"/>
  <line x1="360" y1="65" x2="410" y2="80" class="arrow"/>
  <line x1="360" y1="75" x2="410" y2="115" class="arrow"/>

  <!-- Human Labels -->
  <rect x="410" y="155" width="140" height="35" fill="#FF9800" class="box"/>
  <text x="480" y="172" text-anchor="middle" fill="white" class="label">Human Label / Reward</text>
  <text x="480" y="185" text-anchor="middle" class="small" fill="white">r₁ > r₂ > r₃</text>

  <line x1="480" y1="130" x2="480" y2="155" class="arrow" stroke="#666"/>

  <!-- Loss Computation -->
  <rect x="200" y="140" width="160" height="50" fill="#FF5722" class="box"/>
  <text x="280" y="160" text-anchor="middle" fill="white" class="label">L_rank + L_SFT</text>
  <text x="280" y="178" text-anchor="middle" class="small" fill="white">排序损失 + SFT损失</text>

  <line x1="410" y1="172" x2="360" y2="165" class="arrow"/>

  <!-- Gradient Flow -->
  <text x="100" y="230" text-anchor="middle" class="label" fill="#e53935">梯度反向传播</text>

  <path d="M 280 190 L 280 220 L 150 220 L 150 200" class="grad-arrow"/>
  <text x="170" y="215" class="small" fill="#e53935">L/∂θ</text>

  <!-- Parameter Update -->
  <rect x="50" y="240" width="200" height="50" fill="#7B1FA2" class="box"/>
  <text x="150" y="260" text-anchor="middle" fill="white" class="label">θ_new = θ - η · L/∂θ</text>
  <text x="150" y="278" text-anchor="middle" class="small" fill="white">参数更新</text>

  <line x1="150" y1="220" x2="150" y2="240" class="arrow"/>

  <!-- Iteration -->
  <rect x="300" y="240" width="250" height="90" fill="#FFF3E0" stroke="#FF9800" stroke-width="2" class="box"/>
  <text x="425" y="265" text-anchor="middle" class="label" fill="#E65100">迭代训练</text>
  <text x="425" y="285" text-anchor="middle" class="small">• 采样质量决定上限</text>
  <text x="425" y="300" text-anchor="middle" class="small">• 3 epoch 收敛</text>
  <text x="425" y="315" text-anchor="middle" class="small">• 无需 KL 惩罚项</text>

  <path d="M 250 265 L 300 265" class="arrow"/>
</svg>
