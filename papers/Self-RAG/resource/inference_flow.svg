<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arrow-i" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Self-RAG 推理流程（带数值示例）</text>

  <!-- Step 1: Retrieve decision -->
  <rect x="30" y="60" width="200" height="70" rx="8" fill="#3498db"/>
  <text x="130" y="85" text-anchor="middle" font-size="13" fill="white">Step 1: 判断是否检索</text>
  <text x="130" y="105" text-anchor="middle" font-size="11" fill="white">输入: "谁发明了电话?"</text>
  <text x="130" y="122" text-anchor="middle" font-size="11" fill="white">P(Retrieve=yes)=0.92 → 检索!</text>

  <line x1="230" y1="95" x2="310" y2="95" stroke="#333" stroke-width="2" marker-end="url(#arrow-i)"/>

  <!-- Step 2: Retrieve -->
  <rect x="310" y="60" width="200" height="70" rx="8" fill="#9b59b6"/>
  <text x="410" y="85" text-anchor="middle" font-size="13" fill="white">Step 2: 检索 + 评估相关性</text>
  <text x="410" y="105" text-anchor="middle" font-size="10" fill="white">d₁: "贝尔发明电话" IsRel=relevant</text>
  <text x="410" y="122" text-anchor="middle" font-size="10" fill="white">d₂: "爱迪生发明灯泡" IsRel=irrelevant</text>

  <line x1="510" y1="95" x2="590" y2="95" stroke="#333" stroke-width="2" marker-end="url(#arrow-i)"/>

  <!-- Step 3: Generate -->
  <rect x="590" y="60" width="190" height="70" rx="8" fill="#2ecc71"/>
  <text x="685" y="85" text-anchor="middle" font-size="13" fill="white">Step 3: 生成回答</text>
  <text x="685" y="105" text-anchor="middle" font-size="10" fill="white">y₁(d₁): "贝尔于1876年发明"</text>
  <text x="685" y="122" text-anchor="middle" font-size="10" fill="white">y₁(d₂): "爱迪生发明了电话"</text>

  <!-- Arrows down -->
  <line x1="130" y1="130" x2="130" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow-i)"/>
  <line x1="410" y1="130" x2="410" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow-i)"/>
  <line x1="685" y1="130" x2="685" y2="170" stroke="#333" stroke-width="2" marker-end="url(#arrow-i)"/>

  <!-- Critique scores -->
  <rect x="30" y="170" width="240" height="100" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="150" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#e67e22">Step 4: 自我反思评分</text>

  <!-- d1 scores -->
  <rect x="45" y="210" width="100" height="50" rx="5" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="95" y="228" text-anchor="middle" font-size="10" fill="#27ae60">路径 d₁:</text>
  <text x="95" y="243" text-anchor="middle" font-size="9" fill="#27ae60">IsSup=fully(0.85)</text>
  <text x="95" y="256" text-anchor="middle" font-size="9" fill="#27ae60">IsUse=5(0.90)</text>

  <!-- d2 scores -->
  <rect x="155" y="210" width="100" height="50" rx="5" fill="#fadbd8" stroke="#e74c3c" stroke-width="1"/>
  <text x="205" y="228" text-anchor="middle" font-size="10" fill="#e74c3c">路径 d₂:</text>
  <text x="205" y="243" text-anchor="middle" font-size="9" fill="#e74c3c">IsSup=no(0.10)</text>
  <text x="205" y="256" text-anchor="middle" font-size="9" fill="#e74c3c">IsUse=2(0.15)</text>

  <!-- Selection -->
  <rect x="310" y="170" width="200" height="100" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="2"/>
  <text x="410" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Step 5: 选择最佳路径</text>
  <text x="410" y="220" text-anchor="middle" font-size="11" fill="#27ae60">Score = α·IsSup + β·IsUse</text>
  <text x="410" y="240" text-anchor="middle" font-size="10" fill="#27ae60">d₁: 0.5×0.85 + 0.5×0.90 = 0.875</text>
  <text x="410" y="258" text-anchor="middle" font-size="10" fill="#e74c3c">d₂: 0.5×0.10 + 0.5×0.15 = 0.125</text>

  <!-- Final output -->
  <rect x="590" y="170" width="190" height="100" rx="8" fill="#2ecc71"/>
  <text x="685" y="200" text-anchor="middle" font-size="13" fill="white">Step 6: 输出最佳结果</text>
  <text x="685" y="225" text-anchor="middle" font-size="10" fill="white">"亚历山大·贝尔于</text>
  <text x="685" y="240" text-anchor="middle" font-size="10" fill="white">1876年发明了电话"</text>
  <text x="685" y="260" text-anchor="middle" font-size="10" fill="white">[citation: d₁]</text>

  <!-- Key insight box -->
  <rect x="30" y="300" width="750" height="180" rx="10" fill="#ebf5fb" stroke="#3498db" stroke-width="2"/>
  <text x="405" y="330" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">核心机制：Reflection Tokens 的作用</text>

  <!-- Token types -->
  <rect x="50" y="350" width="160" height="110" rx="8" fill="#fadbd8" stroke="#e74c3c" stroke-width="1"/>
  <text x="130" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">Retrieve 检索令牌</text>
  <text x="130" y="390" text-anchor="middle" font-size="10" fill="#333">值: {yes, no, continue}</text>
  <text x="130" y="410" text-anchor="middle" font-size="10" fill="#333">决定是否需要检索</text>
  <text x="130" y="430" text-anchor="middle" font-size="10" fill="#333">类比: "我需要查资料吗？"</text>
  <text x="130" y="450" text-anchor="middle" font-size="10" fill="#333">→ 按需检索</text>

  <rect x="230" y="350" width="160" height="110" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="310" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">IsRel 相关性令牌</text>
  <text x="310" y="390" text-anchor="middle" font-size="10" fill="#333">值: {relevant, irrelevant}</text>
  <text x="310" y="410" text-anchor="middle" font-size="10" fill="#333">评估检索段落是否有用</text>
  <text x="310" y="430" text-anchor="middle" font-size="10" fill="#333">类比: "这篇资料有用吗？"</text>
  <text x="310" y="450" text-anchor="middle" font-size="10" fill="#333">→ 过滤无关信息</text>

  <rect x="410" y="350" width="170" height="110" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="1"/>
  <text x="495" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#e67e22">IsSup 支持度令牌</text>
  <text x="495" y="390" text-anchor="middle" font-size="10" fill="#333">值: {fully, partial, no}</text>
  <text x="495" y="410" text-anchor="middle" font-size="10" fill="#333">回答是否被段落支持</text>
  <text x="495" y="430" text-anchor="middle" font-size="10" fill="#333">类比: "我的回答有依据吗？"</text>
  <text x="495" y="450" text-anchor="middle" font-size="10" fill="#333">→ 保障事实准确性</text>

  <rect x="600" y="350" width="160" height="110" rx="8" fill="#e8daef" stroke="#8e44ad" stroke-width="1"/>
  <text x="680" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#8e44ad">IsUse 有用性令牌</text>
  <text x="680" y="390" text-anchor="middle" font-size="10" fill="#333">值: {5, 4, 3, 2, 1}</text>
  <text x="680" y="410" text-anchor="middle" font-size="10" fill="#333">整体回答质量评分</text>
  <text x="680" y="430" text-anchor="middle" font-size="10" fill="#333">类比: "这个回答好吗？"</text>
  <text x="680" y="450" text-anchor="middle" font-size="10" fill="#333">→ 选择最佳输出</text>
</svg>
