<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">现有 RAG 方案 vs Self-RAG 对比</text>

  <!-- Left: Traditional RAG -->
  <rect x="30" y="60" width="300" height="440" rx="10" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="2"/>
  <text x="180" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#e74c3c">传统 RAG</text>

  <!-- Step 1 -->
  <rect x="60" y="110" width="240" height="50" rx="8" fill="#3498db"/>
  <text x="180" y="140" text-anchor="middle" font-size="13" fill="white">用户输入 → 检索器</text>

  <line x1="180" y1="160" x2="180" y2="195" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="60" y="195" width="240" height="50" rx="8" fill="#9b59b6"/>
  <text x="180" y="225" text-anchor="middle" font-size="13" fill="white">固定检索 K 篇文档</text>

  <line x1="180" y1="245" x2="180" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="60" y="280" width="240" height="50" rx="8" fill="#2ecc71"/>
  <text x="180" y="310" text-anchor="middle" font-size="13" fill="white">LLM 生成回答</text>

  <line x1="180" y1="330" x2="180" y2="365" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="60" y="365" width="240" height="50" rx="8" fill="#f39c12"/>
  <text x="180" y="395" text-anchor="middle" font-size="13" fill="white">输出最终回答</text>

  <!-- Problems -->
  <rect x="60" y="435" width="240" height="55" rx="8" fill="#fadbd8" stroke="#e74c3c" stroke-width="1"/>
  <text x="180" y="455" text-anchor="middle" font-size="11" fill="#e74c3c">❌ 总是检索，不管是否需要</text>
  <text x="180" y="475" text-anchor="middle" font-size="11" fill="#e74c3c">❌ 不评估检索结果质量</text>

  <!-- Right: Self-RAG -->
  <rect x="370" y="60" width="300" height="440" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="520" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Self-RAG</text>

  <!-- Step 1 -->
  <rect x="400" y="110" width="240" height="50" rx="8" fill="#3498db"/>
  <text x="520" y="140" text-anchor="middle" font-size="13" fill="white">判断是否需要检索</text>

  <line x1="520" y1="160" x2="520" y2="195" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="400" y="195" width="240" height="50" rx="8" fill="#9b59b6"/>
  <text x="520" y="215" text-anchor="middle" font-size="12" fill="white">需要 → 检索 + 评估相关性</text>
  <text x="520" y="235" text-anchor="middle" font-size="12" fill="white">不需要 → 直接生成</text>

  <line x1="520" y1="245" x2="520" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="400" y="280" width="240" height="50" rx="8" fill="#2ecc71"/>
  <text x="520" y="300" text-anchor="middle" font-size="12" fill="white">生成回答 + 自我反思</text>
  <text x="520" y="320" text-anchor="middle" font-size="12" fill="white">(IsSup, IsUse, IsRel)</text>

  <line x1="520" y1="330" x2="520" y2="365" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="400" y="365" width="240" height="50" rx="8" fill="#f39c12"/>
  <text x="520" y="395" text-anchor="middle" font-size="13" fill="white">选择最佳回答输出</text>

  <!-- Advantages -->
  <rect x="400" y="435" width="240" height="55" rx="8" fill="#d5f5e3" stroke="#27ae60" stroke-width="1"/>
  <text x="520" y="455" text-anchor="middle" font-size="11" fill="#27ae60">✅ 按需检索，灵活可控</text>
  <text x="520" y="475" text-anchor="middle" font-size="11" fill="#27ae60">✅ 自我评估，质量保障</text>
</svg>
