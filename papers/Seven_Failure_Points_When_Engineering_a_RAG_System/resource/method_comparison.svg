<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">现有 RAG 方案对比</text>

  <!-- Approach 1: 直接问 LLM -->
  <rect x="30" y="60" width="220" height="400" rx="8" fill="#f8f8f8" stroke="#ccc" stroke-width="2"/>
  <text x="140" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">方案一：直接问 LLM</text>

  <rect x="50" y="110" width="180" height="50" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="140" y="135" text-anchor="middle" font-size="12" fill="#333">用户提问</text>
  <text x="140" y="150" text-anchor="middle" font-size="10" fill="#666">"神经网络怎么训练？"</text>

  <line x1="140" y1="160" x2="140" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="190" width="180" height="60" rx="6" fill="#fff3e0" stroke="#f57c00"/>
  <text x="140" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">大语言模型</text>
  <text x="140" y="235" text-anchor="middle" font-size="10" fill="#666">仅靠预训练知识回答</text>

  <line x1="140" y1="250" x2="140" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="50" y="280" width="180" height="50" rx="6" fill="#ffebee" stroke="#d32f2f"/>
  <text x="140" y="305" text-anchor="middle" font-size="12" fill="#d32f2f">回答可能编造</text>
  <text x="140" y="320" text-anchor="middle" font-size="10" fill="#666">（幻觉问题）</text>

  <!-- Cons -->
  <rect x="50" y="360" width="180" height="80" rx="6" fill="#ffebee" stroke="#d32f2f" stroke-dasharray="4,2"/>
  <text x="140" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#d32f2f">缺点</text>
  <text x="60" y="405" font-size="10" fill="#333">• 容易产生幻觉</text>
  <text x="60" y="420" font-size="10" fill="#333">• 无法追溯来源</text>
  <text x="60" y="435" font-size="10" fill="#333">• 知识不更新</text>

  <!-- Approach 2: 微调 LLM -->
  <rect x="290" y="60" width="220" height="400" rx="8" fill="#f8f8f8" stroke="#ccc" stroke-width="2"/>
  <text x="400" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">方案二：微调 LLM</text>

  <rect x="310" y="110" width="180" height="50" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="400" y="135" text-anchor="middle" font-size="12" fill="#333">领域数据收集</text>
  <text x="400" y="150" text-anchor="middle" font-size="10" fill="#666">需要大量标注数据</text>

  <line x1="400" y1="160" x2="400" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="190" width="180" height="60" rx="6" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="400" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">微调训练</text>
  <text x="400" y="235" text-anchor="middle" font-size="10" fill="#666">用领域数据训练模型</text>

  <line x1="400" y1="250" x2="400" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="310" y="280" width="180" height="50" rx="6" fill="#fff3e0" stroke="#f57c00"/>
  <text x="400" y="305" text-anchor="middle" font-size="12" fill="#333">微调后的模型</text>
  <text x="400" y="320" text-anchor="middle" font-size="10" fill="#666">领域知识 baked 进权重</text>

  <!-- Cons -->
  <rect x="310" y="360" width="180" height="80" rx="6" fill="#ffebee" stroke="#d32f2f" stroke-dasharray="4,2"/>
  <text x="400" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#d32f2f">缺点</text>
  <text x="320" y="405" font-size="10" fill="#333">• 训练成本高</text>
  <text x="320" y="420" font-size="10" fill="#333">• 数据更新需重新训练</text>
  <text x="320" y="435" font-size="10" fill="#333">• 隐私/安全难控制</text>

  <!-- Approach 3: RAG -->
  <rect x="550" y="60" width="220" height="400" rx="8" fill="#f8f8f8" stroke="#4caf50" stroke-width="2"/>
  <text x="660" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">方案三：RAG（推荐）</text>

  <rect x="570" y="110" width="180" height="50" rx="6" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="660" y="135" text-anchor="middle" font-size="12" fill="#333">文档索引建库</text>
  <text x="660" y="150" text-anchor="middle" font-size="10" fill="#666">分块+向量化+存储</text>

  <line x1="660" y1="160" x2="660" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="570" y="190" width="180" height="60" rx="6" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="660" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">检索相关文档</text>
  <text x="660" y="235" text-anchor="middle" font-size="10" fill="#666">向量相似度匹配</text>

  <line x1="660" y1="250" x2="660" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="570" y="280" width="180" height="50" rx="6" fill="#fff3e0" stroke="#f57c00"/>
  <text x="660" y="305" text-anchor="middle" font-size="12" fill="#333">LLM 基于上下文回答</text>
  <text x="660" y="320" text-anchor="middle" font-size="10" fill="#666">有依据、可追溯</text>

  <!-- Pros -->
  <rect x="570" y="360" width="180" height="80" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-dasharray="4,2"/>
  <text x="660" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#2e7d32">优点</text>
  <text x="580" y="405" font-size="10" fill="#333">• 减少幻觉</text>
  <text x="580" y="420" font-size="10" fill="#333">• 数据随时更新</text>
  <text x="580" y="435" font-size="10" fill="#333">• 但仍有 7 个失败点!</text>
</svg>
