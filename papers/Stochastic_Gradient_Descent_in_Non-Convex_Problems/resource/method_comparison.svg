<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">现有SGD收敛分析方法对比</text>

  <!-- Method 1: ODE + Robbins-Monro -->
  <rect x="20" y="55" width="200" height="160" rx="8" fill="#eaf2f8" stroke="#2980b9" stroke-width="2"/>
  <text x="120" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#2980b9">ODE 方法</text>
  <text x="120" y="98" text-anchor="middle" font-size="11" fill="#2980b9">(Ljung, Mertikopoulos)</text>

  <text x="35" y="125" font-size="12" fill="#333">✓ 经典框架，直观</text>
  <text x="35" y="148" font-size="12" fill="#333">✓ 需要 Robbins-Monro</text>
  <text x="35" y="171" font-size="12" fill="#333">步长条件</text>
  <text x="35" y="198" font-size="12" fill="#c0392b" font-weight="bold">✗ 需全局 Lipschitz 连续</text>
  <text x="35" y="221" font-size="12" fill="#c0392b" font-weight="bold">✗ 梯度矩需全局有界</text>

  <!-- Method 2: Stopping Time (early) -->
  <rect x="250" y="55" width="200" height="160" rx="8" fill="#fef9e7" stroke="#f39c12" stroke-width="2"/>
  <text x="350" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#f39c12">停时方法 (早期)</text>
  <text x="350" y="98" text-anchor="middle" font-size="11" fill="#f39c12">(Jin et al., 2022)</text>

  <text x="265" y="125" font-size="12" fill="#333">✓ 放宽步长条件</text>
  <text x="265" y="148" font-size="12" fill="#333">✓ 不需要 Lipschitz</text>
  <text x="265" y="171" font-size="12" fill="#333">✗ 需鞍点集为空</text>
  <text x="265" y="198" font-size="12" fill="#c0392b" font-weight="bold">✗ 驻点集有限连通分量</text>
  <text x="265" y="221" font-size="12" fill="#c0392b" font-weight="bold">✗ 梯度矩需全局有界</text>

  <!-- Method 3: This paper -->
  <rect x="480" y="55" width="200" height="160" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="3"/>
  <text x="580" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">停时方法 (本文)</text>
  <text x="580" y="98" text-anchor="middle" font-size="11" fill="#27ae60">(Jin et al., 2025)</text>

  <text x="495" y="125" font-size="12" fill="#333">✓ 放宽步长条件</text>
  <text x="495" y="148" font-size="12" fill="#333">✓ 不需要 Lipschitz</text>
  <text x="495" y="171" font-size="12" fill="#333">✓ 无需鞍点假设</text>
  <text x="495" y="198" font-size="12" fill="#27ae60" font-weight="bold">✓ 梯度矩局部有界即可</text>
  <text x="495" y="221" font-size="12" fill="#27ae60" font-weight="bold">✓ 同时证明 L₂ 收敛</text>

  <!-- Arrow connections -->
  <line x1="220" y1="135" x2="250" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="135" x2="480" y2="135" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step size comparison -->
  <rect x="20" y="240" width="660" height="165" rx="8" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1"/>
  <text x="350" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">步长条件对比：ε_t = 1/t^q</text>

  <!-- Robbins-Monro bar -->
  <text x="40" y="295" font-size="12" font-weight="bold" fill="#2980b9">Robbins-Monro:</text>
  <rect x="170" y="282" width="200" height="20" rx="3" fill="#eaf2f8"/>
  <rect x="170" y="282" width="120" height="20" rx="3" fill="#2980b9"/>
  <text x="230" y="297" text-anchor="middle" font-size="11" fill="white">q &gt; 0.5 (允许)</text>
  <rect x="290" y="282" width="80" height="20" rx="3" fill="#e74c3c" opacity="0.3"/>
  <text x="330" y="297" text-anchor="middle" font-size="10" fill="#c0392b">q ≤ 0.5 ✗</text>

  <!-- This paper bar -->
  <text x="40" y="330" font-size="12" font-weight="bold" fill="#27ae60">本文 (p=3):</text>
  <rect x="170" y="317" width="300" height="20" rx="3" fill="#eafaf1"/>
  <rect x="170" y="317" width="200" height="20" rx="3" fill="#27ae60"/>
  <text x="270" y="332" text-anchor="middle" font-size="11" fill="white">q &gt; 1/3 ≈ 0.333 (允许)</text>
  <rect x="370" y="317" width="100" height="20" rx="3" fill="#e74c3c" opacity="0.3"/>
  <text x="420" y="332" text-anchor="middle" font-size="10" fill="#c0392b">q ≤ 1/3 ✗</text>

  <!-- Highlight zone -->
  <rect x="290" y="282" width="80" height="55" rx="3" fill="#f39c12" opacity="0.2" stroke="#f39c12" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="330" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#f39c12">← 本文新增覆盖区域 →</text>

  <!-- q axis -->
  <line x1="170" y1="370" x2="470" y2="370" stroke="#333" stroke-width="1"/>
  <text x="170" y="388" font-size="10" fill="#666">q=0</text>
  <text x="270" y="388" font-size="10" fill="#666">q=1/3</text>
  <text x="370" y="388" font-size="10" fill="#666">q=0.5</text>
  <text x="470" y="388" font-size="10" fill="#666">q=1</text>
</svg>
