<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">SGD 收敛过程示意：步长衰减的作用</text>

  <!-- Y axis -->
  <line x1="80" y1="60" x2="80" y2="340" stroke="#333" stroke-width="1"/>
  <!-- X axis -->
  <line x1="80" y2="340" x2="660" y2="340" stroke="#333" stroke-width="1"/>
  <text x="370" y="370" text-anchor="middle" font-size="12" fill="#666">迭代次数 t</text>
  <text x="30" y="200" text-anchor="middle" font-size="12" fill="#666" transform="rotate(-90, 30, 200)">f(θ_t)</text>

  <!-- Y axis labels -->
  <text x="75" y="85" text-anchor="end" font-size="10" fill="#666">高</text>
  <text x="75" y="340" text-anchor="end" font-size="10" fill="#666">低</text>

  <!-- Minimum point dashed line -->
  <line x1="80" y1="280" x2="660" y2="280" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="655" y="275" text-anchor="end" font-size="10" fill="#27ae60">最优值 f*</text>

  <!-- SGD trajectory: large oscillations early, small later -->
  <!-- Phase 1: Large steps (t=1 to ~50) -->
  <polyline points="100,100 120,250 140,120 160,280 180,150 200,300 220,180 240,310 260,200 280,300"
    fill="none" stroke="#e74c3c" stroke-width="2.5"/>

  <!-- Phase 2: Medium steps (t=50 to ~200) -->
  <polyline points="280,300 300,260 320,290 340,250 360,280 380,260 400,275 420,265 440,278 460,270"
    fill="none" stroke="#f39c12" stroke-width="2.5"/>

  <!-- Phase 3: Small steps (t=200 to ~500) -->
  <polyline points="460,270 480,275 500,272 520,278 540,274 560,277 580,276 600,278 620,277 640,279"
    fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Phase annotations -->
  <rect x="90" y="65" width="190" height="30" rx="4" fill="#fadbd8" opacity="0.8"/>
  <text x="185" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">阶段1: 大步探索 (ε_t 大)</text>

  <rect x="280" y="65" width="180" height="30" rx="4" fill="#fdebd0" opacity="0.8"/>
  <text x="370" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#e67e22">阶段2: 中等调整 (ε_t 中)</text>

  <rect x="460" y="65" width="180" height="30" rx="4" fill="#d5f5e3" opacity="0.8"/>
  <text x="550" y="85" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">阶段3: 精细收敛 (ε_t 小)</text>

  <!-- Arrow showing convergence direction -->
  <line x1="640" y1="279" x2="650" y2="279" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step size decay curve (inset) -->
  <rect x="480" y="300" width="180" height="80" rx="6" fill="white" stroke="#bdc3c7" stroke-width="1"/>
  <text x="570" y="315" text-anchor="middle" font-size="9" fill="#666">步长 ε_t = t^(-0.4)</text>
  <polyline points="490,370 510,360 530,352 550,345 570,340 590,336 610,333 630,330 650,328"
    fill="none" stroke="#9b59b6" stroke-width="1.5"/>
  <text x="490" y="378" font-size="8" fill="#666">t=1</text>
  <text x="650" y="325" font-size="8" fill="#666">t→∞</text>
</svg>
