<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">停时方法：上穿行为分析</text>

  <!-- Function value curve -->
  <text x="30" y="60" font-size="12" fill="#666">f(θ_t) - f*</text>

  <!-- Y axis -->
  <line x1="60" y1="80" x2="60" y2="280" stroke="#333" stroke-width="1"/>
  <!-- X axis -->
  <line x1="60" y1="280" x2="660" y2="280" stroke="#333" stroke-width="1"/>
  <text x="660" y="295" text-anchor="end" font-size="12" fill="#666">t</text>

  <!-- h2 line (upper bound) -->
  <line x1="60" y1="130" x2="660" y2="130" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="65" y="125" font-size="11" fill="#e74c3c" font-weight="bold">h₂</text>

  <!-- h1 line (lower bound) -->
  <line x1="60" y1="200" x2="660" y2="200" stroke="#2980b9" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="65" y="195" font-size="11" fill="#2980b9" font-weight="bold">h₁</text>

  <!-- Function value trajectory (zigzag) -->
  <polyline points="80,250 120,220 160,180 200,150 240,120 280,160 320,210 360,240 400,220 440,190 480,170 520,140 560,160 600,190 640,210"
    fill="none" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- Up-crossing 1 annotation -->
  <rect x="155" y="125" width="90" height="80" rx="4" fill="#f39c12" opacity="0.15" stroke="#f39c12" stroke-width="1.5"/>
  <text x="200" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#f39c12">第1次上穿</text>

  <!-- μ1 marker -->
  <circle cx="160" cy="180" r="5" fill="#2980b9"/>
  <text x="160" y="210" text-anchor="middle" font-size="10" fill="#2980b9">μ₁</text>

  <!-- μ2 marker -->
  <circle cx="240" cy="120" r="5" fill="#e74c3c"/>
  <text x="240" y="110" text-anchor="middle" font-size="10" fill="#e74c3c">μ₂</text>

  <!-- μ3 marker -->
  <circle cx="320" cy="210" r="5" fill="#27ae60"/>
  <text x="320" y="230" text-anchor="middle" font-size="10" fill="#27ae60">μ₃</text>

  <!-- Up-crossing 2 annotation -->
  <rect x="435" y="125" width="90" height="80" rx="4" fill="#f39c12" opacity="0.15" stroke="#f39c12" stroke-width="1.5"/>
  <text x="480" y="118" text-anchor="middle" font-size="10" font-weight="bold" fill="#f39c12">第2次上穿</text>

  <!-- Arrow showing up-crossing direction -->
  <line x1="160" y1="175" x2="235" y2="130" stroke="#f39c12" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="175" x2="515" y2="130" stroke="#f39c12" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Key insight box -->
  <rect x="480" y="50" width="200" height="55" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="580" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">核心结论</text>
  <text x="580" y="88" text-anchor="middle" font-size="10" fill="#333">上穿次数几乎必然有限</text>
  <text x="580" y="102" text-anchor="middle" font-size="10" fill="#333">→ 函数值序列收敛</text>
</svg>
