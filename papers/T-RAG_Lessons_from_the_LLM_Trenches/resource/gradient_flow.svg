<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" font-family="sans-serif">
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#27ae60"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>
  
  <!-- 标题 -->
  <text x="300" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">LoRA 梯度流向图</text>
  
  <!-- 输入 x -->
  <rect x="20" y="120" width="80" height="40" rx="6" fill="#e8f0fe"/>
  <text x="60" y="145" text-anchor="middle" font-size="13" font-weight="bold">输入 x</text>
  
  <!-- W0 (冻结) -->
  <rect x="160" y="60" width="100" height="50" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="2"/>
  <text x="210" y="82" text-anchor="middle" font-size="13" font-weight="bold">W₀</text>
  <text x="210" y="98" text-anchor="middle" font-size="10" fill="#999">冻结 ❄️</text>
  
  <!-- B (可训练) -->
  <rect x="160" y="160" width="100" height="50" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2"/>
  <text x="210" y="182" text-anchor="middle" font-size="13" font-weight="bold">B</text>
  <text x="210" y="198" text-anchor="middle" font-size="10" fill="#27ae60">可训练 ✓</text>
  
  <!-- A (可训练) -->
  <rect x="320" y="160" width="100" height="50" rx="6" fill="#d4edda" stroke="#27ae60" stroke-width="2"/>
  <text x="370" y="182" text-anchor="middle" font-size="13" font-weight="bold">A</text>
  <text x="370" y="198" text-anchor="middle" font-size="10" fill="#27ae60">可训练 ✓</text>
  
  <!-- 输出 h -->
  <rect x="480" y="110" width="100" height="50" rx="6" fill="#e8f0fe"/>
  <text x="530" y="132" text-anchor="middle" font-size="13" font-weight="bold">输出 h</text>
  <text x="530" y="148" text-anchor="middle" font-size="10" fill="#666">W₀x + BAx</text>
  
  <!-- 损失 L -->
  <rect x="480" y="240" width="100" height="50" rx="6" fill="#fff3cd"/>
  <text x="530" y="262" text-anchor="middle" font-size="13" font-weight="bold">损失 L</text>
  <text x="530" y="278" text-anchor="middle" font-size="10" fill="#666">MSE</text>
  
  <!-- 箭头: x -> W0 -->
  <line x1="100" y1="130" x2="160" y2="85" stroke="#999" stroke-width="2" marker-end="url(#arrow-gray)"/>
  
  <!-- 箭头: x -> B -->
  <line x1="100" y1="150" x2="160" y2="175" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow-green)"/>
  
  <!-- 箭头: B -> A -->
  <line x1="260" y1="185" x2="320" y2="185" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow-green)"/>
  
  <!-- 箭头: W0 -> h -->
  <line x1="260" y1="85" x2="480" y2="125" stroke="#999" stroke-width="2" marker-end="url(#arrow-gray)"/>
  
  <!-- 箭头: A -> h -->
  <line x1="420" y1="175" x2="480" y2="145" stroke="#27ae60" stroke-width="2" marker-end="url(#arrow-green)"/>
  
  <!-- 箭头: h -> L -->
  <line x1="530" y1="160" x2="530" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrow-red)"/>
  
  <!-- 反向传播箭头: L -> h -->
  <line x1="480" y1="255" x2="480" y2="155" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-red)"/>
  <text x="495" y="210" font-size="10" fill="#c0392b">∂L/∂h</text>
  
  <!-- 反向传播: h -> A -->
  <line x1="480" y1="135" x2="420" y2="170" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="445" y="148" font-size="10" fill="#27ae60">∂L/∂A</text>
  
  <!-- 反向传播: h -> B -->
  <line x1="480" y1="130" x2="260" y2="175" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="360" y="145" font-size="10" fill="#27ae60">∂L/∂B</text>
  
  <!-- 反向传播: h -> W0 (无梯度) -->
  <line x1="480" y1="125" x2="260" y2="95" stroke="#999" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-gray)"/>
  <text x="360" y="100" font-size="10" fill="#999">∂L/∂W₀ = 0 (冻结)</text>
  
  <!-- 图例 -->
  <rect x="20" y="280" width="560" height="60" rx="6" fill="#f9f9f9" stroke="#ddd"/>
  <text x="40" y="305" font-size="12" font-weight="bold">图例：</text>
  <line x1="40" y1="320" x2="80" y2="320" stroke="#27ae60" stroke-width="2"/>
  <text x="85" y="323" font-size="11">绿色 = 梯度可流向可训练参数 (B, A)</text>
  <line x1="350" y1="320" x2="390" y2="320" stroke="#999" stroke-width="2"/>
  <text x="395" y="323" font-size="11">灰色 = 冻结，无梯度更新</text>
</svg>
