<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 480" font-family="sans-serif">
  <defs>
    <marker id="arrFwd" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3B82F6"/>
    </marker>
    <marker id="arrGrad" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#EF4444"/>
    </marker>
    <marker id="arrGray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F2937">Prompt Tuning 梯度流向图</text>
  <text x="410" y="50" text-anchor="middle" font-size="14" fill="#6B7280">前向传播 (蓝色 -->) 与 反向传播 (红色 &lt;--)</text>

  <!-- ===== Forward path (left side) ===== -->
  <text x="200" y="82" text-anchor="middle" font-size="16" fill="#3B82F6" font-weight="bold">前向传播</text>

  <!-- Soft Prompt -->
  <rect x="40" y="95" width="130" height="40" rx="8" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/>
  <text x="105" y="120" text-anchor="middle" font-size="13" fill="#059669" font-weight="bold">Soft Prompt P_e</text>

  <!-- Input X -->
  <rect x="200" y="95" width="130" height="40" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="265" y="120" text-anchor="middle" font-size="13" fill="#3B82F6">输入 X_e</text>

  <!-- Concat -->
  <rect x="80" y="160" width="230" height="35" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="195" y="183" text-anchor="middle" font-size="13" fill="#1D4ED8">拼接 [P_e ; X_e]</text>
  <line x1="105" y1="135" x2="150" y2="160" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrFwd)"/>
  <line x1="265" y1="135" x2="240" y2="160" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrFwd)"/>

  <!-- Transformer -->
  <rect x="80" y="220" width="230" height="50" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <text x="195" y="245" text-anchor="middle" font-size="13" fill="#6B7280">Transformer (冻结)</text>
  <text x="195" y="262" text-anchor="middle" font-size="11" fill="#9CA3AF">theta 不更新</text>
  <line x1="195" y1="195" x2="195" y2="220" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrFwd)"/>

  <!-- Output -->
  <rect x="110" y="295" width="170" height="38" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="195" y="319" text-anchor="middle" font-size="13" fill="#92400E">输出 Y_hat</text>
  <line x1="195" y1="270" x2="195" y2="295" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrFwd)"/>

  <!-- Loss -->
  <rect x="120" y="358" width="150" height="38" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="195" y="382" text-anchor="middle" font-size="13" fill="#DC2626" font-weight="bold">Loss L</text>
  <line x1="195" y1="333" x2="195" y2="358" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arrFwd)"/>

  <!-- ===== Backward path (right side) ===== -->
  <text x="610" y="82" text-anchor="middle" font-size="16" fill="#EF4444" font-weight="bold">反向传播 (梯度)</text>

  <!-- Loss grad -->
  <rect x="530" y="358" width="160" height="38" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="610" y="382" text-anchor="middle" font-size="13" fill="#DC2626">dL/dY_hat</text>

  <!-- Grad through transformer -->
  <rect x="490" y="220" width="240" height="50" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <text x="610" y="242" text-anchor="middle" font-size="12" fill="#6B7280">梯度穿过 Transformer</text>
  <text x="610" y="258" text-anchor="middle" font-size="11" fill="#9CA3AF">(仅传递，不更新 theta)</text>
  <line x1="610" y1="358" x2="610" y2="270" stroke="#EF4444" stroke-width="2" marker-end="url(#arrGrad)"/>

  <!-- Grad splits -->
  <!-- To Soft Prompt - GREEN: gets updated! -->
  <rect x="455" y="95" width="145" height="50" rx="8" fill="#DCFCE7" stroke="#10B981" stroke-width="2.5"/>
  <text x="527" y="116" text-anchor="middle" font-size="13" fill="#059669" font-weight="bold">dL/dP_e</text>
  <text x="527" y="135" text-anchor="middle" font-size="12" fill="#059669">更新 theta_P!</text>
  <line x1="560" y1="220" x2="527" y2="145" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrGreen)"/>

  <!-- To Input X - GRAY: no update -->
  <rect x="630" y="95" width="145" height="50" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="702" y="116" text-anchor="middle" font-size="13" fill="#9CA3AF">dL/dX_e</text>
  <text x="702" y="135" text-anchor="middle" font-size="11" fill="#9CA3AF">不更新(输入固定)</text>
  <line x1="660" y1="220" x2="702" y2="145" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrGray)"/>

  <!-- Big highlight arrow showing the key point -->
  <rect x="430" y="165" width="190" height="30" rx="6" fill="#10B981" opacity="0.15"/>
  <text x="525" y="185" text-anchor="middle" font-size="13" fill="#059669" font-weight="bold">唯一更新的参数!</text>

  <!-- Summary box at bottom -->
  <rect x="130" y="420" width="560" height="50" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
  <text x="410" y="442" text-anchor="middle" font-size="14" fill="#059669" font-weight="bold">关键: 梯度流经整个模型，但只有 P_e 被更新</text>
  <text x="410" y="460" text-anchor="middle" font-size="12" fill="#059669">Transformer 参数 theta 仅做前向计算和梯度传递，自身不改变</text>
</svg>