<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="sans-serif">
  <defs>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6B7280"/>
    </marker>
    <marker id="arrowG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1F2937">Prompt Tuning 工作机制</text>

  <!-- Step labels on left -->
  <text x="30" y="105" text-anchor="middle" font-size="13" fill="#6B7280" transform="rotate(-90, 30, 105)">嵌入层</text>
  <text x="30" y="280" text-anchor="middle" font-size="13" fill="#6B7280" transform="rotate(-90, 30, 280)">Transformer</text>
  <text x="30" y="430" text-anchor="middle" font-size="13" fill="#6B7280" transform="rotate(-90, 30, 430)">输出</text>

  <!-- Original input tokens -->
  <g transform="translate(250, 55)">
    <text x="175" y="0" text-anchor="middle" font-size="14" fill="#3B82F6" font-weight="bold">原始输入 X (n 个 token)</text>
    <rect x="0" y="10" width="70" height="35" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="35" y="33" text-anchor="middle" font-size="12" fill="#3B82F6">x_1</text>
    <rect x="80" y="10" width="70" height="35" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="115" y="33" text-anchor="middle" font-size="12" fill="#3B82F6">x_2</text>
    <rect x="160" y="10" width="50" height="35" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="185" y="33" text-anchor="middle" font-size="12" fill="#3B82F6">...</text>
    <rect x="220" y="10" width="70" height="35" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="255" y="33" text-anchor="middle" font-size="12" fill="#3B82F6">x_n</text>
  </g>

  <!-- Soft prompt tokens -->
  <g transform="translate(55, 55)">
    <text x="85" y="0" text-anchor="middle" font-size="14" fill="#10B981" font-weight="bold">Soft Prompt P (p 个)</text>
    <rect x="0" y="10" width="55" height="35" rx="6" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/>
    <text x="27" y="33" text-anchor="middle" font-size="12" fill="#059669">p_1</text>
    <rect x="60" y="10" width="55" height="35" rx="6" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/>
    <text x="87" y="33" text-anchor="middle" font-size="12" fill="#059669">p_2</text>
    <rect x="120" y="10" width="55" height="35" rx="6" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/>
    <text x="147" y="33" text-anchor="middle" font-size="12" fill="#059669">...</text>
  </g>

  <!-- Embedding layer: concatenated -->
  <g transform="translate(55, 130)">
    <text x="-10" y="20" text-anchor="end" font-size="13" fill="#6B7280">嵌入:</text>
    <!-- Soft prompt embeddings -->
    <rect x="0" y="5" width="170" height="32" rx="6" fill="#DCFCE7" stroke="#10B981" stroke-width="2"/>
    <text x="85" y="26" text-anchor="middle" font-size="13" fill="#059669" font-weight="bold">P_e (p x e)</text>
    <!-- Semicolon -->
    <text x="180" y="26" text-anchor="middle" font-size="18" fill="#374151" font-weight="bold">;</text>
    <!-- Input embeddings -->
    <rect x="192" y="5" width="350" height="32" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <text x="367" y="26" text-anchor="middle" font-size="13" fill="#3B82F6" font-weight="bold">X_e (n x e)</text>
    <!-- Combined label -->
    <text x="580" y="26" text-anchor="start" font-size="13" fill="#374151">= [P_e ; X_e]</text>
    <text x="580" y="45" text-anchor="start" font-size="12" fill="#6B7280">(p+n) x e</text>
  </g>

  <!-- Arrow from embedding to transformer -->
  <line x1="300" y1="170" x2="300" y2="195" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Transformer block (frozen) -->
  <rect x="70" y="200" width="500" height="160" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2.5"/>
  <!-- Frozen badge -->
  <rect x="75" y="205" width="70" height="22" rx="4" fill="#9CA3AF"/>
  <text x="110" y="220" text-anchor="middle" font-size="11" fill="white" font-weight="bold">冻结</text>

  <text x="320" y="240" text-anchor="middle" font-size="16" fill="#6B7280" font-weight="bold">Encoder-Decoder Transformer</text>
  <text x="320" y="262" text-anchor="middle" font-size="13" fill="#9CA3AF">Self-Attention + Cross-Attention + FFN</text>

  <!-- Internal layers illustration -->
  <rect x="100" y="278" width="130" height="28" rx="5" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  <text x="165" y="297" text-anchor="middle" font-size="11" fill="#6B7280">Encoder Layer 1...L</text>
  <rect x="260" y="278" width="30" height="28" rx="5" fill="#E5E7EB"/>
  <text x="275" y="297" text-anchor="middle" font-size="14" fill="#9CA3AF">...</text>
  <rect x="310" y="278" width="130" height="28" rx="5" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1"/>
  <text x="375" y="297" text-anchor="middle" font-size="11" fill="#6B7280">Decoder Layer 1...L</text>

  <text x="320" y="340" text-anchor="middle" font-size="14" fill="#9CA3AF">所有参数 (theta) 完全冻结，不接收梯度</text>

  <!-- Arrow to output -->
  <line x1="300" y1="360" x2="300" y2="395" stroke="#6B7280" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Output -->
  <rect x="150" y="400" width="340" height="40" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
  <text x="320" y="425" text-anchor="middle" font-size="14" fill="#92400E" font-weight="bold">输出 Y = argmax Pr(Y | [P; X])</text>

  <!-- Annotation: only P_e is trainable -->
  <rect x="600" y="200" width="180" height="90" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1.5"/>
  <text x="690" y="222" text-anchor="middle" font-size="13" fill="#059669" font-weight="bold">可训练参数</text>
  <text x="690" y="242" text-anchor="middle" font-size="12" fill="#059669">仅 P_e (theta_P)</text>
  <text x="690" y="262" text-anchor="middle" font-size="12" fill="#059669">维度: p x e</text>
  <text x="690" y="280" text-anchor="middle" font-size="12" fill="#059669">占比 &lt; 0.01%</text>
  <!-- Arrow from annotation to soft prompt -->
  <line x1="600" y1="245" x2="175" y2="155" stroke="#10B981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowG)"/>

  <!-- Bottom note -->
  <text x="400" y="475" text-anchor="middle" font-size="13" fill="#6B7280">核心思想: 将任务知识浓缩进少量可训练的 "soft prompt" 向量，模型其余部分完全不动</text>
</svg>