<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" font-family="sans-serif">
  <style>
    .title { font-size: 15px; font-weight: bold; fill: #333; }
    .axis { font-size: 11px; fill: #666; }
    .label { font-size: 11px; }
  </style>
  
  <!-- Title -->
  <text x="350" y="25" text-anchor="middle" class="title">RLHF训练迭代过程：概率分布如何变化</text>
  
  <!-- Axes -->
  <line x1="80" y1="60" x2="80" y2="280" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="280" x2="650" y2="280" stroke="#333" stroke-width="1.5"/>
  <text x="40" y="170" text-anchor="middle" class="axis" transform="rotate(-90 40 170)">概率</text>
  <text x="365" y="310" text-anchor="middle" class="axis">训练轮次</text>
  
  <!-- Y-axis labels -->
  <text x="70" y="283" text-anchor="end" class="axis">0</text>
  <text x="70" y="228" text-anchor="end" class="axis">0.25</text>
  <text x="70" y="173" text-anchor="end" class="axis">0.50</text>
  <text x="70" y="118" text-anchor="end" class="axis">0.75</text>
  <text x="70" y="63" text-anchor="end" class="axis">1.0</text>
  
  <!-- Grid lines -->
  <line x1="80" y1="225" x2="650" y2="225" stroke="#eee" stroke-width="0.5"/>
  <line x1="80" y1="170" x2="650" y2="170" stroke="#eee" stroke-width="0.5"/>
  <line x1="80" y1="115" x2="650" y2="115" stroke="#eee" stroke-width="0.5"/>
  <line x1="80" y1="60" x2="650" y2="60" stroke="#eee" stroke-width="0.5"/>
  
  <!-- Round markers -->
  <text x="120" y="298" text-anchor="middle" class="axis">初始</text>
  <text x="230" y="298" text-anchor="middle" class="axis">第1轮</text>
  <text x="340" y="298" text-anchor="middle" class="axis">第5轮</text>
  <text x="450" y="298" text-anchor="middle" class="axis">第20轮</text>
  <text x="560" y="298" text-anchor="middle" class="axis">第100轮</text>
  
  <!-- Word A: "好的，我来帮你" (high reward) - Green line -->
  <polyline points="120,225 230,210 340,175 450,120 560,75" fill="none" stroke="#27ae60" stroke-width="3"/>
  <circle cx="120" cy="225" r="5" fill="#27ae60"/>
  <circle cx="230" cy="210" r="5" fill="#27ae60"/>
  <circle cx="340" cy="175" r="5" fill="#27ae60"/>
  <circle cx="450" cy="120" r="5" fill="#27ae60"/>
  <circle cx="560" cy="75" r="5" fill="#27ae60"/>
  <text x="575" y="78" class="label" fill="#27ae60" font-weight="bold">高奖励回复</text>
  
  <!-- Word B: "我不知道" (medium reward) - Blue line -->
  <polyline points="120,225 230,222 340,218 450,210 560,200" fill="none" stroke="#3498db" stroke-width="3"/>
  <circle cx="120" cy="225" r="5" fill="#3498db"/>
  <circle cx="230" cy="222" r="5" fill="#3498db"/>
  <circle cx="340" cy="218" r="5" fill="#3498db"/>
  <circle cx="450" cy="210" r="5" fill="#3498db"/>
  <circle cx="560" cy="200" r="5" fill="#3498db"/>
  <text x="575" y="203" class="label" fill="#3498db">中等奖励</text>
  
  <!-- Word C: "滚开" (negative reward) - Red line -->
  <polyline points="120,225 230,238 340,255 450,268 560,275" fill="none" stroke="#e74c3c" stroke-width="3"/>
  <circle cx="120" cy="225" r="5" fill="#e74c3c"/>
  <circle cx="230" cy="238" r="5" fill="#e74c3c"/>
  <circle cx="340" cy="255" r="5" fill="#e74c3c"/>
  <circle cx="450" cy="268" r="5" fill="#e74c3c"/>
  <circle cx="560" cy="275" r="5" fill="#e74c3c"/>
  <text x="575" y="278" class="label" fill="#e74c3c">负奖励回复</text>
  
  <!-- Word D: "让我想想" (positive reward) - Orange line -->
  <polyline points="120,225 230,220 340,212 450,198 560,185" fill="none" stroke="#f39c12" stroke-width="3"/>
  <circle cx="120" cy="225" r="5" fill="#f39c12"/>
  <circle cx="230" cy="220" r="5" fill="#f39c12"/>
  <circle cx="340" cy="212" r="5" fill="#f39c12"/>
  <circle cx="450" cy="198" r="5" fill="#f39c12"/>
  <circle cx="560" cy="185" r="5" fill="#f39c12"/>
  <text x="575" y="188" class="label" fill="#f39c12">正奖励回复</text>
  
  <!-- KL constraint annotation -->
  <rect x="80" y="320" width="570" height="25" rx="4" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="365" y="337" text-anchor="middle" font-size="11" fill="#666">KL约束的作用：防止概率分布偏离初始状态太远（安全绳效应）</text>
</svg>
